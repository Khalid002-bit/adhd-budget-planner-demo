  const TYPES = [['credit', 'Credit Card'], ['personal', 'Personal Loan'], ['student', 'Student Loan'],
    ['car', 'Car Loan'], ['other', 'Other Debt']];

  function summary() {
    const debts = MF.store.list('debts').filter(d => !d.paidOff);
    const total = MF.sum(debts.map(d => d.balanceCents));
    const min = MF.sum(debts.map(d => d.minPaymentCents || 0));
    const origAll = MF.store.list('debts');
    const origTotal = MF.sum(origAll.map(d => d.originalCents || d.balanceCents));
    return { total, min, origTotal, count: debts.length };
  }

  function debtCard(d) {
    const pct = d.originalCents ? 100 * (1 - d.balanceCents / d.originalCents) : 0;
    return '<div class="goal-card debt-card" data-id="' + eH(d.id) + '">' +
      '<div class="goal-top"><span class="dot dot-lg" style="background:#d6473f"></span>' +
      '<div><div class="row-title">' + eH(d.name) + '</div><div class="row-sub">' + eH((TYPES.find(t => t[0] === d.type) || [, 'Debt'])[1]) +
      ' · ' + (d.apr ? (d.apr / 100).toFixed(2) + '% APR' : '0% interest') + '</div></div></div>' +
      MF.ui.bar(pct) +
      '<div class="goal-nums"><strong>' + eH(fmt(Math.max(0, d.balanceCents))) + '</strong> remaining of ' + eH(fmt(d.originalCents)) + '</div>' +
      '<div class="row-sub">Min payment ' + eH(fmt(d.minPaymentCents)) + ' · next ' + eH(d.nextDue ? D.fmtHuman(d.nextDue) : '—') + '</div>' +
      '<div class="btn-row goal-actions">' +
      '<button class="btn btn-primary btn-sm" data-pay="' + eH(d.id) + '">Record payment</button>' +
      '<button class="icon-btn" data-edit="' + eH(d.id) + '" aria-label="Edit">' + MF.icon('edit') + '</button>' +
      '<button class="icon-btn" data-del="' + eH(d.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button></div></div>';
  }

  function formModal(existing) {
    const f = MF.ui.form;
    const s = existing || {};
    const body =
      f.input('Debt name', { name: 'name', value: s.name || '', required: true, maxlength: 50, placeholder: 'e.g. Visa card' }) +
      f.select('Type', { name: 'type', value: s.type || 'credit', options: TYPES }) +
      '<div class="form-2col">' +
      f.input('Original balance', { name: 'original', type: 'number', step: '0.01', required: true, value: s.originalCents ? (s.originalCents / 100).toFixed(2) : (s.balanceCents ? (s.balanceCents / 100).toFixed(2) : '') }) +
      f.input('Current balance owed', { name: 'balance', type: 'number', step: '0.01', required: true, value: s.balanceCents ? (s.balanceCents / 100).toFixed(2) : '' }) + '</div>' +
      '<div class="form-2col">' +
      f.input('Interest rate APR % (0 if none)', { name: 'apr', type: 'number', step: '0.01', min: 0, max: 99.99, value: s.apr ? (s.apr / 100).toFixed(2) : '' }) +
      f.select('Payment frequency', { name: 'frequency', value: s.frequency || 'monthly', options: [['weekly', 'Weekly'], ['biweekly', 'Every two weeks'], ['monthly', 'Monthly']] }) + '</div>' +
      '<div class="form-2col">' +
      f.input('Minimum payment', { name: 'minPayment', type: 'number', min: 0, step: '0.01', required: true, value: s.minPaymentCents ? (s.minPaymentCents / 100).toFixed(2) : '' }) +
      f.input('Next payment due', { name: 'nextDue', type: 'date', value: s.nextDue || D.today() }) + '</div>' +
      '<label class="toggle-row"><span>Payment comes from</span>' +
      '<select name="accountId" class="inline-select">' + MF.accounts.activeAccounts().map(a => '<option value="' + eH(a.id) + '"' + (a.id === s.accountId ? ' selected' : '') + '>' + eH(a.name) + '</option>').join('') + '</select></label>';
    const m = MF.ui.modal({
      title: existing ? 'Edit debt' : 'Add a debt', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Add debt') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const bal = MF.money.parse(d.balance), orig = MF.money.parse(d.original);
        if (!d.name) throw new Error('Give this debt a name');
        if (bal == null || bal <= 0) throw new Error('Enter the balance you currently owe');
        const data = {
          name: d.name, type: d.type,
          originalCents: orig != null ? Math.max(orig, bal) : bal,
          balanceCents: bal,
          apr: Math.round((parseFloat(d.apr) || 0) * 100),
          frequency: d.frequency, minPaymentCents: MF.money.parse(d.minPayment) || 0,
          nextDue: d.nextDue || null, accountId: d.accountId || null
        };
        if (existing) Object.assign(existing, data);
        else MF.store.list('debts').push(Object.assign({ id: MF.uid('debt'), paidHistory: [], totalInterestCents: 0 }, data));
        MF.storage.save(); MF.ui.closeModal(); MF.ui.toast(existing ? 'Debt updated' : 'Debt added', 'success');
        MF.app.milestones(); MF.app.rerender();
      }
    });
    return m;
  }

  function payModal(d, extra) {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Payment — ' + d.name,
      body:
        f.input('Amount paid', { name: 'amount', type: 'number', step: '0.01', required: true, value: (d.minPaymentCents ? d.minPaymentCents / 100 : '') + (extra ? '' : '') }) +
        f.input('Date paid', { name: 'date', type: 'date', value: D.today() }) +
        f.select('From account', { name: 'accountId', value: d.accountId || (MF.store.defaultAccount() || {}).id || '', options: MF.accounts.activeAccounts().map(a => [a.id, a.name]) }) +
        '<p class="hint">Interest is calculated on the balance using APR divided by 365 per day, for the days between payments. The rest of your payment reduces what you owe.</p>',
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Record payment</button>',
      onOk(modal) {
        const dd = MF.ui.formData(modal);
        const amt = MF.money.parse(dd.amount);
        if (!amt || amt <= 0) throw new Error('Enter the amount you paid');
        const res = MF.calc.debt.recordDebtPayment(d, amt, d.nextDue, dd.accountId, dd.date);
        MF.ui.closeModal();
        if (res.duplicate) MF.ui.toast('A payment was already recorded for that due date.', 'warn');
        else {
          MF.ui.toast(res.debt.paidOff ? '🎉 Debt completely paid off — you did it!' : 'Payment recorded', 'success');
          MF.app.milestones();
        }
        MF.app.rerender();
      }
    });
    if (d.minPaymentCents) m.querySelector('[name="amount"]').value = (d.minPaymentCents / 100).toFixed(2);
    return m;
  }

  function render(el) {
    const debts = MF.store.list('debts');
    const open = debts.filter(d => !d.paidOff);
    const done = debts.filter(d => d.paidOff);
    const s = summary();
    const strategy = MF.store.settings().debtStrategy || 'snowball';
    const planElStrategy = strategy === 'avalanche' ? 'Avalanche (highest interest first)' : 'Snowball (smallest balance first)';
    const noMin = open.every(d => d.minPaymentCents > 0);
    const sim = noMin ? MF.calc.debt.debtSimulation(open, 0) : null;
    const simExtra = noMin ? MF.calc.debt.debtSimulation(open, 5000) : null;

    el.innerHTML =
      '<header class="page-head"><div><h2>Debt Manager</h2><p class="page-sub">' + s.count + ' debts · ' + eH(fmt(s.total)) + ' owed · minimums ' + eH(fmt(s.min)) + '/month</p></div>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' Add debt</button></div></header>' +

      '<section class="grid grids-3 cards-stats">' +
      statCard('Total remaining', s.total, 'neg') +
      statCard('Paid off so far', Math.max(0, s.origTotal - s.total), 'pos') +
      statCard('Interest paid so far', MF.sum(debts.map(d => d.totalInterestCents || 0))) + '</section>' +

      '<section class="card"><div class="plan-head"><h4>Payoff plan — ' + eH(planElStrategy) + '</h4>' +
      '<div class="btn-row">' +
      '<button class="btn ' + (strategy === 'snowball' ? 'btn-secondary' : 'btn-ghost') + ' btn-sm" data-strategy="snowball">Snowball</button>' +
      '<button class="btn ' + (strategy === 'avalanche' ? 'btn-secondary' : 'btn-ghost') + ' btn-sm" data-strategy="avalanche">Avalanche</button>' +
      '</div></div>' +
      '<div class="grid grids-2">' +
      '<div class="info-box"><h5>No extra payments</h5><p>Debt-free estimate: <strong>' +
      (sim && sim.debtFreeDate ? D.fmtHuman(sim.debtFreeDate, { style: 'YMD' }) : 'add minimum payments to estimate') + '</strong> · projected interest: <strong>' + (sim ? fmt(sim.interestTotal) : '—') + '</strong></p></div>' +
      '<div class="info-box"><h5>With $50 extra per month</h5><p>Debt-free estimate: <strong>' +
      (simExtra && simExtra.debtFreeDate ? D.fmtHuman(simExtra.debtFreeDate, { style: 'YMD' }) : '—') + '</strong> · projected interest: <strong>' + (simExtra ? fmt(simExtra.interestTotal) : '—') + '</strong></p><p class="hint">' +
      (sim && simExtra && sim.interestTotal > simExtra.interestTotal ? 'That could save about <strong>' + fmt(sim.interestTotal - simExtra.interestTotal) + '</strong>.' : '') + '</p></div>' +
      '</div>' +
      '<p class="hint">These are projections. Actual results depend on real payment timing and each lender’s terms (for example, how interest is billed).</p></section>' +

      '<div class="grid grids-2">' + open.map(debtCard).join('') + '</div>' +
      (!open.length ? '<p class="empty card empty-pad">' + (debts.length ? 'All debts paid off — congratulations! 🎉' : 'No debts tracked. That’s also great.') + '</p>' : '') +
      (done.length ? '<h3 class="sect">Paid off</h3><div class="list">' + done.map(d =>
        '<div class="row"><div class="row-main"><div><div class="row-title">' + eH(d.name) + '</div><div class="row-sub">Paid off ' + (d.paidOffDate || '') + '</div></div></div><span class="pill pill-pos">done</span></div>').join('') + '</div>' : '');
    function statCard(label, cents, cls) {
      return '<div class="card stat"><div class="stat-label">' + eH(label) + '</div><div class="stat-val ' + (cls || '') + '">' + eH(fmt(cents)) + '</div></div>';
    }
    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    el.querySelectorAll('[data-strategy]').forEach(b => b.addEventListener('click', () => {
      MF.store.setSetting('debtStrategy', b.dataset.strategy); MF.ui.toast('Strategy set to ' + b.dataset.strategy, 'success'); MF.app.rerender();
    }));
    el.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => payModal(MF.store.find('debts', b.dataset.pay))));
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formModal(MF.store.find('debts', b.dataset.edit))));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(MF.store.find('debts', b.dataset.del))));
  }
  function del(d) {
    MF.ui.confirm('Delete “' + d.name + '”?', 'Payments already recorded become normal payments in your history. Deleting cannot be undone.', true, 'Delete')
      .then(ok => { if (ok) { MF.store.remove('debts', d.id); MF.app.rerender(); } });
  }

  MF.debt = { render, formModal, payModal, summary };
})();
</script>
<script>/* ============================================================
   MindFlow — spending envelopes (category budgets)
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  function ensureDefaults() {
    const have = MF.store.list('envelopes');
    const defaults = [
      ['Groceries', 'cat_groceries', 40000, 'monthly', '#2f9e6e'],
      ['Dining', 'cat_dining', 12000, 'monthly', '#e07a5f'],
      ['Transportation', 'cat_transportation', 15000, 'monthly', '#4c8fd6'],
      ['Fun / Entertainment', 'cat_entertainment', 10000, 'monthly', '#3aa6a6'],
      ['Household', 'cat_household', 8000, 'monthly', '#c9973a']
    ];
    return defaults.filter(d => !have.some(e => e.categoryId === d[1]));
  }

  function status(e) {
    const { spent, from, to } = MF.calc.envelopeSpend(e);
    const pct = e.limitCents ? 100 * spent / e.limitCents : 0;
    const remaining = e.limitCents - spent;
    let cls = 'pos', label = 'On track';
    if (pct >= 100) { cls = 'neg'; label = 'Over limit'; }
    else if (pct >= 85) { cls = 'warn'; label = 'Close to limit'; }
    return { spent, from, to, pct, remaining, cls, label };
  }

  function envelopeCard(e) {
    const st = status(e);
    return '<div class="goal-card env-card" data-id="' + eH(e.id) + '">' +
      '<div class="goal-top"><span class="dot dot-lg" style="background:' + eH(e.color) + '"></span>' +
      '<div><div class="row-title">' + eH(e.name) + '</div><div class="row-sub">' + eH(e.period || 'monthly') + ' budget</div></div></div>' +
      MF.ui.bar(st.pct) +
      '<div class="goal-nums"><strong>' + eH(fmt(st.spent)) + '</strong> spent of ' + eH(fmt(e.limitCents)) +
      ' <span class="pill pill-' + st.cls + '">' + eH(st.label) + '</span></div>' +
      '<div class="row-sub">' + (st.remaining >= 0 ? eH(fmt(st.remaining)) + ' left' : eH(fmt(-st.remaining)) + ' over') +
      ' · ' + eH(D.fmtHuman(st.from)) + ' → today</div>' +
      '<div class="btn-row goal-actions">' +
      '<button class="btn btn-ghost btn-sm" data-edit="' + eH(e.id) + '">' + MF.icon('edit', 'sm') + ' Edit</button>' +
      '<button class="btn btn-ghost btn-sm" data-move="' + eH(e.id) + '">Move money</button>' +
      '<button class="icon-btn" data-del="' + eH(e.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button></div></div>';
  }

  function formModal(existing, presetCategory) {
    const f = MF.ui.form;
    const s = existing || {};
    const body =
      f.input('Envelope name', { name: 'name', value: s.name || '', required: true, maxlength: 40, placeholder: 'e.g. Groceries' }) +
      f.select('Tracks spending category', { name: 'categoryId', value: s.categoryId || (presetCategory || ''), options: [['', '— choose —']].concat(MF.store.categories().map(c => [c.id, c.name])) }) +
      f.input('Budget limit for the period', { name: 'limit', type: 'number', step: '0.01', required: true, value: s.limitCents ? (s.limitCents / 100).toFixed(2) : '' }) +
      f.select('Pay period', { name: 'period', value: s.period || 'monthly', options: [['weekly', 'Weekly'], ['biweekly', 'Every two weeks'], ['monthly', 'Monthly']] }) +
      f.color('Color', { name: 'color', value: s.color || '#2f9e6e' });
    const m = MF.ui.modal({
      title: existing ? 'Edit envelope' : 'New envelope', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Create envelope') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const lim = MF.money.parse(d.limit);
        if (lim == null || lim <= 0) throw new Error('Enter a budget limit (greater than zero)');
        const data = { name: d.name, categoryId: d.categoryId || null, limitCents: lim, period: d.period, color: d.__color };
        if (existing) Object.assign(existing, data);
        else MF.store.list('envelopes').push(Object.assign({ id: MF.uid('env') }, data));
        MF.storage.save();
        MF.ui.closeModal(); MF.ui.toast('Envelope saved', 'success'); MF.app.rerender();
      }
    });
    return m;
  }

  function moveModal(env) {
    const envs = MF.store.list('envelopes').filter(e => e.id !== env.id);
    if (!envs.length) { MF.ui.toast('Create another envelope to move money into.', 'warn'); return; }
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Move budget money',
      body: '<p class="confirm-msg">From “' + eH(env.name) + '”</p>' +
        f.select('To envelope', { name: 'to', options: envs.map(x => [x.id, x.name]) }) +
        f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true }),
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Move</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!amt || amt <= 0) throw new Error('Enter an amount greater than zero');
        const target = MF.store.find('envelopes', d.to);
        env.limitCents = Math.max(0, env.limitCents - amt);
        target.limitCents += amt;
        MF.storage.save(); MF.ui.closeModal(); MF.ui.toast('Moved ' + fmt(amt) + ' to “' + target.name + '”', 'success'); MF.app.rerender();
      }
    });
    return m;
  }

  function del(e) {
    MF.ui.confirm('Delete envelope “' + e.name + '”?', 'This only removes the budget limit. Your transactions are untouched.', true, 'Delete')
      .then(ok => { if (ok) { MF.store.remove('envelopes', e.id); MF.app.rerender(); } });
  }

  function render(el) {
    const envs = MF.store.list('envelopes');
    const sug = ensureDefaults();
    const warn = envs.map(status).filter(s => s.cls !== 'pos').length;
    el.innerHTML =
      '<header class="page-head"><div><h2>Spending Envelopes</h2><p class="page-sub">' + envs.length + ' envelope(s)' +
      (warn ? ' · <span class="pill pill-warn">' + warn + ' need attention</span>' : ' · all on track') + '</p></div>' +
      '<div class="btn-row">' +
      (sug.length ? '<button class="btn btn-secondary" data-act="defaults">Add starter set</button>' : '') +
      '<button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' New envelope</button></div></header>' +
      '<p class="hint page-inline">Each envelope watches one spending category for the chosen period. Spending “over” means the budget for this period is exhausted — it happens, it is just a signal, not a judgment.</p>' +
      '<div class="grid grids-2">' + envs.map(envelopeCard).join('') + '</div>' +
      (!envs.length ? '<p class="empty card empty-pad">No envelopes yet. Envelopes help you see how much remains for a category before you spend it.</p>' : '');
    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    const defBtn = el.querySelector('[data-act="defaults"]');
    if (defBtn) defBtn.addEventListener('click', () => {
      sug.forEach(d => MF.store.list('envelopes').push({ id: MF.uid('env'), name: d[0], categoryId: d[1], limitCents: d[2], period: d[3], color: d[4] }));
      MF.storage.save(); MF.ui.toast('Starter envelopes added — adjust their limits anytime', 'success'); MF.app.rerender();
    });
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formModal(MF.store.find('envelopes', b.dataset.edit))));
    el.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => moveModal(MF.store.find('envelopes', b.dataset.move))));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(MF.store.find('envelopes', b.dataset.del))));
  }

  MF.envelopes = { render, formModal, status };
})();
</script>
<script>/* ============================================================
   MindFlow — transaction form (add/edit expense, income, refund
   recording, splitting). Reused by dashboard, transactions page,
   calendar and quick actions.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  function expenseModal(existing, opts) {
    opts = opts || {};
    if (!existing && opts.type !== 'income' && MF.spendDemo.atLimit()) {
      MF.ui.toast(MF.spendDemo.message);
      return null;
    }
    const f = MF.ui.form;
    const s = existing || {};
    const linkedTx = existing && (existing.billId || existing.debtId || existing.goalId);
    const transferTx = existing && existing.type === 'transfer';
    const accs = MF.accounts.activeAccounts();
    const defAcc = (MF.store.defaultAccount() || {}).id || '';
    if (!accs.length) { MF.ui.toast('Add an account first (Settings → Accounts).', 'warn'); MF.accounts.formModal(null); return null; }

    const body =
      (transferTx && !linkedTx ? '<p class="info-box">Transfer — this stays a transfer and is excluded from income and expense reports.</p>' : linkedTx ?
        '<p class="info-box">Linked payment — it stays a ' + (existing.type === 'transfer' ? 'transfer' : eH(existing.type || 'transaction')) +
        '. Amount, date or account changes here update the bill, debt or goal it is linked to.</p>' :
        '<div id="tf-type-row" class="seg-row" role="radiogroup" aria-label="Transaction type">' +
        ['expense', 'income'].map(t =>
          '<label class="seg"><input type="radio" name="txType" value="' + t + '"' + ((s.type && s.type !== 'transfer' ? s.type : 'expense') === t ? ' checked' : '') + '><span>' + (t === 'expense' ? 'Expense' : 'Income') + '</span></label>').join('') +
        '</div>') +
      f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true, value: s.amountCents ? (s.amountCents / 100).toFixed(2) : '', placeholder: '0.00' }) +
      f.input('Description', { name: 'description', value: s.description || '', maxlength: 80, required: true, placeholder: 'e.g. groceries at market' }) +
      '<div class="form-2col">' +
      '<label class="field" id="tf-cat-field"><span class="field-label">Category</span><select name="categoryId">' +
      MF.store.categories().map(c => '<option value="' + eH(c.id) + '"' + ((s.categoryId || 'cat_groceries') === c.id ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') +
      '</select></label>' +
      f.input('Date', { name: 'date', type: 'date', required: true, value: s.date || opts.date || D.today() }) + '</div>' +
      f.select(existing && existing.goalWithdraw ? 'Money going to' : opts.type === 'income' ? 'Deposit into' : 'Pay from', { name: 'accountId', value: existing && existing.goalWithdraw ? s.toAccountId : s.accountId || defAcc, options: accs.map(a => [a.id, a.name]) }) +
      f.input('Notes (optional)', { name: 'notes', value: s.notes || '', maxlength: 200 }) +
      f.input('Tags, comma-separated (optional)', { name: 'tags', value: (s.tags || []).join(', '), maxlength: 120 }) +
      (opts.type !== 'income' ? f.toggle('Refundable? (e.g. purchase you might return)', { name: 'refundable', checked: !!s.refundable }) : '') +
      (opts.quickParse ? '<p class="info-box">Understood: <strong>' + eH(fmt(opts.quickParse.amountCents)) + '</strong>' +
        (opts.quickParse.categoryName ? ' · category “' + eH(opts.quickParse.categoryName) + '”' : '') +
        (opts.quickParse.description ? ' · “' + eH(opts.quickParse.description) + '”' : '') +
        ' — check the fields below and fix anything.</p>' : '');
    const m = MF.ui.modal({
      title: existing ? 'Edit transaction' : (opts.type === 'income' ? 'Add income' : 'Add expense'),
      body, wide: true,
      footer: (existing ? '<button class="btn btn-ghost btn-danger-text" data-x="del">Delete</button>' : '') +
        '<button class="btn btn-ghost" data-act="cancel">Cancel</button>' +
        '<button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Add') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!d.description) throw new Error('Add a short description');
        if (amt == null || amt <= 0) throw new Error('Enter an amount greater than zero');
        const data = {
          type: d.txType, amountCents: amt, description: d.description,
          categoryId: linkedTx || transferTx ? existing.categoryId : d.categoryId, date: d.date, accountId: d.accountId,
          notes: d.notes, tags: (d.tags || '').split(',').map(x => x.trim()).filter(Boolean),
          refundable: opts.type === 'income' ? false : !!d.refundable
        };
        if (linkedTx || transferTx) {
          // linked bill/debt/goal payments keep their recorded type (a credit-card
          // bill payment is a TRANSFER — turning it into an expense in an edit
          // used to double-charge the account) and go through MF.tx.update so the
          // linked record is synchronized
          delete data.type;
          delete data.refundable;
          if (existing.goalId && existing.goalWithdraw) {
            data.toAccountId = d.accountId;
            data.accountId = existing.accountId;
          }
          MF.tx.update(existing.id, data);
        } else if (existing) {
          // category of income txns forced
          if (data.type === 'income') data.categoryId = 'cat_income';
          MF.tx.update(existing.id, data);
        } else {
          if (data.type === 'income') data.categoryId = 'cat_income';
          MF.tx.create(data);
        }
        MF.ui.closeModal();
        if (existing || data.type === 'income' || !MF.spendDemo.atLimit()) {
          MF.ui.toast(existing ? 'Transaction updated' : (data.type === 'income' ? 'Income added' : 'Expense added'), 'success');
        }
        MF.app.milestones(); MF.app.rerender();
      }
    });
    if (existing) m.querySelector('[data-x="del"]').addEventListener('click', () => { MF.ui.closeModal(); MF.tx.deleteConfirm(existing.id); });
    if (opts.quickParse && opts.quickParse.description) m.querySelector('[name="description"]').value = opts.quickParse.description;
    if (opts.quickParse && opts.quickParse.categoryId) m.querySelector('[name="categoryId"]').value = opts.quickParse.categoryId;
    if (opts.quickParse && opts.quickParse.amountCents) m.querySelector('[name="amount"]').value = (opts.quickParse.amountCents / 100).toFixed(2);
    else if (opts.preAmount) m.querySelector('[name="amount"]').value = opts.preAmount;
    if (opts.date && !existing) m.querySelector('[name="date"]').value = opts.date;
    if (opts.preAmount) m.querySelector('[name="amount"]').value = opts.preAmount;
    // live type toggle changes category list relevance
    m.querySelectorAll('[name="txType"]').forEach(r => r.addEventListener('change', () => {
      const inc = m.querySelector('[name="txType"]:checked').value === 'income';
      m.querySelector('#tf-cat-field').style.display = inc ? 'none' : '';
      if (inc) { const sel = m.querySelector('[name="categoryId"]'); sel.dataset.keep = sel.selectedIndex; m.querySelector('[name="description"]').placeholder = 'e.g. paycheck, refund'; }
    }));
    const defaultChoice = existing && existing.type === 'income' ? 'income' : opts.type === 'income' ? 'income' : m.querySelector('[name="txType"]:checked') && m.querySelector('[name="txType"]:checked').value;
    if (defaultChoice === 'income') { m.querySelector('[value="income"]').checked = true; m.querySelector('#tf-cat-field').style.display = 'none'; }
    return m;
  }

  function splitModal(t) {
    const f = MF.ui.form;
    const rows = 2;
    let split = (t.split && t.split.map(p => Object.assign({}, p))) || Array.from({ length: Math.max(2, rows) }, () => ({ categoryId: 'cat_other', amountCents: 0, }));
    const relist = () => m.querySelector('#split-rows').innerHTML = split.map((r, i) =>
      '<div class="form-3col" data-p="' + i + '">' +
      '<select name="pc_' + i + '">' + MF.store.categories().map(c => '<option value="' + eH(c.id) + '"' + (c.id === r.categoryId ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') + '</select>' +
      '<input type="number" step="0.01" name="pa_' + i + '" value="' + (r.amountCents ? (r.amountCents / 100).toFixed(2) : '') + '" placeholder="0.00">' +
      '<button class="icon-btn" data-rm="' + i + '" aria-label="Remove line">' + MF.icon('close') + '</button></div>').join('');
    const budget = '<div class="hint" id="split-sum"></div>' +
      '<button class="btn btn-ghost btn-sm" data-add-row type="button">+ Add another category</button>';
    const m = MF.ui.modal({
      title: 'Split “' + (t.description || 'transaction') + '”',
      body: '<p>' + fmt(t.amountCents) + ' total. Assign it across categories — the parts must add up to the total before saving.</p>' +
        '<div id="split-rows"></div>' + budget,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Save split</button>',
      onOk(modal) {
        const rows = [];
        let sum = 0;
        split.forEach((r, i) => {
          const raw = modal.querySelector('[name="pa_' + i + '"]').value;
          if (!raw.trim()) return;
          const amt = MF.money.parse(raw);
          if (amt == null || amt < 0) throw new Error('Each split amount must be zero or greater');
          if (amt === 0) return;
          sum += amt;
          rows.push({ categoryId: modal.querySelector('[name="pc_' + i + '"]').value, amountCents: amt });
        });
        if (sum !== t.amountCents) throw new Error('Parts total ' + fmt(sum) + ' but must equal ' + fmt(t.amountCents));
        split = rows;
        t.split = rows.length > 1 ? rows : null;
        if (rows.length === 1) t.categoryId = rows[0].categoryId;
        MF.storage.save();
        MF.ui.closeModal(); MF.ui.toast('Split saved', 'success'); MF.app.rerender();
      }
    });
    relist();
    m.querySelector('#split-rows').innerHTML = split.map((r, i) =>
      '<div class="form-3col" data-p="' + i + '">' +
      '<select name="pc_' + i + '">' + MF.store.categories().map(c => '<option value="' + eH(c.id) + '"' + (c.id === r.categoryId ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') + '</select>' +
      '<input type="number" step="0.01" name="pa_' + i + '" value="' + (r.amountCents ? (r.amountCents / 100).toFixed(2) : '') + '" placeholder="0.00">' +
      '<button class="icon-btn" data-rm="' + i + '" aria-label="Remove line">' + MF.icon('close') + '</button></div>').join('');
    const captureSplit = () => split.forEach((r, i) => {
      const amount = m.querySelector('[name="pa_' + i + '"]');
      const category = m.querySelector('[name="pc_' + i + '"]');
      if (amount) r.amountCents = MF.money.parse(amount.value) || 0;
      if (category) r.categoryId = category.value;
    });
    // Delegate once; adding rows must not multiply remove handlers.
    m.querySelector('#split-rows').addEventListener('click', event => {
      const b = event.target.closest('[data-rm]');
      if (!b) return;
      captureSplit();
      split.splice(+b.dataset.rm, 1);
      m.querySelector('#split-rows').innerHTML = split.map((r, i) =>
        '<div class="form-3col" data-p="' + i + '">' +
        '<select name="pc_' + i + '">' + MF.store.categories().map(c => '<option value="' + eH(c.id) + '"' + (c.id === r.categoryId ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') + '</select>' +
        '<input type="number" step="0.01" name="pa_' + i + '" value="' + (r.amountCents ? (r.amountCents / 100).toFixed(2) : '') + '" placeholder="0.00">' +
        '<button class="icon-btn" data-rm="' + i + '" aria-label="Remove line">' + MF.icon('close') + '</button></div>').join('');
      updateSum();
    });
    const updateSum = () => {
      let sum = 0;
      split.forEach((r, i) => { const v = m.querySelector('[name="pa_' + i + '"]'); if (v) sum += MF.money.parse(v.value) || 0; });
      const el = m.querySelector('#split-sum');
      const diff = sum - (t.amountCents || 0);
      el.textContent = 'Assigned: ' + fmt(sum) + ' of ' + fmt(t.amountCents) + (diff === 0 ? ' ✓ balanced' : ' · remaining ' + fmt(t.amountCents - sum));
      el.style.color = diff === 0 ? 'var(--ok)' : 'var(--muted)';
    };
    m.addEventListener('input', updateSum); m.addEventListener('change', updateSum);
    updateSum();
    m.querySelector('[data-add-row]').addEventListener('click', () => {
      split.push({ categoryId: 'cat_other', amountCents: 0 });
      const i = split.length - 1;
      m.querySelector('#split-rows').insertAdjacentHTML('beforeend',
        '<div class="form-3col" data-p="' + i + '">' +
        '<select name="pc_' + i + '">' + MF.store.categories().map(c => '<option value="' + eH(c.id) + '"' + (c.id === 'cat_other' ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') + '</select>' +
        '<input type="number" step="0.01" name="pa_' + i + '" value="" placeholder="0.00">' +
        '<button class="icon-btn" data-rm="' + i + '" aria-label="Remove line">' + MF.icon('close') + '</button></div>');
      updateSum();
    });
    return m;
  }

  function refundModal(t) {
    const f = MF.ui.form;
    const room = t.amountCents - (t.refundedCents || 0);
    const m = MF.ui.modal({
      title: 'Record refund',
      body: '<p>Original amount ' + fmt(t.amountCents) + (t.refundedCents ? ' · refunded so far ' + fmt(t.refundedCents) : '') + '</p>' +
        f.input('Refund amount', { name: 'amount', type: 'number', step: '0.01', value: (room / 100).toFixed(2), required: true }) +
        f.input('Date received', { name: 'date', type: 'date', value: D.today(), required: true }) +
        f.select('Back into account', { name: 'accountId', value: t.accountId || '', options: MF.accounts.activeAccounts().map(a => [a.id, a.name]) }) +
        '<p class="hint">Refunds are recorded as income linked to the purchase so reports stay correct and nothing is double-counted.</p>',
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Record refund</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!amt || amt <= 0) throw new Error('Enter the refund amount');
        if (amt > room) throw new Error('That is more than the remaining ' + fmt(room) + ' to refund');
        MF.tx.recordRefund(t, amt, d.date, d.accountId);
        MF.ui.closeModal(); MF.ui.toast('Refund recorded', 'success'); MF.app.rerender();
      }
    });
    return m;
  }

  function detailsModal(t) {
    const rows = [
      ['Date', D.fmtHuman(t.date, { long: true })],
      ['Type', t.type],
      ['Amount', fmt(t.amountCents)],
      ['Description', t.description || '—'],
      ['Category', t.type === 'expense' ? MF.store.category(t.categoryId).name : (t.type === 'transfer' ? 'Transfer' : 'Income')],
      ['Account', (MF.store.account(t.accountId) || {}).name || '—'],
    ];
    if (t.toAccountId) rows.push(['To account', (MF.store.account(t.toAccountId) || {}).name || '—']);
    if (t.notes) rows.push(['Notes', t.notes]);
    if ((t.tags || []).length) rows.push(['Tags', t.tags.join(', ')]);
    if (t.split) rows.push(['Split', t.split.map(x => MF.store.category(x.categoryId).name + ' ' + fmt(x.amountCents)).join(' · ')]);
    if (t.refundedCents) rows.push(['Refunded', fmt(t.refundedCents)]);
    const m = MF.ui.modal({
      title: 'Transaction details',
      body: '<table class="detail-table">' + rows.map(r => '<tr><th>' + eH(r[0]) + '</th><td>' + eH(String(r[1])) + '</td></tr>').join('') + '</table>',
      footer: '<button class="btn btn-ghost" data-act="cancel">Close</button>' +
        (t.type === 'expense' && !t.billId && !t.debtId ? '<button class="btn btn-ghost" data-x="split">Split</button>' : '') +
        (t.type === 'expense' && t.refundable ? '<button class="btn btn-secondary" data-x="refund">Record refund</button>' : '') +
        '<button class="btn btn-primary" data-x="edit">Edit</button>'
    });
    const eb = m.querySelector('[data-x="edit"]'); if (eb) eb.addEventListener('click', () => { MF.ui.closeModal(); expenseModal(t); });
    const sb = m.querySelector('[data-x="split"]'); if (sb) sb.addEventListener('click', () => { MF.ui.closeModal(); splitModal(t); });
    const rb = m.querySelector('[data-x="refund"]'); if (rb) rb.addEventListener('click', () => { MF.ui.closeModal(); refundModal(t); });
  }

  MF.txForm = { expenseModal, splitModal, refundModal, detailsModal };
})();
</script>
<script>/* ============================================================
   MindFlow — Transactions page: quick entry, search/filter/sort,
   detail actions (edit, duplicate, delete, refund, split)
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  let F = { q: '', type: 'all', categoryId: 'all', accountId: 'all', from: '', to: '', sort: 'date', dir: 'desc' };

  function render(el) {
    const txns = MF.tx.filterTxns(F).slice();
    const list = txns;
    const inc = MF.sum(txns.filter(t => t.type === 'income').map(t => t.amountCents));
    const exp = MF.sum(txns.filter(t => t.type === 'expense').map(t => t.amountCents));
    el.innerHTML =
      '<header class="page-head"><div><h2>Transactions</h2><p class="page-sub">' + txns.length + ' shown · ' +
      '<span class="pos">+' + eH(fmt(inc)) + '</span> / <span class="neg">−' + eH(fmt(exp)) + '</span></p></div>' +
      '<div class="btn-row"><button class="btn btn-secondary" data-act="inc">' + MF.icon('income', 'sm') + ' Income</button>' +
      '<button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' Expense</button></div></header>' +

      '<section class="card quickbar"><div class="dumper"><input id="quick-in" placeholder="Quick add — try: 250 groceries">' +
      '<button class="btn btn-secondary" id="quick-go">Add</button></div>' +
      '<p class="hint">Type an amount and what it was; MindFlow fills the form — you always confirm before saving.</p></section>' +

      '<section class="card filters"><div class="form-row-wrap">' +
      '<div class="search-box"><input id="f-q" placeholder="Search description, note, tag…" value="' + eH(F.q) + '" aria-label="Search">' + MF.icon('search') + '</div>' +
      select('Type', 'type', [['all', 'All types'], ['expense', 'Expenses'], ['income', 'Income'], ['transfer', 'Transfers']]) +
      select('Category', 'categoryId', [['all', 'All categories']].concat(MF.store.categories().map(c => [c.id, c.name]))) +
      select('Account', 'accountId', [['all', 'All accounts']].concat(MF.store.accounts(false).map(a => [a.id, a.name]))) +
      '<label class="field"><span class="field-label">From</span><input type="date" id="f-from" value="' + eH(F.from) + '"></label>' +
      '<label class="field"><span class="field-label">To</span><input type="date" id="f-to" value="' + eH(F.to) + '"></label>' +
      select('Sort', 'sort', [['date', 'By date'], ['amount', 'By amount']]) +
      '<button class="btn btn-ghost btn-sm" id="f-clear">Clear filters</button>' +
      '</div></section>' +
      (list.length ? '<section class="card"><div class="list">' + list.map(t => MF.tx.txnRow(t)).join('') + '</div></section>'
        : '<p class="empty card empty-pad">No transactions match. Adjust filters or add one above.</p>');

    function select(label, name, opts) {
      return '<label class="field"><span class="field-label">' + label + '</span><select name="' + name + '">' +
        opts.map(o => '<option value="' + eH(o[0]) + '"' + (F[name] === o[0] ? ' selected' : '') + '>' + eH(o[1]) + '</option>').join('') + '</select></label>';
    }

    el.querySelector('[data-act="add"]').addEventListener('click', () => MF.txForm.expenseModal(null, { type: 'expense' }));
    el.querySelector('[data-act="inc"]').addEventListener('click', () => MF.txForm.expenseModal(null, { type: 'income' }));
    el.querySelector('#quick-go').addEventListener('click', () => quickAdd(el));
    el.querySelector('#quick-in').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(el); });
    el.querySelector('#f-q').addEventListener('input', MF.debounce(e => { F.q = e.target.value; render(el); keepFocus(el, '#f-q'); }, 250));
    el.querySelectorAll('.filters select, #f-from, #f-to').forEach(s => s.addEventListener('change', () => {
      F.type = el.querySelector('[name="type"]').value;
      F.categoryId = el.querySelector('[name="categoryId"]').value;
      F.accountId = el.querySelector('[name="accountId"]').value;
      F.from = el.querySelector('#f-from').value;
      F.to = el.querySelector('#f-to').value;
      F.sort = el.querySelector('[name="sort"]').value;
      render(el); keepFocus(el, null);
    }));
    el.querySelector('#f-clear').addEventListener('click', () => { F = { q: '', type: 'all', categoryId: 'all', accountId: 'all', from: '', to: '', sort: 'date', dir: 'desc' }; render(el); });
    wireRows(el);
  }
  function keepFocus(el, sel) {
    if (!sel) return;
    const i = el.querySelector(sel);
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }

  function quickAdd(el) {
    if (MF.spendDemo.atLimit()) { MF.ui.toast(MF.spendDemo.message); return; }
    const raw = el.querySelector('#quick-in').value;
    const p = MF.tx.parseQuick(raw);
    if (!p) { MF.ui.toast('Start with the amount, like “25 lunch”.', 'warn'); return; }
    if (!p.categoryId) { // not confident about category — open form with amount prefilled only
      MF.txForm.expenseModal(null, { type: 'expense', preAmount: (p.amountCents / 100).toFixed(2) });
      el.querySelector('#quick-in').value = '';
      return;
    }
    MF.txForm.expenseModal(null, { type: 'expense', quickParse: p });
    el.querySelector('#quick-in').value = '';
  }

  /* rows: click = details/dolatile menu via modal */
  function wireRows(el) {
    el.querySelectorAll('.txn-row').forEach(row => {
      row.addEventListener('click', () => {
        const t = MF.tx.find(row.dataset.id);
        if (t) MF.txForm.detailsModal(t);
      });
      row.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault(); row.click();
      });
    });
  }

  MF.txPage = { render };
})();
</script>
<script>/* ============================================================
   MindFlow — mileage calendar: month grid with paydays, bills,
   expenses, contributions; day detail + add from date; day notes.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  let cur = D.today().slice(0, 7);
  let selected = null;

  function eventsFor(month) {
    // Map date -> array of {kind, html}
    const map = {};
    const push = (date, ev) => { (map[date] = map[date] || []).push(ev); };
    const from = month + '-01';
    const y = +month.slice(0, 4), m = +month.slice(5, 7) - 1;
    const to = month + '-' + String(D.daysInMonth(y, m)).padStart(2, '0');

    for (const b of MF.store.list('bills').filter(b => !b.archived)) {
      for (const d of MF.calc.billOccurrencesBetween(b, from, to)) {
        push(d, { kind: 'bill', label: b.name, cents: b.amountCents, paid: false });
      }
      for (const h of (b.paidHistory || [])) {
        if ((h.paidDate || '').slice(0, 7) === month) push(h.paidDate, { kind: 'billpaid', label: b.name + ' ✓paid', cents: h.amountCents });
        if ((h.dueDate || '').slice(0, 7) === month && !map[h.dueDate]) push(h.dueDate, { kind: 'bill', label: b.name, cents: h.amountCents, paid: true });
      }
    }
    for (const p of MF.calc.paydaysBetween(from, to)) {
      push(p.date, { kind: 'income', label: p.source.name || 'Paycheck', cents: p.amountCents });
    }
    for (const t of MF.store.list('transactions')) {
      if (t.date < from || t.date > to) continue;
      if (t.type === 'income') push(t.date, { kind: 'txincome', label: t.description || 'Income', cents: t.amountCents });
      else if (t.type === 'expense') push(t.date, { kind: 'txCB' , label: t.description || 'Expense', cents: t.amountCents });
      else if (t.type === 'transfer' && t.goalId) push(t.date, { kind: 'goal', label: 'Savings', cents: t.amountCents });
      else if (t.type === 'transfer') push(t.date, { kind: 'transfer', label: 'Transfer', cents: t.amountCents });
    }
    for (const d0 of MF.store.list('debts').filter(d => !d.paidOff)) {
      for (const h of (d0.paidHistory || [])) {
        if ((h.paidDate || '').slice(0, 7) === month) push(h.paidDate, { kind: 'debt', label: d0.name + ' ✓paid', cents: h.amountCents });
      }
      if (d0.nextDue && d0.nextDue.slice(0, 7) === month && !MF.calc.debt.debtPaidFor(d0, d0.nextDue)) push(d0.nextDue, { kind: 'debt', label: d0.name, cents: d0.minPaymentCents });
    }
    return map;
  }

  function render(el) {
    const y = +cur.slice(0, 4), m = +cur.slice(5, 7) - 1;
    const days = D.daysInMonth(y, m);
    const weekStart = MF.store.settings().weekStart || 0;
    const firstWeekday = (D.weekday(cur + '-01') - weekStart + 7) % 7;
    const evs = eventsFor(cur);
    const title = D.monthName(m) + ' ' + y;
    const todayM = D.today().slice(0, 7);

    let cells = '';
    const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(n => n);
    const weeks = [];
    for (let i = 0; i < 7; i++) weeks.push(names[(i + weekStart) % 7]);

    for (let i = 0; i < firstWeekday; i++) cells += '<div class="cal-cell blank"></div>';
    for (let day = 1; day <= days; day++) {
      const ds = cur + '-' + String(day).padStart(2, '0');
      const list = evs[ds] || [];
      const inNet = list.filter(e => e.kind === 'income' || e.kind === 'txincome');
      const outNet = list.filter(e => e.kind === 'bill' || e.kind === 'txCB' || e.kind === 'debt');
      const cls = (ds === D.today() ? ' today' : '') + (ds === selected ? ' sel' : '');
      cells += '<button type="button" class="cal-cell' + cls + '" data-date="' + ds + '" aria-label="' + D.fmtHuman(ds, { long: true }) + '">' +
        '<span class="cal-dayn">' + day + '</span>' +
        (inNet.length ? '<span class="cal-ev pos">+' + eH(fmt(MF.sum(inNet.map(e2 => e2.cents)))) + '</span>' : '') +
        (outNet.length ? '<span class="cal-ev neg">−' + eH(fmt(MF.sum(outNet.map(e2 => e2.cents)))) + '</span>' : '') +
        (list.length > 2 ? '<span class="cal-more">+' + (list.length - 2) + ' more</span>' : '') +
        (MF.storage.data.dayNotes[ds] ? '<span class="note-dot" title="Has notes"></span>' : '') +
        '</button>';
    }
    const monthNow = MF.calc.monthSummary(cur);
    selected = selected && selected.slice(0, 7) === cur ? selected : null;

    el.innerHTML =
      '<header class="page-head"><div><h2>Calendar — ' + eH(title) + '</h2>' +
      '<p class="page-sub">' + (monthNow.income || monthNow.expense ? 'In/out this month: <strong class="pos">' + eH(fmt(monthNow.income)) + '</strong> / <strong class="neg">' + eH(fmt(monthNow.expense)) + '</strong>' : 'Nothing planned yet this month.') + '</p></div>' +
      '<div class="btn-row calendar-nav">' +
      '<button class="btn btn-ghost" data-act="prev">‹ Prev</button>' +
      '<button class="btn btn-ghost" data-act="today">' + (todayM === cur ? 'Today' : 'Jump to today') + '</button>' +
      '<button class="btn btn-ghost" data-act="next">Next ›</button></div></header>' +
      '<section class="card"><div class="cal-head">' + weeks.map(w => '<span>' + eH(w) + '</span>').join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div></section>' +
      '<div class="legend-row">' +
      '<span><i class="dot pos-bg"></i> income</span><span><i class="dot neg-bg"></i> bills & spending</span>' +
      '<span><i class="dot goal-bg"></i> savings</span><span><i class="note-dot-inline"></i> has note</span></div>' +
      '<div id="cal-detail"></div>';

    el.querySelectorAll('.cal-cell[data-date]').forEach(c => c.addEventListener('click', () => { selected = c.dataset.date; render(el); }));
    el.querySelector('[data-act="prev"]').addEventListener('click', () => { cur = D.addMonths(cur + '-01', -1).slice(0, 7); render(el); });
    el.querySelector('[data-act="next"]').addEventListener('click', () => { cur = D.addMonths(cur + '-01', 1).slice(0, 7); render(el); });
    el.querySelector('[data-act="today"]').addEventListener('click', () => { cur = D.today().slice(0, 7); selected = D.today(); render(el); });
    if (selected) dayDetail(el.querySelector('#cal-detail'), selected, evs[selected] || []);
  }

  function dayDetail(el, date, evs) {
    const note = MF.storage.data.dayNotes[date] || '';
    el.innerHTML =
      '<section class="card day-detail"><h4>' + eH(D.fmtHuman(date, { long: true })) + '</h4>' +
      (evs.length ? '<div class="list">' + evs.map(e =>
        '<div class="row"><div class="row-main"><div class="row-sub"><span class="dot" style="background:' + evColor(e) + '"></span> ' +
        eH(e.label) + '</div></div><div class="row-side"><strong>' + eH(fmt(e.cents)) + '</strong></div></div>').join('') + '</div>'
        : '<p class="empty">Nothing scheduled or recorded for this day yet.</p>') +
      '<div class="btn-row">' +
      '<button class="btn btn-primary btn-sm" data-act="expense">Add expense</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="income">Add income</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="bill">Plan a bill here</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="note">Day note</button>' +
      '</div></section>';
    el.querySelector('[data-act="expense"]').addEventListener('click', () => MF.txForm.expenseModal(null, { type: 'expense', date }));
    el.querySelector('[data-act="income"]').addEventListener('click', () => MF.txForm.expenseModal(null, { type: 'income', date }));
    el.querySelector('[data-act="bill"]').addEventListener('click', () => MF.bills.formModal(null, { date }));
    el.querySelector('[data-act="note"]').addEventListener('click', () => {
      const m = MF.ui.modal({
        title: 'Note for ' + D.fmtHuman(date),
        body: '<label class="field"><span class="field-label">Thoughts, reminders, anything</span><textarea name="note" rows="4">' + eH(note) + '</textarea></label>',
        footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Save note</button>',
        onOk(modal) {
          MF.storage.data.dayNotes[date] = modal.querySelector('[name="note"]').value;
          MF.storage.save(); MF.ui.closeModal(); MF.ui.toast('Note saved', 'success'); MF.app.rerender();
        }
      });
    });
  }
  function evColor(e) {
    return { bill: '#d6473f', billpaid: '#8a8f98', income: '#2f9e6e', txincome: '#2f9e6e', txxCB: '#e07a5f', txCB: '#e07a5f', debt: '#d6473f', goal: '#8a79d9', transfer: '#4c8fd6' }[e.kind] || '#8a8f98';
  }

  MF.calendar = { render, eventsFor };
})();
</script>
<script>/* ============================================================
   MindFlow — reports & analytics (charts, CSV, print summary)
   All figures come from saved transactions; transfers excluded.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  let range = 'month3';
  let customRange = null;

  function rangeTo(r) {
    const t = D.today();
    switch (r) {
      case 'week': { const back = (D.weekday(t) - (MF.store.settings().weekStart || 0) + 7) % 7; return { from: D.addDays(t, -back), to: t, label: 'This week' }; }
      case 'month0': return { from: t.slice(0, 8) + '01', to: t, label: 'This month' };
      case 'month1': { const p = D.addMonths(t.slice(0, 7) + '-01', -1); return monthRange(p.slice(0, 7)); }
      case 'month3': return { from: D.addMonths(t.slice(0, 8) + '01', -2), to: t, label: 'Last 3 months' };
      case 'month6': return { from: D.addMonths(t.slice(0, 8) + '01', -5), to: t, label: 'Last 6 months' };
      case 'year': return { from: t.slice(0, 4) + '-01-01', to: t, label: 'This year' };
      case 'all': return { from: '2000-01-01', to: D.addDays(t, 1), label: 'All time' };
      case 'custom': {
        if (customRange) return { from: customRange.from, to: customRange.to, label: 'Custom range' };
        const t2 = D.today();
        return { from: t2.slice(0, 8) + '01', to: t2, label: 'Custom range' };
      }
    }
    return { from: t.slice(0, 8) + '-01', to: t };
  }
  function monthRange(m) {
    const days = D.daysInMonth(+m.slice(0, 4), +m.slice(5, 7) - 1);
    return { from: m + '-01', to: m + '-' + String(days).padStart(2, '0'), label: 'Last month' };
  }

  function render(el) {
    const R = rangeTo(range);
    const txns = MF.store.list('transactions').filter(t => t.date >= R.from && t.date <= R.to);
    const income = MF.sum(txns.filter(t => t.type === 'income').map(t => t.amountCents));
    const expense = MF.sum(txns.filter(t => t.type === 'expense').map(t => t.amountCents));
    const transfers = MF.sum(txns.filter(t => t.type === 'transfer').map(t => t.amountCents));
    const savings = MF.sum(txns.filter(t => t.type === 'transfer' && t.goalId).map(t => t.amountCents));
    const debtPaid = MF.sum(txns.filter(t => t.type === 'expense' && t.debtId).map(t => t.amountCents));
    const days = Math.max(1, D.daysBetween(R.from, R.to < D.today() ? R.to : D.today()) + 1);
    const avgDaily = expense / days;

    const cats = MF.calc.byCategory(R.from, R.to);
    const total = MF.sum(cats.map(c => c.cents));
    const ser = MF.calc.seriesMonthly(R.from, R.to);

    el.innerHTML =
      '<header class="page-head"><div><h2>Reports</h2><p class="page-sub">' + eH(R.label) + ' (' + eH(D.fmtHuman(R.from)) + ' → ' + eH(D.fmtHuman(R.to)) + ')</p></div>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-act="csv">' + MF.icon('save', 'sm') + ' Export CSV</button>' +
      '<button class="btn btn-ghost" data-act="print">Print summary</button>' +
      '</div></header>' +

      '<div class="seg-row" role="tablist" aria-label="Report range">' +
      [['week', 'Week'], ['month0', 'This month'], ['month1', 'Last month'], ['month3', '3 mo'], ['month6', '6 mo'], ['year', 'Year'], ['all', 'All'], ['custom', 'Custom']].map(x =>
        '<button class="btn btn-sm ' + (range === x[0] ? 'btn-secondary' : 'btn-ghost') + '" data-range="' + x[0] + '">' + x[1] + '</button>').join('') +
      '</div>' +
      (range === 'custom' ? '<div class="form-2col">' +
        '<label class="field"><span class="field-label">From</span><input type="date" id="rep-from" value="' + R.from + '"></label>' +
        '<label class="field"><span class="field-label">To</span><input type="date" id="rep-to" value="' + R.to + '"></label></div>' +
        '<button class="btn btn-primary btn-sm" data-act="apply-custom">Apply</button>' : '') +

      '<section class="grid grids-3 cards-stats">' +
      stat('Total income', income, 'pos') +
      stat('Total expenses', expense, 'neg') +
      stat('Net cash flow', income - expense, income - expense >= 0 ? 'pos' : 'neg') +
      stat('Savings moved', savings) +
      stat('Debt paid', debtPaid) +
      stat('Avg daily spending', avgDaily) + '</section>' +
      '<p class="hint page-inline">Transfers between accounts are excluded from income and expenses. ' +
      (transfers ? eH(fmt(transfers)) + ' was moved between your accounts in this period.' : '') + '</p>' +

      '<section class="card"><h4>Income vs expenses by month</h4><canvas id="chart-io" data-h="220"></canvas>' +
      (!ser.labels.length ? '<p class="empty">No transaction data in this range yet.</p>' : '') + '</section>' +

      '<div class="grid grids-2">' +
      '<section class="card"><h4>Spending by category</h4><canvas id="chart-cats" data-h="240"></canvas>' +
      '<div class="list">' + (cats.length ? cats.map(c =>
        '<div class="row"><div class="row-main"><span class="dot" style="background:' + eH(c.cat.color) + '"></span>' + eH(c.cat.name) + '</div>' +
        '<div class="row-side">' + eH(fmt(c.cents)) + ' <span class="row-sub">' + (100 * c.cents / Math.max(1, total)).toFixed(0) + '%</span></div></div>').join('') : '<p class="empty">No expenses in this range.</p>') + '</div></section>' +
      '<section class="card"><h4>Monthly spending trend</h4><canvas id="chart-trend" data-h="240"></canvas></section>' +
      '</div>' +

      '<section class="card"><h4>Savings growth</h4><canvas id="chart-sav" data-h="200"></canvas>' +
      '<p class="hint">Growth comes from contributions recorded against your goals in this range.</p></section>' +

      '<section class="card" id="print-summary"><h4>Financial summary (print-friendly)</h4>' +
      '<table class="detail-table">' +
      '<tr><th>Period</th><td>' + eH(R.from) + ' to ' + eH(R.to) + '</td></tr>' +
      '<tr><th>Total income</th><td>' + eH(fmt(income)) + '</td></tr>' +
      '<tr><th>Total expenses</th><td>' + eH(fmt(expense)) + '</td></tr>' +
      '<tr><th>Net cash flow</th><td>' + eH(fmt(income - expense)) + '</td></tr>' +
      '<tr><th>Savings contributions</th><td>' + eH(fmt(MF.sum(txns.filter(t => t.type === 'transfer' && t.goalId && t.toAccountId === 'goal:' + t.goalId).map(t => t.amountCents)))) + '</td></tr>' +
      '<tr><th>Debt payments</th><td>' + eH(fmt(debtPaid)) + '</td></tr>' +
      '<tr><th>Current balances</th><td>' + eH(MF.accounts.activeAccounts().map(a => a.name + ' ' + fmt(MF.calc.accountBalance(a.id))).join(' · ') || '—') + '</td></tr>' +
      '</table></section>';

    function stat(label, cents, cls) {
      return '<div class="card stat"><div class="stat-label">' + eH(label) + '</div><div class="stat-val ' + (cls || '') + '">' + eH(fmt(cents, { maximumFractionDigits: 2 })) + '</div></div>';
    }

    el.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => { range = b.dataset.range; render(el); }));
    const ac = el.querySelector('[data-act="apply-custom"]');
    if (ac) ac.addEventListener('click', () => {
      customRange = { from: el.querySelector('#rep-from').value, to: el.querySelector('#rep-to').value };
      render(el);
    });
    el.querySelector('[data-act="csv"]').addEventListener('click', () => exportCSV(R));
    el.querySelector('[data-act="print"]').addEventListener('click', () => {
      const w = window.open('', '_blank', 'width=740,height=920');
      if (!w) { MF.ui.toast('Allow pop-ups to print the summary.', 'warn'); return; }
      w.document.write('<html><head><title>MindFlow summary ' + R.from + '–' + R.to + '</title><style>body{font-family:Georgia,serif;margin:38px}h1{font-size:20px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:7px 9px;text-align:left}th{width:44%}</style></head><body>' +
        el.querySelector('#print-summary').innerHTML.replace('<h4>', '<h1>').replace('</h4>', '</h1>') +
        '<p style="color:#777">Generated by MindFlow Budget Planner — ' + D.fmtHuman(D.today()) + '</p></body></html>');
      w.document.close(); w.focus(); w.print();
    });

    // charts
    if (ser.labels.length) {
      MF.chart(el.querySelector('#chart-io'), {
        kind: 'bar', labels: ser.labels,
        series: [
          { label: 'Income', data: ser.income, color: cssVar('--ok', '#2f9e6e') },
          { label: 'Expenses', data: ser.expense, color: cssVar('--neg', '#d6473f') }
        ]
      });
      MF.chart(el.querySelector('#chart-trend'), {
        kind: 'line', labels: ser.labels,
        series: [{ label: 'Net per month', data: ser.net, color: cssVar('--accent', '#2f7d6f'), fill: true }]
      });
    }
    const cs = el.querySelector('#chart-cats');
    if (cats.length) MF.chart(cs, {
      kind: 'donut', center: fmt(total).replace(/[,.]?\d{2}$/, ''), centerSub: 'total spent',
      items: cats.slice(0, 8).map(c => ({ color: c.cat.color, value: c.cents }))
    });
    const sav = MF.calc.savingsSeries(R.from, R.to);
    if (sav.pts.length) MF.chart(el.querySelector('#chart-sav'), {
      kind: 'line', labels: sav.pts.map(p => p.x.slice(5)),
      series: [{ label: 'Saved', data: sav.pts.map(p => p.y), color: cssVar('--accent', '#2f7d6f'), fill: true }]
    });
  }
  function cssVar(n, fb) { return (getComputedStyle(document.documentElement).getPropertyValue(n) || fb).trim() || fb; }

  function exportCSV(R) {
    const txns = MF.tx.filterTxns({ from: R.from, to: R.to, sort: 'date', dir: 'asc' });
    if (!txns.length) { MF.ui.toast('No transactions in this period to export.', 'warn'); return; }
    download('mindflow-transactions-' + R.from + '_to_' + R.to + '.csv', MF.tx.toCSV(txns), 'text/csv');
    MF.ui.toast('CSV exported (' + txns.length + ' transactions)', 'success');
  }
  function download(name, content, mime) {
    const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  MF.reports = { render, exportCSV, download, rangeTo };
})();
</script>
<script>/* ============================================================
   MindFlow — milestones & motivation (gentle, no streak shaming)
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;

  const DEFS = [
    { id: 'm_first_txn', name: 'First transaction', desc: 'You recorded your first transaction.', icon: '✍️',
      test: () => MF.store.list('transactions').length >= 1 },
    { id: 'm_first_account', name: 'Accounts in place', desc: 'Your money now has a home in MindFlow.', icon: '🏦',
      test: () => MF.store.list('accounts').length >= 1 },
    { id: 'm_first_budget', name: 'First budget created', desc: 'You set up your first spending envelope.', icon: '✉️',
      test: () => MF.store.list('envelopes').length >= 1 },
    { id: 'm_first_goal', name: 'First savings goal', desc: 'You created your first savings goal.', icon: '🎯',
      test: () => MF.store.list('goals').length >= 1 },
    { id: 'm_first_bill', name: 'Getting organized', desc: 'You added your first bill so nothing sneaks up on you.', icon: '📬',
      test: () => MF.store.list('bills').length >= 1 },
    { id: 'm_first_debt_pay', name: 'First debt payment', desc: 'You made your first debt payment.', icon: '💪',
      test: () => MF.store.list('debts').some(d => (d.paidHistory || []).length >= 1) },
    { id: 'm_one_month_under', name: 'Month under budget', desc: 'A full month where expenses stayed under income.', icon: '🌿',
      test: () => lastStressFreeMonth() },
    { id: 'm_goal_complete', name: 'First goal completed', desc: 'You reached a savings goal. That is real progress.', icon: '🏅',
      test: () => MF.store.list('goals').some(g => g.completed) },
    { id: 'm_debt_free', name: 'Debt-free', desc: 'Every tracked debt is paid off.', icon: '🕊️',
      test: () => MF.store.list('debts').length > 0 && MF.store.list('debts').every(d => d.paidOff) || MF.store.list('debts').length === 0 }
    // no streaks on purpose — missed days are never a failure
  ];
  function lastStressFreeMonth() {
    const now = new Date();
    for (let i = 1; i <= 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const s = MF.calc.monthSummary(month);
      if (s.count > 0 && s.net >= 0) return true;
    }
    return false;
  }

  function check(silent) {
    let unlocked = [];
    for (const def of DEFS) {
      const list = MF.store.list('milestones');
      let rec = list.find(m => m.id === def.id);
      if (!rec) {
        if (def.test()) {
          MF.store.list('milestones').push({ id: def.id, unlockedAt: MF.dates.today() });
          unlocked.push(def);
        }
      }
    }
    if (unlocked.length) {
      MF.storage.save();
      if (!silent) {
        const def = unlocked[unlocked.length - 1];
        MF.ui.toast('🏆 Milestone: ' + def.name + ' — ' + def.desc, 'success');
      }
      MF.emit('milestone:unlocked', unlocked);
    }
  }

  function render(el) {
    check(true);
    const list = MF.store.list('milestones');
    const byId = Object.fromEntries(list.map(m => [m.id, m]));
    const done = DEFS.filter(d => byId[d.id]), next = DEFS.filter(d => !byId[d.id]).slice(0, 4);
    el.innerHTML =
      '<header class="page-head"><div><h2>Milestones</h2><p class="page-sub">Progress, your way. Every small step counts — and missing a day is never a failure.</p></div></header>' +
      '<p class="banner-ok">' + doneCountMsg(done.length) + '</p>' +
      '<h3 class="sect">Unlocked (' + done.length + ')</h3>' +
      '<div class="grid grids-3">' + (done.length ? done.map(m =>
        '<div class="card badge"><div class="badge-icon">' + m.icon + '</div><div><div class="row-title">' + eH0(m.name) + '</div>' +
        '<div class="row-sub">' + eH0(m.desc) + '</div><div class="row-sub">' + (byId[m.id].unlockedAt ? 'unlocked ' + eH0(byId[m.id].unlockedAt) : '') + '</div></div></div>').join('')
        : '<p class="empty card empty-pad">Your first milestones are close — record a transaction or an account to unlock them.</p>') + '</div>' +
      '<h3 class="sect">Up next</h3>' +
      '<div class="list">' + (next.length ? next.map(m =>
        '<div class="row"><div class="row-main" style="opacity:.6"><span class="badge-icon small">' + m.icon + '</span>' +
        '<div><div class="row-title">' + eH0(m.name) + '</div><div class="row-sub">' + eH0(m.desc) + '</div></div></div></div>').join('')
        : '<p class="empty">You have unlocked every milestone! 🎉</p>') + '</div>';
    function eH0(s) { return MF.escapeHtml(s); }
    function doneCountMsg(n) {
      if (n === 0) return '🌱 Everything starts with a first step.';
      if (n < 4) return '👏 ' + n + ' milestone' + (n === 1 ? '' : 's') + ' so far — real progress.';
      if (n < 8) return '🌿 ' + n + ' milestones — you are steady and building.';
      return '🏆 ' + n + ' milestones — this is long-term, healthy money management.';
    }
  }

  MF.milestones = { render, check, DEFS };
})();
</script>
<script>/* ============================================================
   MindFlow — backup: versioned, validated export/import
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;

  function makePayload() {
    const d = JSON.parse(MF.storage.exportJSON()); // deep copy
    d.exportedAt = new Date().toISOString();
    d.app = 'MindFlow Budget Planner';
    d.formatVersion = MF.schemaVersion;
    return JSON.stringify(d, null, 2);
  }
  function exportFile(name) {
    const blob = new Blob([makePayload()], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  /* Deep content checks: catch corrupted backups (broken amounts, dates or
     field types) instead of silently importing numbers that poison derived
     math. Returns an array of problem descriptions (empty = healthy). */
  function deepProblems(p) {
    const problems = [];
    const validDate = v => typeof v === 'string' && !!MF.dates.parse(v);
    const num = v => typeof v === 'number' && isFinite(v);
    const push = msg => { if (problems.length < 8) problems.push(msg); };
    for (const key of ['accounts', 'transactions', 'bills', 'goals', 'debts', 'incomeSources', 'categories', 'paychecks', 'envelopes', 'milestones', 'brainDump']) {
      if (p[key] != null && !Array.isArray(p[key])) push(key + ' must be a list');
    }
    if (problems.length) return problems;
    const dateFields = new Set(['date', 'firstDue', 'nextDue', 'startDate', 'nextPaydate', 'endDate', 'targetDate', 'dueDate', 'paidDate', 'completedDate', 'paidOffDate', 'anchorDate']);
    function inspectDates(obj) {
      if (!obj || typeof obj !== 'object') return;
      for (const [key, value] of Object.entries(obj)) {
        if (dateFields.has(key) && value != null && value !== '' && !validDate(value)) push('Invalid calendar date in ' + key + ': ' + String(value));
        if (['expectedDates', 'receivedDates'].includes(key) && (!Array.isArray(value) || value.some(d => !validDate(d)))) push('Invalid dates in ' + key);
        if (value && typeof value === 'object') inspectDates(value);
      }
    }
    inspectDates(p);
    (p.transactions || []).forEach((t, i) => {
      if (!t || typeof t !== 'object') { push('Transaction #' + (i + 1) + ' is malformed'); return; }
      if (!Number.isSafeInteger(t.amountCents) || t.amountCents < 0) push('Transaction “' + (t.description || t.id || i + 1) + '” has a broken amount (' + String(t.amountCents) + ')');
      if (t.split != null && (!Array.isArray(t.split) || !t.split.length ||
          t.split.some(part => !part || typeof part.categoryId !== 'string' || !Number.isSafeInteger(part.amountCents) || part.amountCents < 0) ||
          MF.sum(t.split.map(part => part.amountCents)) !== t.amountCents)) push('Transaction has an invalid split total or split amount');
      if (!validDate(t.date)) push('Transaction “' + (t.description || t.id || i + 1) + '” has an invalid date (' + String(t.date) + ')');
    });
    (p.accounts || []).forEach((a, i) => {
      if (!a || typeof a !== 'object') { push('Account #' + (i + 1) + ' is malformed'); return; }
      if (!num(a.startingCents)) push('Account “' + (a.name || i + 1) + '” has a broken starting balance (' + String(a.startingCents) + ')');
    });
    (p.bills || []).forEach((b, i) => {
      if (!b || typeof b !== 'object') { push('Bill #' + (i + 1) + ' is malformed'); return; }
      if (!num(b.amountCents)) push('Bill “' + (b.name || i + 1) + '” has a broken amount (' + String(b.amountCents) + ')');
    });
    (p.goals || []).forEach((g, i) => {
      if (!g || typeof g !== 'object') { push('Goal #' + (i + 1) + ' is malformed'); return; }
      if (!num(g.targetCents) || !num(g.savedCents)) push('Goal “' + (g.name || i + 1) + '” has broken amounts');
    });
    (p.debts || []).forEach((d, i) => {
      if (!d || typeof d !== 'object') { push('Debt #' + (i + 1) + ' is malformed'); return; }
      if (!num(d.balanceCents)) push('Debt “' + (d.name || i + 1) + '” has a broken balance (' + String(d.balanceCents) + ')');
    });
    (p.incomeSources || []).forEach((s, i) => {
      if (!s || typeof s !== 'object') { push('Income source #' + (i + 1) + ' is malformed'); return; }
      if (s.amountCents !== undefined && !num(s.amountCents)) push('Income source “' + (s.name || i + 1) + '” has a broken amount (' + String(s.amountCents) + ')');
    });
    return problems;
  }

  function validate(text) {
    let p;
    try { p = JSON.parse(text); } catch (e) { throw new Error('That file is not valid JSON — it may be damaged or the wrong type.'); }
    if (!p || typeof p !== 'object') throw new Error('This file is not a MindFlow backup.');
    if (p.app && p.app !== 'MindFlow Budget Planner') throw new Error('This backup came from a different application.');
    if (typeof p.formatVersion !== 'number' && typeof (p.meta && p.meta.schemaVersion) !== 'number') {
      throw new Error('This backup has no version information, so it cannot be validated.');
    }
    if (!Array.isArray(p.transactions) || !Array.isArray(p.accounts) || !p.settings) {
      throw new Error('This file is missing core MindFlow data (accounts/transactions/settings).');
    }
    if (!p.meta || !Number.isInteger(p.meta.schemaVersion) || p.meta.schemaVersion < 1 ||
        typeof p.settings !== 'object' || Array.isArray(p.settings)) throw new Error('This backup has invalid settings or schema information.');
    // sanity: known version, not from the future
    const v = Math.max(p.formatVersion || 0, p.meta.schemaVersion);
    if (v > MF.schemaVersion) throw new Error('This backup is from a newer MindFlow version (' + v + '). Please update MindFlow first.');
    // sanity: contents must be internally usable before anything is replaced
    const problems = deepProblems(p);
    if (problems.length) {
      throw new Error('This backup is corrupted: ' + problems.join('; ') + '. Import cancelled — your current data is unchanged.');
    }
    const stats = p.accounts.length + ' account(s), ' + p.transactions.length + ' transaction(s), ' +
      (p.bills || []).length + ' bill(s), ' + (p.goals || []).length + ' goal(s)';
    return { valid: true, stats, data: p };
  }

  function restore(text) {
    const v = validate(text);
    // recovery safety copy of the CURRENT data is written first (see storage)
    try { MF.storage.recoverySnapshot(); } catch (e) { /* non-fatal */ }
    MF.storage.importJSON(JSON.stringify(v.data));
    /* Persistence MUST be confirmed before callers claim success: importJSON's
       own save() may have failed (quota / blocked storage). An immediate
       save() is both the confirmation and the retry — if the first write
       failed, `last` was left untouched so this call re-attempts the exact
       restored payload. */
    v.persisted = MF.storage.save() !== false;
    return v;
  }

  MF.backup = { makePayload, exportFile, validate, restore };
})();
</script>
