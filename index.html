    { id: 'bills', title: 'Bills – recurring & one-time', tip: 'Never be surprised by a due date.', body: [
      '<p>Add a bill with its amount, due date and frequency. Choices include One-time and Custom interval. Use the Bills page and calendar to review due dates. With reminders enabled, MindFlow shows due items while the planner is open.</p>',
      '<p><strong>Set-aside:</strong> turn on gradual saving, then use <em>Set aside</em> on the Bills page to record an earmark. This money stays in the account. When you record the bill as paid, the full bill amount is recorded and the matching reserve is used; the reserve is not a second payment.</p>',
      '<p><strong>Paying a credit card bill:</strong> open Settings → Accounts → <em>Transfer</em>. Choose the paying account as From and the credit-card account as To. Recording the repayment as a transfer keeps it out of income and expenses, so card purchases are not counted twice.</p>'] },
    { id: 'accounts', title: 'Accounts & balances', tip: 'Where your money lives.', body: [
      '<p>Accounts hold balances. Checking, savings and cash are <em>money you have</em>. Credit cards are <em>money you owe</em> — purchases reduce the card balance (shows as owed), and paying the card later moves money over.</p>',
      '<p>Transfers record money moved between your accounts and are <strong>never</strong> income or expenses in reports. MindFlow does not connect to your bank or move money for you; enter movements that you make yourself.</p>'] },
    { id: 'goals', title: 'Savings goals', tip: 'Little pots with big feelings.', body: [
      '<p>Create goals for an emergency fund, travel, a laptop — anything. <em>Add money</em> records a transfer from a planner account into the goal; <em>Withdraw</em> records a transfer back. These actions update your planner records and do not transfer money at your bank.</p>',
      '<p>A monthly contribution is a plan used to estimate the finish date; record actual contributions with <em>Add money</em>. A goal is completed when its saved amount reaches its target. A withdrawal or a higher target can make it active again. A contribution that has already been partly withdrawn cannot be deleted until enough money is returned to the goal or the withdrawal is undone.</p>'] },
    { id: 'debt', title: 'Debt management', tip: 'Snowball or avalanche — your choice.', body: [
      '<p>Track each debt with its balance, interest rate (APR) and minimum payment. MindFlow projects your debt-free date using the <strong>snowball</strong> (smallest balance first) or <strong>avalanche</strong> (highest interest first) strategy — switchable in seconds.</p>',
      '<p>Interest recorded with a payment is estimated using APR ÷ 365 per day between payment dates. The payoff plan is an estimate, not a lender statement; check actual balances and interest against your lender records.</p>'] },
    { id: 'envelopes', title: 'Spending envelopes', tip: 'Category budgets with guardrails.', body: [
      '<p>An envelope tracks a category limit for a week, two weeks or a month. The progress bar fills as you record spending. The limit is a tracking guide; creating an envelope does not move or reserve account money.</p>',
      '<p>At 85% used, the card shows <em>Close to limit</em>; at 100% or more it shows <em>Over limit</em>. Optional budget reminders use a separate 90% threshold. <em>Move money</em> adjusts envelope limits; it does not transfer money between bank accounts.</p>'] },
    { id: 'reports', title: 'Reports', tip: 'Where did it all go?', body: [
      '<p>Reports use your recorded transactions within the selected date range. Choose Week, This month, Last month, 3 mo, 6 mo, Year, All or Custom. <em>Savings moved</em> adds contributions and withdrawals: $100 added plus $20 withdrawn is $120 moved, while the goal balance is $80.</p>',
      '<p>Use <em>Export CSV</em> to download transactions for the selected period, or <em>Print summary</em> to open a print-friendly summary. The printed <em>Savings contributions</em> row counts money added to goals, excluding withdrawals.</p>'] },
    { id: 'backup', title: 'Backup & restore', tip: 'Keep your data yours.', body: [
      '<p>All data stays on this device. Export a backup (Settings → Backup & Data) before switching devices or clearing browser data.</p>',
      '<p>Use <em>Export full backup</em> to save a MindFlow .json file containing your planner records and settings. Under <em>Restore a backup</em>, select that file and review the confirmation. Files that fail validation are rejected. A successful restore replaces the current planner data, so export the current data first if you need to keep it. A transactions CSV is not a full backup.</p>',
      '<p>Tip: e-mail the backup to yourself or store it in your own cloud drive. MindFlow never uploads anything by itself.</p>'] },
    { id: 'offline', title: 'Using MindFlow offline', tip: 'No internet? Fine.', body: [
      '<p>This offline edition is a downloaded HTML file. Open the file directly in a browser; its features do not need an internet connection. Your records are saved in that browser profile on that device.</p>',
      '<p>No installation is required for this HTML edition. Keep using the same browser and file location. Export a full backup before moving, renaming or replacing the file, switching browsers, or clearing browser data.</p>',
      '<p>Data does not automatically sync between devices — use exported backups to move your data between them.</p>'] },
    { id: 'faq', title: 'FAQ', tip: 'Small questions, quick answers.', body: [
      '<p><strong>Is my data private?</strong> Yes — everything is stored locally in your browser. MindFlow has no accounts, no servers and no trackers. Note: plain browser storage is not encrypted by MindFlow; it is as private as your own computer and browser profile.</p>',
      '<p><strong>What happens if this browser’s data is cleared?</strong> MindFlow data lives inside browser storage, so clearing site data (or uninstalling the browser) erases it. Export a backup from Settings → Backup & Data and keep it somewhere safe.</p>',
      '<p><strong>Can I use multiple currencies?</strong> One display currency at a time (Settings → Personal), including USD, EUR, GBP, INR and PKR. Changing it is a display label only — amounts keep their stored values and are shown with the new symbol; no exchange-rate conversion happens.</p>',
      '<p><strong>What if I disappear for a few weeks?</strong> Nothing breaks. The Today screen will offer a gentle “back on track” summary with your balance and upcoming bills.</p>',
      '<p><strong>Does deleting a bill delete its payments?</strong> No — past payment transactions are kept.</p>',
      '<p><strong>Why are transfers excluded from income and expenses?</strong> Moving money between your own accounts is not earning or spending. Reports may still show transfer activity separately, such as Savings moved.</p>',
      '<p><strong>Can I undo a bill payment?</strong> Open <em>Transactions</em>, select the bill-payment transaction, choose <em>Edit</em>, then <em>Delete</em> and confirm. This removes that payment transaction and its linked paid marker. Delete only if you want to undo the payment record in MindFlow; this does not cancel a payment at your bank.</p>'] }
  ];

  let openId = 'start', q = '';

  function render(el) {
    const ql = q.toLowerCase();
    const list = TOPICS.filter(t => !ql || t.title.toLowerCase().includes(ql) || t.body.join(' ').toLowerCase().includes(ql) || t.tip.toLowerCase().includes(ql));
    const t = TOPICS.find(x => x.id === openId) || list[0] || TOPICS[0];
    el.innerHTML =
      '<header class="page-head"><div><h2>Help & Guide</h2><p class="page-sub">Everything you need, in plain language.</p></div></header>' +
      '<div class="help-grid">' +
      '<div class="help-nav">' +
      '<div class="search-box"><input id="help-q" type="search" placeholder="Search help…" value="' + MF.escapeHtml(q) + '" aria-label="Search help topics">' + MF.icon('search') + '</div>' +
      '<nav class="list">' + list.map(x =>
        '<button class="row row-btn' + (x.id === t.id ? ' act' : '') + '" data-topic="' + x.id + '"><div class="row-main"><div><div class="row-title">' + MF.escapeHtml(x.title) + '</div>' +
        '<div class="row-sub">' + MF.escapeHtml(x.tip) + '</div></div></div></button>').join('') +
      '</nav></div>' +
      '<article class="card help-article"><h3>' + MF.escapeHtml(t.title) + '</h3>' + t.body.join('') + '</article></div>' +
      '<section class="card glossary"><h4>Glossary — no jargon required</h4><dl class="gloss-list">' +
      GLOSS.map(g => '<div><dt>' + g[0] + '</dt><dd>' + g[1] + '</dd></div>').join('') + '</dl></section>';
    el.querySelector('#help-q').addEventListener('input', MF.debounce(ev => {
      q = ev.target.value; render(el);
      const inp = el.querySelector('#help-q'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }, 200));
    el.querySelectorAll('[data-topic]').forEach(b => b.addEventListener('click', () => { openId = b.dataset.topic; render(el); }));
  }

  const GLOSS = [
    ['Safe to Spend', 'Money you can spend freely until your next payday without breaking your plans.'],
    ['Envelope', 'A budget for one category (e.g., “Dining – $30/week”).'],
    ['Set-Aside', 'Saving gradually for a large bill so the due date never hurts.'],
    ['Snowball', 'Pay debts in order of smallest balance first — quick wins.'],
    ['Avalanche', 'Pay debts in order of highest interest first — saves more money'],
    ['APR', 'Annual Percentage Rate: the yearly cost of borrowing, as a percent.'],
    ['Net cash flow', 'Income minus expenses over a period. Positive = you kept some.'],
    ['Transfer', 'Money moved between your own accounts. Not earning, not spending.'],
    ['Refund', 'Money returned for a purchase; linked back to it in MindFlow.'],
    ['Buffer', 'Extra money you keep unused on purpose as a cushion.']
  ];

  MF.help = { render };
})();
</script>
<script>/* ============================================================
   MindFlow — onboarding (skippable steps, never blocking)
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  function start() {
    stepWelcome();
  }

  function shell(title, bodyHtml, steppers, onDone) {
    const m = MF.ui.modal({
      title,
      body: '<div class="onb">' + (steppers ? '<div class="onb-steps">' + steppers + '</div>' : '') + bodyHtml + '</div>',
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button>' +
        '<button class="btn btn-primary" data-act="ok">Continue →</button>',
      onOk(modal) { if (onDone(modal) !== false) { /* handler decides */ } }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => {
      if (onDone(null, true) !== false) ; // handlers manage skipping
    });
    return m;
  }

  function progress(n) {
    return Array.from({ length: 5 }, (_, i) => '<span class="onb-dot' + (i < n ? ' on' : '') + '"></span>').join('');
  }

  function stepWelcome() {
    const m = MF.ui.modal({
      title: 'Welcome to MindFlow 👋',
      body: '<div class="onb"><p><strong>MindFlow</strong> is a calm place for your money. You will know what you have, what is coming, and what is safe to spend — without spreadsheets or lectures.</p>' +
        '<ul class="onb-list"><li>💡 See <strong>Safe to Spend</strong> until payday</li>' +
        '<li>📬 Never be surprised by bills</li>' +
        '<li>🎯 Grow savings, shrink debt, gently</li></ul>' +
        '<p class="hint">Data stays on this device. No account needed.</p>' +
        '<div class="btn-row onb-choice">' +
        '<button class="btn btn-primary" id="ob-simple">Start simple</button>' +
        '<button class="btn btn-secondary" id="ob-custom">Customize my budget</button>' +
        '</div></div>',
      footer: ''
    });
    m.querySelector('#ob-simple').addEventListener('click', () => { MF.ui.closeModal(); quickSetup(); });
    m.querySelector('#ob-custom').addEventListener('click', () => { MF.ui.closeModal(); stepBasics(); });
  }

  function quickSetup() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Three quick answers',
      body: '<p class="hint">That’s all we need for a working dashboard. Everything can be changed later.</p>' + progress(2) +
        f.input('What should MindFlow call you?', { name: 'name', maxlength: 40, placeholder: 'e.g. Sam' }) +
        f.select('Your currency', { name: 'currency', value: 'USD', options: MF.settings.CURRENCIES }) +
        f.input('Money available to start with (all accounts combined)', { name: 'balance', type: 'number', step: '0.01', placeholder: '0.00' }) +
        f.select('When do you normally get paid?', { name: 'schedule', options: [['monthly', 'Monthly'], ['biweekly', 'Every two weeks'], ['weekly', 'Weekly'], ['semimonthly', 'Twice monthly'], ['irregular', 'It varies']] }),
      footer: '<button class="btn btn-ghost" data-act="skip">Later</button><button class="btn btn-primary" data-act="ok">That’s it — open my planner</button>',
      onOk(modal) {
        finishSimple(MF.ui.formData(modal));
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => {
      MF.ui.closeModal();
      finish(true);
    });
  }
  function finishSimple(d) {
    const s = MF.store.settings();
    s.name = d.name || s.name;
    s.currency = d.currency || s.currency;
    s.onboardingComplete = true;
    if (d.balance != null && d.balance !== '') {
      const bal = MF.money.parse(d.balance) || 0;
      let a = MF.store.list('accounts')[0];
      if (!a) a = MF.accounts.create({ name: 'My checking', type: 'checking', startingCents: bal, color: '#4c8fd6' });
      else a.startingCents = bal;
      s.defaultAccountId = a.id;
    }
    if (d.schedule) s.incomeSchedule = d.schedule;
    MF.storage.save();
    MF.ui.closeModal();
    finish(true);
    MF.ui.toast('Welcome, ' + (s.name || 'friend') + '! 🎉', 'success');
  }

  function stepBasics() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Step 1 · Basics',
      body: progress(1) +
        f.input('What should MindFlow call you?', { name: 'name', maxlength: 40, placeholder: 'Your first name is plenty' }) +
        f.select('Currency', { name: 'currency', value: MF.store.settings().currency, options: MF.settings.CURRENCIES }),
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button><button class="btn btn-primary" data-act="ok">Next →</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        MF.store.settings().name = d.name || MF.store.settings().name;
        MF.store.settings().currency = d.currency;
        MF.storage.save();
        MF.ui.closeModal();
        stepAccounts();
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => { MF.ui.closeModal(); stepAccounts(); });
  }

  function stepAccounts() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Step 2 · Your accounts',
      body: progress(1) +
        '<p class="hint">Where do you keep money? One checking account is enough to begin — you can add cards, cash and savings later in Settings.</p>' +
        f.input('Account name', { name: 'name', value: 'Checking', maxlength: 40 }) +
        f.select('Type', { name: 'type', options: [['checking', 'Checking'], ['savings', 'Savings'], ['cash', 'Cash'], ['credit', 'Credit Card']] }) +
        f.input('Current balance (money you have now; for a card, amount owed with a minus sign)', { name: 'balance', type: 'number', step: '0.01', placeholder: '0.00' }),
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button><button class="btn btn-primary" data-act="ok">Add & continue</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const bal = d.balance ? (MF.money.parse(d.balance) || 0) : 0;
        if (d.name) {
          const a = MF.accounts.create({ name: d.name, type: d.type, startingCents: bal, color: '#4c8fd6' });
          MF.store.settings().defaultAccountId = a.id;
        }
        MF.ui.closeModal();
        stepIncome();
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => { MF.ui.closeModal(); stepIncome(); });
  }

  function stepIncome() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Step 3 · Income',
      body: progress(2) +
        '<p class="hint">How does money reach you? This powers payday & Safe-to-Spend. Enter what you expect for a typical period.</p>' +
        f.input('Source name (optional)', { name: 'name', maxlength: 40, placeholder: 'e.g. Main job' }) +
        f.select('Schedule', { name: 'schedule', value: MF.store.settings().incomeSchedule || 'monthly', options: [['monthly', 'Monthly'], ['biweekly', 'Every two weeks'], ['weekly', 'Weekly'], ['semimonthly', 'Twice monthly'], ['irregular', 'Irregular']] }) +
        f.input('Typical amount', { name: 'amount', type: 'number', step: '0.01', placeholder: '0.00' }) +
        f.input('Next payday (expected date)', { name: 'nextPaydate', type: 'date', value: D.addDays(D.today(), 14) }),
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button><button class="btn btn-primary" data-act="ok">Next →</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        if (d.amount && MF.money.parse(d.amount)) {
          MF.store.list('incomeSources').push({
            id: MF.uid('inc'), name: d.name || 'Income', type: 'salary',
            schedule: d.schedule, amountCents: MF.money.parse(d.amount),
            nextPaydate: d.nextPaydate || D.addDays(D.today(), 14), startDate: d.nextPaydate || D.addDays(D.today(), 14),
            weekendAdjust: 'before', allocation: { bills: 0, savings: 0, debt: 0, spending: 100 }, receivedDates: []
          });
        }
        MF.ui.closeModal();
        stepBills();
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => { MF.ui.closeModal(); stepBills(); });
  }

  function stepBills() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Step 4 · Bills (optional)',
      body: progress(3) +
        '<p class="hint">Add one or two bills now if you like — rent, phone, internet. Skipping is completely fine; you can add them in seconds later.</p>' +
        '<div class="form-2col">' + f.input('Bill name', { name: 'name', maxlength: 40, placeholder: 'e.g. Rent' }) + '</div>' +
        '<div class="form-2col">' + f.input('Amount', { name: 'amount', type: 'number', step: '0.01', placeholder: '0.00' }) +
        f.select('Frequency', { name: 'frequency', options: [['monthly', 'Monthly'], ['biweekly', 'Every two weeks'], ['weekly', 'Weekly'], ['yearly', 'Yearly'], ['once', 'One time only']] }) + '</div>' +
        f.input('Next due date', { name: 'nextDue', type: 'date', value: D.addDays(D.today(), 10) }),
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button><button class="btn btn-primary" data-act="ok">Next →</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = d.amount ? MF.money.parse(d.amount) : 0;
        if (d.name && amt > 0) {
          MF.store.list('bills').push({
            id: MF.uid('bill'), name: d.name, amountCents: amt, categoryId: 'cat_household',
            frequency: d.frequency, nextDue: d.nextDue, firstDue: d.nextDue,
            accountId: (MF.store.settings().defaultAccountId) || null, paidHistory: [], reservedCents: 0, notes: ''
          });
        }
        MF.ui.closeModal();
        stepSavings();
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => { MF.ui.closeModal(); stepSavings(); });
  }

  function stepSavings() {
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Step 5 · A savings goal (optional)',
      body: progress(3) + '<p class="hint">Even a small “just in case” fund changes how the month feels. Entirely optional.</p>' +
        f.input('Goal name', { name: 'name', maxlength: 40, placeholder: 'e.g. Emergency fund' }) +
        f.input('Target amount', { name: 'target', type: 'number', step: '0.01', placeholder: '0.00' }) +
        f.input('Monthly contribution (optional)', { name: 'monthly', type: 'number', min: 0, step: '0.01', placeholder: '0.00' }),
      footer: '<button class="btn btn-ghost" data-act="skip">Skip</button><button class="btn btn-primary" data-act="ok">Next →</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const t = d.target ? MF.money.parse(d.target) : 0;
        if (d.name && t > 0) {
          MF.store.list('goals').push({
            id: MF.uid('goal'), name: d.name, targetCents: t, savedCents: 0,
            monthlyCents: d.monthly ? MF.money.parse(d.monthly) || 0 : 0,
            category: 'Savings', color: '#2f9e6e', history: []
          });
        }
        MF.ui.closeModal();
        stepDone();
      }
    });
    m.querySelector('[data-act="skip"]').addEventListener('click', () => { MF.ui.closeModal(); stepDone(); });
  }

  function stepDone() {
    MF.ui.modal({
      title: 'You’re all set 🎉',
      body: '<div class="onb"><p class="pg">MindFlow set up a dashboard from what you entered. Nothing was assumed — everything on the Today screen comes from your own numbers.</p>' +
        '<ul class="onb-list"><li>🛒 <strong>Recording spending:</strong> open Transactions and tap “Add expense”.</li>' +
        '<li>🛟 <strong>Safe to Spend</strong> on the Today screen is your spendable money until payday — it already subtracts upcoming bills, planned savings and money set aside.</li>' +
        '<li>🏅 <strong>Right Now</strong> suggests one useful next step</li>' +
        '<li>✏️ Edit anything, anytime, in the section it lives in</li>' +
        '<li>📚 The <strong>Help & Guide</strong> page answers the rest</li></ul>' +
        '<p class="hint">Tip: export a backup every so often (Settings → Backup & Data). It takes one click.</p></div>',
      footer: '<button class="btn btn-primary" data-act="ok">Open my planner</button>',
      onOk() { MF.ui.closeModal(); finish(true); MF.app.rerender(); }
    });
  }

  function finish(silent) {
    MF.store.settings().onboardingComplete = true;
    MF.storage.save();
    MF.app.milestones();
    MF.nav.go('today');
  }

  MF.onboarding = { start, finish };
})();
</script>
<script>/* ============================================================
   MindFlow — Today dashboard (hero safe-to-spend, quick actions,
   widgets) + Right Now suggestion + Getting-back-on-track.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  function render(el) {
    checkReturningUser();
    const st = MF.store.settings();
    const stn = MF.calc.safeToSpend();
    const spendable = stn.available;
    const net = MF.calc.totalNetWorth();
    const upcoming = MF.calc.billsDueBetween(D.today(), D.addDays(D.today(), 13));
    const cards = st.dashboardCards || {};
    const simpMode = st.mode === 'simple';

    el.innerHTML =
      (!st.onboardingComplete ? onboardingTeaser() : '') +
      (isReturningSoon() ? returningBanner() : '') +
      (cards.rightNow !== false ? rightNowCard(stn) : '') +

      '<div class="grid grids-3">' +
      (cards.balance !== false ? card('Net worth (all accounts)', fmt(net), net >= 0 ? 'pos' : 'neg', 'money in every account — including what cards owe') : '') +
      (cards.payday !== false ? card('Next payday', stn.payday ? D.fmtRelative(stn.payday) + '<br><small>' + eH(D.fmtHuman(stn.payday)) + '</small>' : 'Not set', '', 'add income in Income →') : '') +
      (cards.savings !== false ? card('Total savings', fmt(MF.savings.totalSaved()), '', MF.store.list('goals').length ? MF.store.list('goals').filter(g => !g.completed).length + ' active goal(s)' : 'no goals yet') : '') +
      (cards.debt !== false ? card('Outstanding debt', fmt(MF.debt.summary().total), 'neg', MF.debt.summary().count + ' debt(s) tracked') : '') +
      '</div>' +

      (cards.sts !== false ? safeToSpendCard(stn) : '') +

      '<div class="qa-row" role="group" aria-label="Quick actions">' +
      '<button class="btn btn-primary" data-qa="expense">' + MF.icon('plus', 'sm') + ' Add expense</button>' +
      '<button class="btn btn-secondary" data-qa="income">' + MF.icon('income', 'sm') + ' Add income</button>' +
      '<button class="btn btn-ghost" data-qa="paybill">' + MF.icon('bills', 'sm') + ' Pay a bill</button>' +
      '<button class="btn btn-ghost" data-qa="savings">Add savings</button>' +
      '<button class="btn btn-ghost" data-qa="debt">Pay debt</button>' +
      '<button class="btn btn-ghost" data-qa="transfer">' + MF.icon('transactions', 'sm') + ' Transfer</button>' +
      '</div>' +

      '<div class="grid grids-2">' +
      '<section class="card"><h4>Recent activity</h4>' + recentList() + '</section>' +
      '<section class="card"><h4>Upcoming bills (2 weeks)</h4>' +
      (upcoming.length ? '<div class="list">' + upcoming.map(x =>
        '<div class="row"><div class="row-main"><div><div class="row-title">' + eH(x.bill.name) + '</div>' +
        '<div class="row-sub">' + eH(D.fmtRelative(x.date)) + ' · ' + eH(D.fmtHuman(x.date)) + '</div></div></div>' +
        '<div class="row-side"><strong>' + eH(fmt(Math.max(0, x.remaining))) + '</strong>' +
        '<button class="btn btn-secondary btn-sm" data-quickpay="' + eH(x.bill.id) + '">Pay</button></div></div>').join('') + '</div>'
        : '<p class="empty">Nothing due in the next two weeks. 🌷</p>') + '</section>' +
      '</div>' +

      '<div class="grid grids-2">' +
      (cards.spendingOverview !== false ? spendingOverview() : '') +
      (cards.monthSummary !== false ? monthSummaryCard() : '') +
      '</div>' +

      '<section class="card"><h4>Brain dump</h4>' +
      '<p class="hint">Money-related thoughts, fast — no structure needed.</p>' +
      '<div class="dumper"><input id="dump-in" maxlength="160" placeholder="e.g. cancel gym membership? check car insurance renewal…">' +
      '<button class="btn btn-secondary" id="dump-add">Save</button></div>' +
      '<div class="list" id="dump-list"></div></section>' +
      renderDumpList();

    el.querySelectorAll('[data-qa]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.qa;
      if (k === 'expense') MF.txForm.expenseModal(null, { type: 'expense' });
      else if (k === 'income') MF.txForm.expenseModal(null, { type: 'income' });
      else if (k === 'paybill') {
        const b = MF.calc.billsDueBetween(D.today(), D.addDays(D.today(), 60));
        if (!b.length) { MF.ui.toast('No bills are due. Add one in Bills →', 'info'); return; }
        MF.bills.payQuick(b[0].bill);
      }
      else if (k === 'savings') {
        const g = MF.store.list('goals').find(g => !g.completed);
        if (!g) { MF.ui.toast('No savings goal yet — create one first.', 'info'); MF.nav.go('goals'); return; }
        MF.savings.moneyModal(g, false);
      }
      else if (k === 'debt') {
        const d = MF.store.list('debts').find(d => !d.paidOff);
        if (!d) { MF.ui.toast('No debts tracked — nothing to pay here.', 'info'); return; }
        MF.debt.payModal(d);
      }
      else if (k === 'transfer') MF.accounts.transferModal();
    }));
    el.querySelectorAll('[data-quickpay]').forEach(b => b.addEventListener('click', () => {
      const bill = MF.store.find('bills', b.dataset.quickpay);
      if (bill) MF.bills.payQuick(bill);
    }));
    const dumpAdd = el.querySelector('#dump-add');
    if (dumpAdd) {
      const add = () => {
        const v = el.querySelector('#dump-in').value.trim();
        if (!v) return;
        MF.store.list('brainDump').unshift({ id: MF.uid('dump'), text: v, date: D.today() });
        MF.storage.save();
        el.querySelector('#dump-in').value = '';
        el.querySelector('#dump-list').outerHTML = renderDumpList();
        wireDump(el);
      };
      dumpAdd.addEventListener('click', add);
      el.querySelector('#dump-in').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      wireDump(el);
    }
    wire(el);
  }

  function wireDump(el) {
    el.querySelectorAll('[data-dump-del]').forEach(b => b.addEventListener('click', () => {
      const list = MF.store.list('brainDump');
      const i = list.findIndex(x => x.id === b.dataset.dumpDel);
      if (i >= 0) { list.splice(i, 1); MF.storage.save(); b.closest('.dump-row').remove(); }
    }));
  }
  function renderDumpList() {
    const items = MF.store.list('brainDump').slice(0, 6);
    if (!items.length) return '<div class="list"><p class="empty">Nothing saved yet — your mind has a “parking lot” now.</p></div>';
    return '<div class="list">' + items.map(d =>
      '<div class="dump-row"><span>' + eH(d.text) + '</span><span class="row-sub">' + eH(d.date) + '</span>' +
      '<button class="icon-btn" data-dump-del="' + eH(d.id) + '" aria-label="Remove">' + MF.icon('trash') + '</button></div>').join('') + '</div>';
  }

  function card(label, big, cls, sub) {
    return '<section class="card stat"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-val ' + (cls || '') + '">' + big + '</div>' +
      '<div class="stat-sub">' + sub + '</div></section>';
  }

  function safeToSpendCard(stn) {
    const neg = stn.safeToSpend < 0;
    const parts = stn.parts.filter(p => p.cents !== 0 || p.cls === 'pos');
    return '<section class="card hero-card' + (neg ? ' hero-neg' : '') + '">' +
      '<div class="hero-left"><div class="stat-label">Safe to Spend until next payday</div>' +
      '<div class="hero-num ' + (neg ? 'neg' : '') + '">' + eH(fmt(stn.safeToSpend)) + '</div>' +
      '<div class="hero-sub"><span>' + eH(fmt(stn.daily)) + '/day suggested limit</span> · <span>' + stn.daysLeft + ' day(s) to payday' +
      (stn.billsSkippedFullyReserved && stn.billsSkippedFullyReserved.length ? ' · ' + stn.billsSkippedFullyReserved.length + ' bill(s) already saved for' : '') + '</span></div>' +
      (neg ? '<div class="info-box warn">Spending ahead is common and fixable — your obligations before payday exceed the money currently on hand. Try: move optional purchases after payday, check for a bill you can adjust, or move buffer money from savings. You are not “behind”, there is just a plan to make.</div>' : '') +
      (stn.showExpectedIncome && stn.expectedIncome > 0 ? '<p class="hint">Expected by payday: ' + eH(fmt(stn.expectedIncome)) + ' — not included above until received.</p>' : '') +
      '<details class="calc-details"><summary>How this was calculated</summary>' +
      '<div class="list">' + parts.map(p =>
        '<div class="row"><div class="row-main"><div><div class="row-title">' + eH(p.label) + '</div>' +
        '<div class="row-sub">' + eH(p.note || '') + '</div></div></div>' +
        '<div class="row-side ' + (p.cls === 'pos' ? 'pos' : 'neg') + '">' + (p.cents >= 0 ? '+' : '−') + eH(fmt(Math.abs(p.cents))) + '</div></div>').join('') +
      '</div><p class="hint">Safe to Spend uses money currently on hand, less commitments and your buffer. Expected paychecks are shown separately and are only included after you record them as received.</p></details>' +
      '</div>' +
      '<div class="hero-ring">' + MF.ui.ring(daysPct(stn), 96) + '</div></section>';
  }
  function daysPct(stn) {
    const total = 30; return MF.clamp(100 - stn.daysLeft * (100 / total), 0, 100);
  }

  function rightNowCard(stn) {
    const s = rightNow(state0());
    if (!s) return '';
    return '<section class="card right-now"><div class="rn-icon">' + s.icon + '</div><div>' +
      '<div class="row-title">Right now: ' + eH(s.title) + '</div><div class="row-sub">' + eH(s.body) + '</div>' +
      (s.action ? '<button class="btn btn-primary btn-sm" data-rn="' + eH(s.action[0]) + '">' + eH(s.action[1]) + '</button>' : '') +
      '</div></section>';
  }
  function state0() {
    return {
      stn: MF.calc.safeToSpend(),
      bills: MF.calc.billsDueBetween(D.today(), D.addDays(D.today(), 4)),
      noIncome: !MF.store.list('incomeSources').length,
      noAccounts: !MF.store.list('accounts').length,
      overdue: MF.store.list('bills').filter(b => !b.archived && b.nextDue && MF.dates.daysBetween(MF.dates.today(), b.nextDue) < 0).length
    };
  }
  function rightNow(s) {
    if (s.stn.safeToSpend < 0) return { icon: '⚠️', title: 'tight week ahead', body: 'Your Safe to Spend is negative before payday. Small changes this week can steady it.', action: null };
    if (s.overdue) return { icon: '📬', title: Math.min(3, s.overdue) + ' bill(s) overdue', body: 'A quick check of Bills keeps fees away.', action: ['bills', 'Review bills'] };
    if (s.bills.length) {
      const b = s.bills[0];
      return { icon: '💳', title: '“' + b.bill.name + '” ' + (b.date === MF.dates.today() ? 'due today' : 'due soon'), body: MF.money.fmt(b.remaining) + ' — ' + MF.dates.fmtRelative(b.date), action: ['bills', 'Review bills'] };
    }
    if (s.noAccounts) return { icon: '🏁', title: 'add your first account', body: 'Takes one minute and unlocks balance tracking.', action: ['accounts', 'Add account'] };
    if (s.noIncome) return { icon: '💵', title: 'tell MindFlow about income', body: 'Knowing your payday makes Safe-to-Spend accurate.', action: ['income', 'Add income'] };
    if (!MF.store.list('goals').length) return { icon: '🎯', title: 'thinking of a small goal?', body: 'Even $25 for a rainy day builds the habit.', action: ['goals', 'Create goal'] };
    return null;
  }

  function recentList() {
    const txns = MF.tx.filterTxns({ sort: 'date', dir: 'desc' }).slice(0, 7);
    if (!txns.length) return '<p class="empty">No transactions yet — add one with the quick actions above.</p>';
    return '<div class="list">' + txns.map(t => MF.tx.txnRow(t)).join('') + '</div>';
  }
  function spendingOverview() {
    const month = MF.calc.monthSummary(D.today().slice(0, 7));
    const cats = MF.calc.byCategory(month.from, month.to);
    const total = MF.sum(cats.map(c => c.cents));
    return '<section class="card"><h4>This month’s spending</h4>' +
      (cats.length ? '<canvas id="dash-donut" data-h="190"></canvas>' +
        '<div class="list">' + cats.slice(0, 5).map(c =>
          '<div class="row"><div class="row-main"><span class="dot" style="background:' + eH(c.cat.color) + '"></span>' + eH(c.cat.name) + '</div>' +
          '<div class="row-side">' + eH(fmt(c.cents)) + '</div></div>').join('') + '</div>'
        : '<p class="empty">No spending recorded this month yet.</p>') +
      '<div class="list nowrap-nums"><span>Income: <strong class="pos">' + eH(fmt(month.income)) + '</strong></span>' +
      '<span>Expenses: <strong class="neg">' + eH(fmt(month.expense)) + '</strong></span></div></section>';
  }
  function monthSummaryCard() {
    const m = MF.calc.monthSummary(D.today().slice(0, 7));
    return '<section class="card"><h4>Monthly summary</h4>' +
      '<div class="kvs">' +
      kv('Net so far', m.net, m.net >= 0 ? 'pos' : 'neg') +
      kv('Savings moved', m.savings, '') +
      kv('Debt paid', m.debtPaid, '') +
      kv('Bill payments', monthBillPaid(), '') +
      '</div>' +
      '<p class="hint">' + monthComment(m) + '</p></section>';
    function kv(label, cents, cls) {
      return '<div class="kv"><span>' + label + '</span><strong class="' + cls + '">' + fmt(cents) + '</strong></div>';
    }
  }
  function monthBillPaid() {
    const month = D.today().slice(0, 7);
    return MF.store.list('transactions').filter(t => t.billId && t.date.slice(0, 7) === month && t.type === 'expense')
      .reduce((s, t) => s + t.amountCents, 0);
  }
  function monthComment(m) {
    if (!m.count) return 'Nothing recorded yet this month. Even one or two quick entries gives you a starting picture.';
    if (m.net >= 0) return 'Money in exceeds money out so far this month — you are in the green. Keep going.';
    return 'Spending is ahead of income so far this month. That is information, not judgment — the Reports page shows exactly where it went.';
  }

  function onboardingTeaser() {
    return '<div class="card welcome-card"><h4>Welcome to MindFlow 👋</h4>' +
      '<p>A calm way to see your money. Finish the one-minute setup to unlock personalized numbers.</p>' +
      '<button class="btn btn-primary" data-act="onboard">Start setup</button></div>';
  }

  function checkReturningUser() {
    const last = MF.store.settings().lastVisitDay;
    MF.store.setSetting('lastVisitDay', D.today());
  }
  function isReturningSoon() {
    const acct = MF.store.list('accounts').some(a => true);
    const recent = MF.store.list('transactions').some(t => MF.dates.daysBetween(t.date, D.today()) >= 14) ||
      MF.store.settings().lastVisitGapDays >= 14;
    return !!recent && !!acct;
  }
  function returningBanner() {
    const stn = MF.calc.safeToSpend();
    return '<div class="card back-card"><h4>Let’s get your budget back on track 👋</h4>' +
      '<div class="kvs">' +
      '<div class="kv"><span>Money available</span><strong>' + eH(fmt(stn.available)) + '</strong></div>' +
      '<div class="kv"><span>Next bill</span><strong>' + eH(stn.parts.find(p => p.label === 'Unpaid bills due by payday') ? 'check Bills →' : 'none soon') + '</strong></div>' +
      '<div class="kv"><span>Next payday</span><strong>' + eH(stn.payday ? D.fmtHuman(stn.payday) : 'not set') + '</strong></div>' +
      '</div>' +
      '<p class="hint">Quick update path: fix anything that changed (balances in Today → accounts, new bills) — everything else recalculates for you.</p>' +
      '<div class="btn-row"><button class="btn btn-primary btn-sm" data-act="go-bills">Check bills</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="go-income">Update income</button></div></div>';
  }

  function wire(el) {
    const ob = el.querySelector('[data-act="onboard"]');
    if (ob) ob.addEventListener('click', () => MF.onboarding.start());
    const gb = el.querySelector('[data-act="go-bills"]'); if (gb) gb.addEventListener('click', () => MF.nav.go('bills'));
    const gi = el.querySelector('[data-act="go-income"]'); if (gi) gi.addEventListener('click', () => MF.nav.go('income'));
  }

  function afterRender(el) {
    const donut = el.querySelector('#dash-donut');
    if (donut) {
      const month = MF.calc.monthSummary(D.today().slice(0, 7));
      const cats = MF.calc.byCategory(month.from, month.to);
      const total = MF.sum(cats.map(c => c.cents));
      MF.chart(donut, {
        kind: 'donut', center: fmt(total).replace(/(\d)[,.]?\d{0,2}$/, '$1'), centerSub: 'spent so far',
        items: cats.slice(0, 8).map(c => ({ color: c.cat.color, value: c.cents }))
      });
    }
  }

  /* expose post-render hook used by app */
  function renderAll(el) {
    render(el);
    afterRender(el);
  }

  MF.dashboard = { render: renderAll, rightNow };
})();
</script>
<script>/* ============================================================
   MindFlow — settings: personalization, financial, appearance,
   notifications, monthly data (backup/CSV/reset), accounts panel.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  let tab = 'personal';
  const TABS = [['personal', 'Personal'], ['financial', 'Money & Paydays'], ['appearance', 'Appearance'],
    ['notifications', 'Notifications'], ['data', 'Backup & Data'], ['accounts', 'Accounts'], ['categories', 'Categories']];

  function render(el) {
    el.innerHTML =
      '<header class="page-head"><div><h2>Settings</h2><p class="page-sub">Make MindFlow yours.</p></div></header>' +
      '<div class="tabs" role="tablist">' + TABS.map(t =>
        '<button class="tab' + (tab === t[0] ? ' act' : '') + '" role="tab" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div id="set-body"></div>';
    const body = el.querySelector('#set-body');
    ({ personal: personal, financial: financial, appearance: appearance, notifications: notifications, data: dataTab, accounts: accounts, categories: categories }[tab])(body);
    el.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(el); }));
  }

  /* ---------- personal ---------- */
  function personal(body) {
    const s = MF.store.settings();
    body.innerHTML =
      '<form id="pf" class="card form">' +
      '<h4>Personalization</h4>' +
      MF.ui.form.input('Your name (how MindFlow greets you)', { name: 'name', value: s.name, maxlength: 40, placeholder: 'e.g. Alex' }) +
      MF.ui.form.input('Planner name', { name: 'plannerName', value: s.plannerName, maxlength: 48 }) +
      '<div class="form-3col">' +
      MF.ui.form.select('Currency', { name: 'currency', value: s.currency, options: CURRENCIES }) +
      MF.ui.form.select('Date format', { name: 'dateFormat', value: s.dateFormat, options: [['MDY', 'MM/DD/YYYY'], ['DMY', 'DD/MM/YYYY'], ['YMD', 'YYYY-MM-DD']] }) +
      MF.ui.form.select('Week starts on', { name: 'weekStart', value: String(s.weekStart), options: [['0', 'Sunday'], ['1', 'Monday']] }) +
      '</div>' +
      '<button class="btn btn-primary" type="submit">Save</button></form>';
    body.querySelector('#pf').addEventListener('submit', e => {
      e.preventDefault();
      const d = formToObj(e.target);
      const finish = () => {
        Object.assign(MF.store.settings(), { name: d.name, plannerName: d.plannerName, currency: d.currency, dateFormat: d.dateFormat, weekStart: +d.weekStart });
        MF.storage.save();
        applyTheme(); MF.app.refreshNav();
        MF.ui.toast('Personal settings saved', 'success');
        MF.app.rerender();
      };
      // Currency is a DISPLAY label only: MindFlow has no exchange-rate
      // engine, so amounts keep their stored values and simply show the new
      // symbol. Warn before switching so no one mistakes this for conversion.
      if (d.currency !== MF.store.settings().currency) {
        MF.ui.confirm('Switch display currency to ' + (CURRENCIES.find(c => c[0] === d.currency) || [0, d.currency])[1] + '?',
          'MindFlow does not convert between currencies: your amounts keep their stored values and are shown with the new currency symbol only. ' +
          'If your accounts are held in a different currency, back up your data and start fresh or re-enter the amounts.', false, 'Switch currency')
          .then(ok => { if (ok) finish(); });
      } else { finish(); }
    });
  }

  /* ---------- financial ---------- */
  function financial(body) {
    const s = MF.store.settings();
    const sts = s.sts || {};
    const defAcc = MF.store.defaultAccount();
    body.innerHTML = '<form id="pf" class="card form">' +
      '<h4>Money & paydays</h4>' +
      '<div class="form-2col">' +
      MF.ui.form.select('Default account for new items', { name: 'defaultAccountId', value: defAcc ? defAcc.id : '', options: [['', 'None']].concat(MF.accounts.activeAccounts().map(a => [a.id, a.name])) }) +
      MF.ui.form.select('Default income schedule', { name: 'incomeSchedule', value: s.incomeSchedule || 'monthly', options: [['weekly', 'Weekly'], ['biweekly', 'Every two weeks'], ['semimonthly', 'Twice monthly'], ['monthly', 'Monthly'], ['irregular', 'Irregular']] }) +
      '</div>' +
      MF.ui.form.select('If a payday falls on a weekend', { name: 'paydayAdjust', value: s.paydayAdjust || 'after', options: [['none', 'Keep the date'], ['before', 'Pay the weekday before'], ['after', 'Pay the weekday after (e.g. Monday)']] }) +
      '<h4 style="margin-top:18px">Safe-to-Spend calculation</h4>' +
      MF.ui.form.toggle('Show expected pay separately (does not increase Safe to Spend)', { name: 'includeExpectedIncome', checked: sts.includeExpectedIncome !== false }) +
      MF.ui.form.toggle('Count savings accounts as spendable money', { name: 'countSavings', checked: sts.excludeSavingsAccounts === false }) +
      MF.ui.form.toggle('Count planned savings contributions before payday', { name: 'subtractPlannedSavings', checked: sts.subtractPlannedSavings !== false }) +
      MF.ui.form.toggle('Count debt minimum payments before payday', { name: 'subtractDebtPayments', checked: sts.subtractDebtPayments !== false }) +
      MF.ui.form.toggle('Set-aside reserves count as covered (recommended)', { name: 'excludeAutoReserved', checked: sts.excludeAutoReserved !== false }) +
      MF.ui.form.input('Always keep a cushion of (buffer)', { name: 'buffer', type: 'number', step: '0.01', value: (sts.bufferCents || 0) / 100 }) +
      '<div class="form-2col"><label class="field"><span class="field-label">Debt strategy for payoff plan</span><select name="debtStrategy">' +
      '<option value="snowball"' + (s.debtStrategy === 'snowball' ? ' selected' : '') + '>Snowball — smallest balance first</option>' +
      '<option value="avalanche"' + (s.debtStrategy === 'avalanche' ? ' selected' : '') + '>Avalanche — highest interest first</option></select></label></div>' +
      '<p class="hint">Changing these recalculates the Today screen instantly. Nothing is deleted.</p>' +
      '<button class="btn btn-primary" type="submit">Save</button></form>';
    body.querySelector('#pf').addEventListener('submit', e => {
      e.preventDefault();
      const d = formToObj(e.target);
      Object.assign(MF.store.settings(), { defaultAccountId: d.defaultAccountId || null, incomeSchedule: d.incomeSchedule, paydayAdjust: d.paydayAdjust, debtStrategy: d.debtStrategy });
      MF.store.settings().sts = {
        includeExpectedIncome: !!d.includeExpectedIncome,
        excludeSavingsAccounts: !d.countSavings,
        subtractPlannedSavings: !!d.subtractPlannedSavings,
        subtractDebtPayments: !!d.subtractDebtPayments,
        excludeAutoReserved: !!d.excludeAutoReserved,
        bufferCents: MF.money.parse(d.buffer) || 0
      };
      MF.storage.save();
      MF.ui.toast('Financial settings saved', 'success');
      MF.app.rerender();
    });
  }

  /* ---------- appearance ---------- */
  function appearance(body) {
    const s = MF.store.settings();
    body.innerHTML = '<form id="pf" class="card form"><h4>Appearance</h4>' +
      '<div class="form-2col">' +
      MF.ui.form.select('Theme', { name: 'theme', value: s.theme, options: [['light', 'Light'], ['dark', 'Dark'], ['auto', 'Match my system']] }) +
      MF.ui.form.select('Accent color', { name: 'accent', value: s.accent, options: ACCENTS }) +
      '</div>' +
      MF.ui.form.toggle('Compact mode (more on screen, less air)', { name: 'density', checked: s.density === 'compact' }) +
      MF.ui.form.toggle('Simple Mode — hide advanced features', { name: 'simple', checked: s.mode === 'simple' }) +
      '<h4 style="margin-top:14px">Dashboard cards</h4>' +
      DASHCARDS.map(c => MF.ui.form.toggle(c[1], { name: 'card_' + c[0], checked: (s.dashboardCards || {})[c[0]] !== false })).join('') +
      '<button class="btn btn-primary" type="submit">Save appearance</button></form>';
    body.querySelector('#pf').addEventListener('submit', e => {
      e.preventDefault();
      const d = formToObj(e.target);
      const st = MF.store.settings();
      st.theme = d.theme; st.accent = d.accent; st.density = d.density ? 'compact' : 'comfortable';
      st.mode = d.simple ? 'simple' : 'full';
      st.dashboardCards = {};
      DASHCARDS.forEach(c => st.dashboardCards[c[0]] = !!d['card_' + c[0]]);
      MF.storage.save(); applyTheme(); MF.app.refreshNav();
      MF.ui.toast('Appearance updated', 'success');
      MF.app.rerender();
    });
  }

  /* ---------- notifications ---------- */
  function notifications(body) {
    const n = MF.store.settings().notifications || {};
    const supported = 'Notification' in window;
    const granted = supported && Notification.permission === 'granted';
    body.innerHTML = '<form id="nf" class="card form"><h4>Notifications</h4>' +
      (supported ? '' : '<p class="info-box warn">This browser does not support notifications. Everything else keeps working — the Today screen shows ' +
      'due items so you never miss them.</p>') +
      MF.ui.form.toggle('Upcoming bills (due within 7 days)', { name: 'upcomingBills', checked: n.upcomingBills !== false }) +
      MF.ui.form.toggle('Flag overdue bills', { name: 'overdueBills', checked: n.overdueBills !== false }) +
      MF.ui.form.toggle('Payday reminders (on payday itself)', { name: 'payday', checked: n.payday !== false }) +
      MF.ui.form.toggle('Savings goal progress (25 / 50 / 75 / 100%)', { name: 'goalProgress', checked: n.goalProgress !== false }) +
      MF.ui.form.toggle('Envelope budget warnings (90%+)', { name: 'budgetWarnings', checked: n.budgetWarnings !== false }) +
      '<div class="btn-row">' +
      '<button class="btn btn-primary" type="submit">Save</button>' +
      (supported && granted ? '<button type="button" class="btn btn-ghost" id="ask-perm">Test a notification</button>' :
        supported ? '<button type="button" class="btn btn-secondary" id="ask-perm">Enable browser notifications</button>' : '') +
      '</div>' +
      '<p class="hint">MindFlow stores everything on your device. Notifications are local reminders, never uploads. Reminders appear as in-app messages when MindFlow is open (the Today screen also always shows due items). With permission granted, browser notifications add a popup — but like all offline-capable web apps, MindFlow cannot send anything while it is closed.</p></form>';
    body.querySelector('#nf').addEventListener('submit', e => {
      e.preventDefault();
      const d = formToObj(e.target);
      MF.store.settings().notifications = { upcomingBills: !!d.upcomingBills, overdueBills: !!d.overdueBills, payday: !!d.payday, goalProgress: !!d.goalProgress, budgetWarnings: !!d.budgetWarnings };
      MF.storage.save(); MF.ui.toast('Notification preferences saved', 'success');
    });
    const ap = body.querySelector('#ask-perm');
    if (ap) ap.addEventListener('click', () => {
      if (Notification.permission === 'granted') {
        new Notification('MindFlow works ✓', { body: 'Local reminders from your own planner.' });
      } else {
        Notification.requestPermission().then(p => {
          if (p === 'granted') { new Notification('MindFlow works ✓', { body: 'You now get local reminders.' }); MF.ui.toast('Notifications enabled', 'success'); }
          else MF.ui.toast('No problem — reminders still appear on the Today screen.', 'info');
        });
      }
    });
  }

  /* ---------- backup & data ---------- */
  function dataTab(body) {
    body.innerHTML = '<div class="card form"><h4>Your data lives on your device</h4>' +
      '<p class="hint">All MindFlow data is stored locally in this browser (localStorage). Nothing is uploaded anywhere. ' +
      'Export a backup before clearing browser data, switching devices or browsers.</p>' +
      '<div class="btn-row wrap">' +
      '<button class="btn btn-primary" id="bk-export">' + MF.icon('save', 'sm') + ' Export full backup</button>' +
      '<button class="btn btn-secondary" id="bk-trans">' + MF.icon('save', 'sm') + ' Export transactions CSV</button>' +
      '<button class="btn btn-ghost" id="bk-vac">Run data integrity check</button>' +
      '</div></div>' +
      '<div class="card form"><h4>Restore a backup</h4>' +
      '<p class="hint">Backups are MindFlow files ending in <code>.json</code>. Restoring replaces the data currently in this browser — export the current data first if unsure.</p>' +
      '<input type="file" id="bk-file" accept="application/json,.json" class="file-input">' +
      '<div id="bk-msg"></div></div>' +
      '<div class="card form danger-zone"><h4>Danger zone</h4>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" id="demo-load">Load demo data (clearly marked)</button>' +
      '<button class="btn btn-danger" id="do-reset">Delete everything & start fresh</button></div>' +
      '<p class="hint">Deleting asks for confirmation and cannot be undone. A rolling backup of your previous state is kept automatically (mindflow-data-v1.prev) for safety.</p></div>';
    body.querySelector('#bk-export').addEventListener('click', () => {
      const stamp = D.today();
      MF.backup.exportFile('mindflow-backup-' + stamp + '.json');
      MF.ui.toast('Backup exported — keep it in more than one safe place', 'success');
    });
    body.querySelector('#bk-trans').addEventListener('click', () => MF.reports.exportCSV({ from: '2000-01-01', to: D.addDays(D.today(), 1) }));
    const f = body.querySelector('#bk-file');
    f.addEventListener('change', () => {
      const file = f.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = MF.backup.validate(reader.result);
          MF.ui.confirm('Restore this backup?', 'It contains ' + data.stats + '. This replaces the data currently in this browser.', true, 'Restore backup')
            .then(ok => { if (ok) {
              const restored = MF.backup.restore(reader.result);
              applyTheme();
              MF.app.rerender();
              if (restored && restored.persisted === false) {
                MF.ui.toast('Restored on screen, but saving to browser storage FAILED — export a backup now and check storage space. A page refresh may bring your previous data back.', 'error');
              } else {
                MF.ui.toast('Backup restored & saved', 'success');
              }
            } });
        } catch (err) {
          body.querySelector('#bk-msg').innerHTML = '<p class="info-box warn">' + eH(err.message) + '</p>';
        }
      };
      reader.readAsText(file);
    });
    body.querySelector('#do-reset').addEventListener('click', async () => {
      const ok = await MF.ui.confirm('Delete ALL data?', 'Every transaction, account, bill, goal and setting in this browser will be gone. Export a backup first if you might want it back.', true, 'Delete everything');
      if (ok) {
        MF.storage.reset();
        applyTheme();
        MF.ui.toast('All data deleted. Starting fresh.', 'info');
        MF.app.start();
      }
    });
    body.querySelector('#demo-load').addEventListener('click', async () => {
      const ok = await MF.ui.confirm('Replace current data with the demo?', 'The demo is clearly marked sample data for exploring MindFlow. Your current data will be replaced (export first if needed).', true, 'Load demo');
      if (ok) {
        const restored = MF.backup.restore(MF.demo);
        applyTheme();
        if (restored && restored.persisted === false) {
          MF.ui.toast('Demo loaded on screen, but saving to browser storage FAILED — your previous data is untouched on disk; export a backup now.', 'error');
        } else {
          MF.ui.toast('Demo data loaded — marked in Settings, remove anytime', 'success');
        }
        MF.app.rerender();
      }
    });
    body.querySelector('#bk-vac').addEventListener('click', () => {
      MF.ui.confirm('Run data integrity check?', 'MindFlow calculates every balance live from your transactions, so balances are never out of sync. This check instead hunts for corrupted data records (broken amounts, dates or references) left behind by damaged backups or old imports.', false, 'Run check')
        .then(ok => {
          if (!ok) return;
          /* Honest audit: DETECT problems first, show them, then repair each
             confirmed item while keeping a record in Settings → Backup & Data.
             Nothing is zeroed or clamped without the user seeing it first. */
          const problems = [];
          MF.store.list('accounts').forEach(a => {
            if (typeof a.startingCents !== 'number' || !Number.isFinite(a.startingCents)) {
              problems.push({ kind: 'account-balance', ref: a.id, label: 'Account “' + (a.name || a.id) + '” has an un-read starting balance (' + String(a.startingCents) + ')', fix: () => { a.startingCents = 0; } });
            }
          });
          MF.store.list('transactions').forEach(t => {
            if (typeof t.amountCents !== 'number' || !Number.isFinite(t.amountCents)) {
              problems.push({ kind: 'txn-amount', ref: t.id, label: 'Transaction “' + (t.description || t.id) + '” has an un-read amount (' + String(t.amountCents) + ') — repair sets it to 0 so you can edit it', fix: () => { t.amountCents = 0; } });
            }
          });
          MF.store.list('bills').forEach(b => {
            if (b.reservedCents != null && (typeof b.amountCents !== 'number' || b.reservedCents > b.amountCents)) {
              problems.push({ kind: 'bill-reserve', ref: b.id, label: 'Bill “' + (b.name || b.id) + '” has a reserve above its amount — repair clamps the reserve to the bill amount', fix: () => { b.reservedCents = Math.max(0, Math.min(b.reservedCents || 0, b.amountCents || 0)); } });
            }
          });
          MF.store.list('transactions').forEach(t => {
            ['billId', 'debtId', 'goalId'].forEach(link => {
              if (t[link] && !MF.store.list(link === 'billId' ? 'bills' : link === 'debtId' ? 'debts' : 'goals').some(x => x.id === t[link])) {
                problems.push({ kind: 'dangling-' + link, ref: t.id, label: 'Transaction “' + (t.description || t.id) + '” references a missing ' + (link === 'billId' ? 'bill' : link === 'debtId' ? 'debt' : 'goal') + ' — repair un-links it', fix: () => { delete t[link]; } });
              }
            });
          });
          if (!problems.length) {
            MF.ui.toast('Data verified — every balance is calculated from your transactions and nothing was changed.', 'success');
            return;
          }
          MF.ui.modal({
            title: 'Found ' + problems.length + ' data problem(s)',
            body: '<ul class="list">' + problems.map(p => '<li>' + (window.MF.escapeHtml ? window.MF.escapeHtml(p.label) : p.label) + '</li>').join('') + '</ul>' +
              '<p class="hint">Repairs are minimal and only touch the damaged fields. A record of this repair is kept in your data.</p>',
            footer: '<button class="btn btn-ghost" data-act="cancel">Leave as is</button><button class="btn btn-primary" data-act="ok">Repair these items</button>',
            onOk() {
              const log = (MF.store.settings().integrityLog = MF.store.settings().integrityLog || []);
              problems.forEach(p => { p.fix(); log.push({ date: D.today(), kind: p.kind, ref: p.ref, label: p.label }); });
              MF.storage.save();
              MF.ui.closeModal();
              MF.ui.toast(problems.length + ' item(s) repaired (record kept in your data)', 'warn');
              MF.app.rerender();
            }
          });
        });
    });
  }

  /* ---------- accounts (reuse module) ---------- */
  function accounts(body) { MF.accounts.render(body); }
  function categories(body) {
    const cats = MF.store.categories();
    body.innerHTML = '<div class="card form"><h4>Spending categories</h4>' +
      '<div class="list">' + cats.map(c =>
        '<div class="row"><div class="row-main"><span class="dot" style="background:' + eH(c.color) + '"></span>' + eH(c.name) +
        (c.system ? ' <span class="row-sub">default</span>' : '') + '</div>' +
        '<div class="row-actions">' +
        '<button class="icon-btn" data-rename="' + eH(c.id) + '" aria-label="Rename">' + MF.icon('edit') + '</button>' +
        (c.system ? '' : '<button class="icon-btn" data-del="' + eH(c.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button>') + '</div></div>').join('') + '</div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="cat-add">' + MF.icon('plus', 'sm') + ' Add category</button></div></div>';
    body.querySelector('#cat-add').addEventListener('click', () => {
      const m = MF.ui.modal({
        title: 'New category',
        body: MF.ui.form.input('Name', { name: 'name', maxlength: 30 }) + MF.ui.form.color('Color', { name: 'color' }),
        footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Add</button>',
        onOk(modal) {
          const d = MF.ui.formData(modal);
          if (!d.name) throw new Error('Enter a name');
          MF.store.addCategory(d.name, d.__color);
          MF.ui.closeModal(); MF.app.rerender();
        }
      });
    });
    body.querySelectorAll('[data-rename]').forEach(b => b.addEventListener('click', () => {
      const c = MF.store.find('categories', b.dataset.rename); if (!c) return;
      const m = MF.ui.modal({
        title: 'Rename “' + c.name + '”',
        body: MF.ui.form.input('Name', { name: 'name', value: c.name, maxlength: 30 }),
        footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Rename</button>',
        onOk(modal) {
          const d = MF.ui.formData(modal);
          if (d.name) c.name = d.name;
          MF.storage.save(); MF.ui.closeModal(); MF.app.rerender();
        }
      });
    }));
    body.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      const c = MF.store.find('categories', b.dataset.del); if (!c) return;
      MF.ui.confirm('Delete “' + c.name + '”?', 'Only unused categories can be deleted.', true, 'Delete')
        .then(ok => { if (ok && MF.store.deleteCategory(c.id)) MF.app.rerender(); });
    }));
  }

  function formToObj(f) {
    const o = {};
    new FormData(f).forEach((v, k) => { o[k] = v; });
    f.querySelectorAll('input[type=checkbox][name]').forEach(c => o[c.name] = c.checked);
    return o;
  }

  const CURRENCIES = [['USD', 'US Dollar ($)'], ['EUR', 'Euro (€)'], ['GBP', 'British Pound (£)'], ['CAD', 'Canadian Dollar (CA$)'],
    ['AUD', 'Australian Dollar (A$)'], ['INR', 'Indian Rupee (₹)'], ['PKR', 'Pakistani Rupee (₨)'], ['NGN', 'Nigerian Naira (₦)'], ['ZAR', 'South African Rand (R)'],
    ['PHP', 'Philippine Peso (₱)'], ['BRL', 'Brazilian Real (R$)'], ['MXN', 'Mexican Peso (MX$)'], ['JPY', 'Japanese Yen (¥)']];
  const ACCENTS = [['teal', 'Calm Teal'], ['blue', 'Focused Blue'], ['green', 'Fresh Green'], ['purple', 'Gentle Purple'], ['amber', 'Warm Amber'], ['rose', 'Warm Rose']];
  const DASHCARDS = [['balance', 'Net worth card'], ['payday', 'Next payday card'], ['savings', 'Savings card'], ['debt', 'Debt card'],
    ['sts', 'Safe to Spend hero'], ['rightNow', '“Right Now” suggestion'], ['recent', 'Recent activity'], ['spendingOverview', 'Spending overview chart'], ['monthSummary', 'Monthly summary']];

  function applyTheme() {
    const s = MF.store.settings();
    const root = document.documentElement;
    const theme = s.theme;
    const dark = theme === 'dark' || (theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.accent = s.accent || 'teal';
    root.classList.toggle('compact', s.density === 'compact');
    root.classList.toggle('simple-mode', s.mode === 'simple');
  }

  MF.settings = { render, applyTheme, CURRENCIES, ACCENTS };
})();
</script>
<script>/* ============================================================
   MindFlow — application shell: sidebar/nav, router, month view,
   boot, milestone watcher, simple-mode filters, bill reminders.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  const PAGES = [
    { id: 'today', title: 'Today', icon: 'today', render: () => MF.dashboard.render },
    { id: 'month', title: 'Month', icon: 'month', render: () => MF.calendar.render },
    { id: 'transactions', title: 'Transactions', icon: 'transactions', render: () => MF.txPage.render },
    { id: 'bills', title: 'Bills', icon: 'bills', render: () => MF.bills.render },
    { id: 'income', title: 'Income', icon: 'income', render: () => MF.income.render },
    { id: 'goals', title: 'Savings Goals', icon: 'goals', render: () => MF.savings.render },
    { id: 'debt', title: 'Debt Manager', icon: 'debt', render: () => MF.debt.render },
    { id: 'envelopes', title: 'Spending Envelopes', icon: 'envelopes', render: () => MF.envelopes.render },
    { id: 'reports', title: 'Reports', icon: 'reports', render: () => MF.reports.render },
    { id: 'milestones', title: 'Milestones', icon: 'milestones', render: () => MF.milestones.render },
    { id: 'settings', title: 'Settings', icon: 'settings', render: () => MF.settings.render },
    { id: 'help', title: 'Help & Guide', icon: 'help', render: () => MF.help.render }
  ];
  const SIMPLE_HIDE = ['envelopes', 'reports', 'debt', 'milestones'];

  let current = 'today';

  MF.nav = { go };
  function go(id) {
    const el = document.getElementById('page');
    current = id;
    show(el);
    el.scrollIntoView && window.scrollTo({ top: 0 });
    history.replaceState(null, '', '#' + id);
    setNavOpen(false);
  }

  function show(el) {
    const page = PAGES.find(p => p.id === current) || PAGES[0];
    document.title = page.title + ' — MindFlow Budget Planner';
    if (MF.chart.dispose) MF.chart.dispose();
    el.innerHTML = '<div class="page-loading">Loading…</div>';
    try {
      page.render()(el);
    } catch (err) {
      console.error('Page render failed:', page.id, err);
      el.innerHTML = '<section class="card card-warn"><h4>Something went wrong on this page.</h4>' +
        '<p>' + eH(err && err.message ? err.message : String(err)) + '</p>' +
        '<p class="hint">Your data is safe. Re-loading usually helps.</p>' +
        '<button class="btn btn-primary" onclick="location.reload()">Reload MindFlow</button></section>';
    }
    const notice = document.getElementById('demo-spend-notice');
    const locked = MF.spendDemo.atLimit();
    notice.hidden = !locked;
    notice.textContent = locked ? MF.spendDemo.message : '';
    highlightNav();
  }
  MF.app = { rerender, start, milestones, refreshNav, reminders };

  function refreshNav() {
    // called after Appearance changes (simple mode, planner name): the sidebar is
    // built once at start(), so it must be rebuilt for those settings to apply live
    const nav = document.querySelector('.side-nav');
    if (nav) nav.innerHTML = navHtml();
    const brandName = document.querySelector('.brand-name');
    const brandSub = document.querySelector('.brand-sub');
    const s = MF.store.settings();
    if (brandName) brandName.textContent = s.plannerName || 'MindFlow';
    if (brandSub) brandSub.textContent = s.name ? 'Hi, ' + s.name + ' 👋' : 'Budget Planner';
  }

  function rerender() { show(document.getElementById('page')); }

  function milestones() { /* convenience called after actions */ MF.milestones.check(true); }

  function highlightNav() {
    document.querySelectorAll('.nav-link').forEach(a => {
      const on = a.dataset.page === current;
      a.classList.toggle('act', on);
      a.setAttribute('aria-current', on ? 'page' : 'false');
    });
  }

  function navHtml() {
    const s = MF.store.settings();
    const pages = PAGES.filter(p => !(s.mode === 'simple' && SIMPLE_HIDE.includes(p.id)));
    return pages.map(p =>
      '<a class="nav-link" href="#' + p.id + '" data-page="' + p.id + '">' + MF.icon(p.icon, 'nav-ic') +
      '<span>' + eH(p.title) + '</span></a>').join('');
  }

  function buildShell() {
    const s = MF.store.settings();
    const app = document.getElementById('app');
    app.innerHTML =
      '<button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">' + MF.icon('menu') + '</button>' +
      '<aside class="sidebar" id="sidebar">' +
      '<div class="brand"><div class="brand-mark">M</div>' +
      '<div><div class="brand-name">' + eH(s.plannerName || 'MindFlow') + '</div>' +
      '<div class="brand-sub">' + eH(s.name ? 'Hi, ' + s.name + ' 👋' : 'Budget Planner') + '</div></div></div>' +
      '<nav class="side-nav" aria-label="Main">' + navHtml() + '</nav>' +
      '<div class="side-foot">' +
      '<button class="btn btn-secondary btn-block" id="quick-fab">' + MF.icon('plus', 'sm') + ' Add expense</button>' +
      '<div class="side-note">Data stays on this device · v' + MF.version + '</div></div>' +
      '</aside>' +
      '<main class="main"><p id="demo-spend-notice" role="status" hidden></p><div id="page" tabindex="-1"></div></main>';
    /* Event delegation on the sidebar: nav links survive refreshNav() rebuilds.
       (Per-link listeners died after any navigation rebuild — dead nav bug.) */
    document.getElementById('sidebar').addEventListener('click', e => {
      const a = e.target && e.target.closest ? e.target.closest('.nav-link') : null;
      if (!a) return;
      e.preventDefault();
      go(a.dataset.page);
    });
    document.getElementById('quick-fab').addEventListener('click', () => MF.txForm.expenseModal(null, { type: 'expense' }));
    const tg = document.getElementById('nav-toggle');
    tg.addEventListener('click', () => {
      setNavOpen(!document.getElementById('sidebar').classList.contains('open'));
    });
    highlightNav();
  }

  function setNavOpen(open) {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('nav-toggle');
    if (sidebar) sidebar.classList.toggle('open', !!open);
    document.body.classList.toggle('nav-open', !!open);
    if (toggle) {
      toggle.setAttribute('aria-expanded', String(!!open));
      toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    }
  }
  document.addEventListener('click', event => {
    if (!document.body.classList.contains('nav-open')) return;
    const sidebar = document.getElementById('sidebar'), toggle = document.getElementById('nav-toggle');
    if ((sidebar && sidebar.contains(event.target)) || (toggle && toggle.contains(event.target))) return;
    if (event.target.closest && event.target.closest('.modal-overlay')) return;
    setNavOpen(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || !document.body.classList.contains('nav-open')) return;
    setNavOpen(false);
    const toggle = document.getElementById('nav-toggle');
    if (toggle) toggle.focus();
  });

  /* ---------- reminders (local, in-app per flagged category) ----------
     Every settings flag ACTUALLY controls a feature here:
       overdueBills   → overdue bills warning today
       upcomingBills  → bills due within the next 7 days
       payday         → a paycheck scheduled for today
       goalProgress   → a savings goal crossed a 25/50/75/100% step
       budgetWarnings → envelopes ≥90% spent or overspent this period
     In-app toasts are the reliable channel; browser notifications are an
     extra and only fire when the user granted permission (MindFlow cannot
     deliver reminders while it is not open — that limitation is stated in
     Settings → Notifications). Shown once per app session. */
  const shownReminders = new Set();
  function reminders() {
    const n = MF.store.settings().notifications || {};
    const today = D.today();
    const supported = 'Notification' in window;
    const canNotify = supported && Notification.permission === 'granted';
    const notify = (title, body, flag) => {
      if (!canNotify || flag === false) return;
      try { new Notification(title, { body }); } catch (e) { /* fine */ }
    };

    // overdue bills
    if (n.overdueBills !== false) {
      const overdue = MF.store.list('bills').filter(b => !b.archived && b.nextDue && b.nextDue < today && !MF.calc.isBillPaidFor(b, b.nextDue));
      if (overdue.length && !shownReminders.has('overdue')) {
        shownReminders.add('overdue');
        MF.ui.toast(overdue.length + ' bill(s) are overdue — ' + overdue[0].name + ' · ' + MF.money.fmt(overdue[0].amountCents), 'warn');
        notify('MindFlow', overdue[0].name + ' is past due.', n.overdueBills);
      }
    }

    // upcoming bills (next 7 days)
    if (n.upcomingBills !== false) {
      const soon = MF.calc.billsDueBetween(today, D.addDays(today, 7)).filter(x => x.date >= today);
      if (soon.length && !shownReminders.has('upcoming')) {
        shownReminders.add('upcoming');
        MF.ui.toast(soon.length + ' bill(s) due within 7 days — next: ' + soon[0].bill.name + ' · ' + MF.money.fmt(soon[0].remaining) + ' on ' + D.fmtRelative(soon[0].date), 'info');
        notify('MindFlow', soon[0].bill.name + ' is due ' + D.fmtRelative(soon[0].date), n.upcomingBills);
      }
    }

    // payday today (paychecks scheduled but not yet received)
    if (n.payday !== false && !shownReminders.has('payday')) {
      if (MF.calc.paydaysBetween(today, today).some(p => p.date === today)) {
        shownReminders.add('payday');
        MF.ui.toast('Payday — ' + MF.calc.paydaysBetween(today, today).map(p => MF.money.fmt(p.amountCents)).join(' + ') + ' expected today. Got paid? Record it on the Income page.', 'success');
        notify('MindFlow', 'Payday today! Record your paycheck when it lands.', n.payday);
      }
    }

    // savings goal progress steps (25/50/75/100%)
    if (n.goalProgress !== false) {
      const state = MF.store.settings().remindersState = MF.store.settings().remindersState || { goalPct: {} };
      for (const g of MF.store.list('goals').filter(g => !g.paused && g.targetCents > 0)) {
        const pct = Math.floor(100 * (g.savedCents || 0) / g.targetCents);
        const step = [100, 75, 50, 25].find(x => pct >= x) || 0;
        const last = state.goalPct[g.id] || 0;
        if (step > last) {
          state.goalPct[g.id] = step;
          MF.storage.save();
          if (!shownReminders.has('goal:' + g.id)) {
            shownReminders.add('goal:' + g.id);
            MF.ui.toast('Goal “' + g.name + '” reached ' + step + '% (' + MF.money.fmt(g.savedCents || 0) + ' of ' + MF.money.fmt(g.targetCents) + ')', 'success');
            notify('MindFlow', g.name + ' is now ' + step + '% funded.', n.goalProgress);
          }
        }
      }
    }

    // envelope budget warnings (≥90% of the period budget or overspent)
    if (n.budgetWarnings !== false && typeof MF.envelopes !== 'undefined' && MF.envelopes.status) {
      const warns = MF.store.list('envelopes')
        .filter(e => e && e.limitCents > 0)
        .map(e => Object.assign({ spent: MF.envelopes.status(e).spent }, e))
        .filter(e => e.spent > 0 && e.spent >= e.limitCents * 0.9)
        .sort((a, b) => b.spent - a.spent);
      if (warns.length && !shownReminders.has('envelopes')) {
        shownReminders.add('envelopes');
        MF.ui.toast(warns.length + ' envelope(s) at/over budget — ' + warns[0].name + ': ' + MF.money.fmt(warns[0].spent) + ' of ' + MF.money.fmt(warns[0].limitCents), 'warn');
        notify('MindFlow', warns[0].name + ' budget is nearly used up.', n.budgetWarnings);
      }
    }
  }

  function firstRunHtml() {
    return null;
  }

  function start() {
    MF.settings.applyTheme();
    buildShell();
    const el = document.getElementById('page');
    matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => MF.settings.applyTheme());
    const hash = location.hash.replace('#', '');
    current = PAGES.some(p => p.id === hash) ? hash : 'today';
    show(el);
    reminders();
    /* browser back/forward or a manually edited URL must navigate too */
    window.addEventListener('hashchange', () => {
      const id = location.hash.replace('#', '');
      if (PAGES.some(p => p.id === id) && id !== current) go(id);
    });
    window.addEventListener('resize', MF.debounce(() => {
      if (MF.chart.redraw) MF.chart.redraw();
      if (window.innerWidth > 860) setNavOpen(false);
    }, 150));
  }

  document.addEventListener('DOMContentLoaded', function boot() {
    // ensure demo data marker chip
    const s = MF.store.settings();
    if (!s.onboardingComplete) {
      start();
      setTimeout(() => MF.onboarding.start(), 450);
    } else start();
  });

  /* hash navigation for deep links */
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (PAGES.some(p => p.id === h) && h !== current) go(h);
  });
})();
</script>

</body>
</html>
