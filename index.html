  };

  /* ---------- form field builders (escaped HTML) ---------- */
  function attr(v) { return v == null ? '' : eH(String(v)); }
  MF.ui.form = {
    input(label, opts) {
      opts = opts || {};
      return '<label class="field"><span class="field-label">' + eH(label) + '</span>' +
        '<input type="' + attr(opts.type || 'text') + '" name="' + attr(opts.name) + '" value="' + attr(opts.value) + '" ' +
        (opts.required ? 'required ' : '') + (opts.min != null ? 'min="' + attr(opts.min) + '" ' : '') +
        (opts.max != null ? 'max="' + attr(opts.max) + '" ' : '') +

        (opts.maxlength ? 'maxlength="' + attr(opts.maxlength) + '"' : '') + '></label>';

      return '<label class="field"><span class="field-label">' + eH(label) + '</span><select name="' + attr(opts.name) + '">' + os + '</select></label>';
    },
    textarea(label, opts) {
      opts = opts || {};
      return '<label class="field"><span class="field-label">' + eH(label) + '</span>' +
        '<textarea name="' + attr(opts.name) + '" rows="' + attr(opts.rows || 3) + '" placeholder="' + attr(opts.placeholder || '') + '">' + eH(opts.value || '') + '</textarea></label>';
    },

      const optsL = (opts.options || MF.ui.PALETTE).map(c =>
        '<input type="radio" name="' + attr(opts.name) + '" value="' + c + '" aria-label="' + c + '"' +

  MF.ui.PALETTE = ['#2f9e6e', '#4c8fd6', '#b56cc8', '#e07a5f', '#d6473f', '#3aa6a6', '#8a79d9', '#c9973a', '#5b8a72', '#8a8f98'];

  /* progress ring */
  MF.ui.ring = function (pct, size, cls) {
    pct = MF.clamp(pct, 0, 100);
    const r = 15.9155;
    return '<svg class="ring ' + (cls || '') + '" viewBox="0 0 36 36" width="' + (size || 72) + '" height="' + (size || 72) + '">' +
      '<circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--ring-track)" stroke-width="3.6"></circle>' +
      '<circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--ring-fill)" stroke-width="3.6" stroke-dasharray="' + pct.toFixed(1) + ' ' + (100 - pct).toFixed(1) + '" stroke-dashoffset="25" stroke-linecap="round"></circle>' +
      '<text x="18" y="21.5" text-anchor="middle" font-size="8.5" fill="currentColor" class="ring-label">' + Math.round(pct) + '%</text></svg>';
  };

  /* progress bar */
  MF.ui.bar = function (pct) {
    pct = MF.clamp(pct, 0, 100);
    return '<div class="bar" role="progressbar" aria-valuenow="' + Math.round(pct) + '" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>';
  };

  /* category chip select */
  MF.ui.catSelect = function (defaultValue, name) {
    const cats = MF.store.categories();
    return '<label class="field"><span class="field-label">Category</span><select name="' + (name || 'categoryId') + '">' +
      cats.map(c => '<option value="' + eH(c.id) + '"' + (c.id === defaultValue ? ' selected' : '') + '>' + eH(c.name) + '</option>').join('') +
      '</select></label>';
  };
  MF.ui.catChip = function (catId) {
    const c = MF.store.category(catId);
    return '<span class="chip" style="--chip:' + eH(c.color) + '">' + eH(c.name) + '</span>';
  };
})();
</script>
<script>/* ============================================================
   MindFlow — lightweight dependency-free chart renderer
   Canvas, DPR-aware: bar (grouped), line, donut, stacked-bar
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const CSS = getComputedStyle(document.documentElement);
  function col(n, fallback) { return (CSS.getPropertyValue(n) || fallback || '').trim() || fallback; }

  const chartRecords = new Map();
  function chartWidth(canvas, width) {
    const parent = canvas.parentElement;
    const style = parent ? getComputedStyle(parent) : null;
    const padding = style ? (parseFloat(style.getPropertyValue('padding-left')) || 0) + (parseFloat(style.getPropertyValue('padding-right')) || 0) : 0;
    return width || Math.max(0, (parent ? parent.clientWidth : 0) - padding) || canvas.clientWidth || 320;
  }
  function prep(canvas, width) {
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const w = chartWidth(canvas, width);
    const h = canvas.dataset.h ? +canvas.dataset.h : 180;
    canvas.style.width = width ? width + 'px' : '100%';
    canvas.style.maxWidth = '100%';
    if (canvas.parentElement) canvas.parentElement.style.minWidth = '0';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    return { ctx, w, h };
  }

  function chart(canvas, spec) {
    if (!canvas) return;
    pruneCharts();
    let record = chartRecords.get(canvas);
    if (!record) {
      record = { spec, width: 0, dpr: 0, observer: null };
      chartRecords.set(canvas, record);
      if (window.ResizeObserver && canvas.parentElement) {
        record.observer = new ResizeObserver(queueChartRedraw);
        record.observer.observe(canvas.parentElement);
      }
    }
    record.spec = spec;
    const { ctx, w, h } = prep(canvas, spec.width);
    record.width = w; record.dpr = Math.min(2.5, window.devicePixelRatio || 1);
    ctx.font = '11px system-ui, sans-serif';
    if (spec.kind === 'bar') bar(ctx, w, h, spec);
    else if (spec.kind === 'line') line(ctx, w, h, spec);
    else if (spec.kind === 'donut') donut(ctx, w, h, spec);
  }

  function pruneCharts() {
    for (const [canvas, record] of chartRecords) {
      if (canvas.isConnected) continue;
      if (record.observer) record.observer.disconnect();
      chartRecords.delete(canvas);
    }
  }
  function redrawCharts() {
    pruneCharts();
    for (const [canvas, record] of chartRecords) {
      if (record.width !== chartWidth(canvas, record.spec.width) || record.dpr !== Math.min(2.5, window.devicePixelRatio || 1)) chart(canvas, record.spec);
    }
  }
  const queueChartRedraw = MF.debounce(redrawCharts, 100);
  chart.redraw = redrawCharts;
  chart.dispose = function () {
    for (const record of chartRecords.values()) if (record.observer) record.observer.disconnect();
    chartRecords.clear();
  };

  function niceMax(v) {
    if (v <= 0) return 100;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * exp;
  }
  function axes(ctx, w, h, spec, maxV) {
    const padL = spec.padL || 44, padB = 22, padT = 8;
    ctx.strokeStyle = col('--chart-grid', '#e5e7ea');
    ctx.fillStyle = col('--chart-label', '#6b7280');
    ctx.lineWidth = 1;
    const gridN = 4;
    for (let i = 0; i <= gridN; i++) {
      const y = padT + (h - padT - padB) * (1 - i / gridN);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - 4, y); ctx.stroke();
      const val = maxV * i / gridN;
      ctx.textAlign = 'right';
      ctx.fillText(fmt(val), padL - 6, y + 4);
    }
    return { padL, padB, padT, plotW: w - padL - 6, plotH: h - padT - padB };
  }
  function fmt(v) { return v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : Math.round(v).toString(); }

  function bar(ctx, w, h, spec) {
    const labels = spec.labels || [], series = spec.series || [];
    const maxV = niceMax(Math.max(...series.flatMap(s => s.data || [0])));
    const ax = axes(ctx, w, h, spec, maxV);
    const n = labels.length || 1;
    const groupW = ax.plotW / n;
    const bw = Math.max(2, Math.min(22, groupW * 0.72 / series.length));
    const colors = series.map((s, i) => s.color || col('--chart-1', '#4c8fd6'));
    labels.forEach((l, i) => {
      const gx = ax.padL + groupW * i + (groupW - bw * series.length) / 2;
      series.forEach((s, si) => {
        const v = Math.max(0, s.data[i] || 0);
        const bh = ax.plotH * (v / maxV);
        const x = gx + si * bw;
        const y = ax.padT + ax.plotH - bh;
        const c = colors[si];
        ctx.fillStyle = c + '55';
        ctx.fillRect(x, y, bw, bh);
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.roundRect(x, y, bw, bh, Math.min(4, bw / 2, bh));
        ctx.fill();
      });
      ctx.fillStyle = col('--chart-label', '#6b7280');
      ctx.textAlign = 'center';
      if (n <= 14 || i % Math.ceil(n / 10) === 0) ctx.fillText(l, ax.padL + groupW * i + groupW / 2, h - 6);
    });
    legend(ctx, w, series);
  }

  function line(ctx, w, h, spec) {
    const labels = spec.labels || [], series = spec.series || [];
    const all = series.flatMap(s => s.data || [0]).concat([0]);
    const maxV = niceMax(Math.max(...all, 1));
    const minV = Math.min(0, ...all);
    const ax = axes(ctx, w, h, spec, maxV);
    const range = maxV - 0;
    const pts = labels.map((l, i) => [ax.padL + ax.plotW * (labels.length === 1 ? 0.5 : i / (labels.length - 1)),
      ax.padT + ax.plotH * (1 - (Math.max(0, series[0] && series[0].data[i]) - minV) / range)]);
    series.forEach((s, si) => {
      ctx.beginPath();
      (s.data || []).forEach((v, i) => {
        const x = ax.padL + ax.plotW * (series.length && labels.length === 1 ? 0.5 : i / Math.max(1, labels.length - 1));
        const y = ax.padT + ax.plotH * (1 - Math.max(0, v) / maxV);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      if (s.fill) {
        ctx.save();
        ctx.lineTo(ax.padL + ax.plotW, ax.padT + ax.plotH);
        ctx.lineTo(ax.padL, ax.padT + ax.plotH);
        ctx.closePath();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = s.color || col('--chart-1', '#4c8fd6');
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        (s.data || []).forEach((v, i) => {
          const x = ax.padL + ax.plotW * (i / Math.max(1, labels.length - 1));
          const y = ax.padT + ax.plotH * (1 - Math.max(0, v) / maxV);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
      }
      ctx.strokeStyle = s.color || col('--chart-1', '#4c8fd6');
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    });
    ctx.fillStyle = col('--chart-label', '#6b7280');
    ctx.textAlign = 'center';
    labels.forEach((l, i) => {
      if (labels.length <= 10 || i % Math.ceil(labels.length / 10) === 0) {
        ctx.fillText(l, ax.padL + ax.plotW * (i / Math.max(1, labels.length - 1)), h - 6);
      }
    });
    legend(ctx, w, series);
  }

  function legend(ctx, w, series) {
    if (!spec_has_legend(w, series)) return;
    ctx.textAlign = 'left';
    let x = 46, y = 12;
    series.forEach((s, i) => {
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.roundRect(x, y - 7, 10, 10, 3); ctx.fill();
      ctx.fillStyle = col('--chart-label', '#6b7280');
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(s.label || '', x + 14, y + 2);
      x += 14 + 20 + ctx.measureText(s.label || '').width;
    });
    ctx.font = '11px system-ui, sans-serif';
  }
  function spec_has_legend() { return true; }

  function donut(ctx, w, h, spec) {
    const items = (spec.items || []).filter(i => i.value > 0);
    const total = items.reduce((s, i) => s + i.value, 0);
    if (!total) { empty(ctx, w, h); return; }
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 10, rr = r * 0.58;
    let a = -Math.PI / 2;
    const cur = window.MF.store ? MF.store.settings().currency : 'USD';
    items.forEach(i => {
      const a2 = a + Math.PI * 2 * i.value / total;
      ctx.beginPath();
      ctx.arc(cx, cy, r, a + 0.004, a2 - 0.004);
      ctx.arc(cx, cy, rr, a2 - 0.004, a + 0.004, true);
      ctx.closePath();
      ctx.fillStyle = i.color;
      ctx.fill();
      a = a2;
    });
    // center label
    ctx.fillStyle = col('--text', '#111');
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(spec.center || '', cx, cy + 2);
    ctx.font = '10.5px system-ui, sans-serif';
    ctx.fillStyle = col('--muted', '#777');
    ctx.fillText(spec.centerSub || '', cx, cy + 18);
  }
  function empty(ctx, w, h) {
    ctx.fillStyle = '#e5e7ea';
    ctx.beginPath(); ctx.arc(w / 2, h / 2, Math.min(w, h) / 2 - 10, 0, Math.PI * 2); ctx.fill();
  }

  MF.chart = chart;
})();
</script>
<script>/* ============================================================
   MindFlow — transactions: CRUD, quick parsing, splits, refunds
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml;

  function create(data) {
    const list = MF.store.list('transactions');
    const t = Object.assign({
      id: MF.uid('txn'), type: 'expense', date: MF.dates.today(),
      amountCents: 0, description: '', categoryId: 'cat_other',
      accountId: null, toAccountId: null, notes: '', tags: [],
      refundable: false, refundId: null, billId: null, goalId: null, debtId: null,
      split: null, createdAt: new Date().toISOString()
    }, data);
    if (!MF.dates.parse(t.date)) throw new Error('Choose a valid transaction date');
    if (t.amountCents < 0) t.amountCents = Math.abs(t.amountCents);
    if (t.type === 'expense') MF.spendDemo.useSlot();
    list.push(t);
    MF.storage.save();
    MF.emit('txn:created', t);
    return t;
  }
  function find(id) { return MF.store.list('transactions').find(t => t.id === id) || null; }
  function update(id, patch) {
    const t = find(id); if (!t) return null;
    if (Object.prototype.hasOwnProperty.call(patch, 'date') && !MF.dates.parse(patch.date)) throw new Error('Choose a valid transaction date');
    if (t.type === 'transfer') {
      if (patch.type !== undefined && patch.type !== 'transfer') throw new Error('A transfer must stay a transfer');
      const from = patch.accountId !== undefined ? patch.accountId : t.accountId;
      const to = patch.toAccountId !== undefined ? patch.toAccountId : t.toAccountId;
      if (from && from === to) throw new Error('Choose two different accounts for a transfer');
    }
    if (t.goalId) {
      const g = MF.store.find('goals', t.goalId);
      const amount = Object.prototype.hasOwnProperty.call(patch, 'amountCents') ? patch.amountCents : t.amountCents;
      if (g) {
        const withdraw = t.goalWithdraw || t.toAccountId !== 'goal:' + t.goalId;
        const nextSaved = (g.savedCents || 0) + (withdraw ? t.amountCents - amount : amount - t.amountCents);
        if (!Number.isSafeInteger(amount) || amount <= 0 || nextSaved < 0) {
          throw new Error('This edit would withdraw more than the money available in this goal. Reduce the amount first.');
        }
      }
    }
    const prev = { amountCents: t.amountCents, date: t.date, type: t.type, billId: t.billId, debtId: t.debtId, goalId: t.goalId, dueDate: t.dueDate, goalWithdraw: t.goalWithdraw };
    if (t.type !== 'expense' && patch.type === 'expense') MF.spendDemo.useSlot();
    Object.assign(t, patch);
    syncLinkedEdit(t, prev);
    if (t.refId) syncRefundTotal(find(t.refId));
    MF.storage.save();
    MF.emit('txn:updated', t);
    return t;
  }
  function remove(id, silent) {
    const t = find(id); if (!t) return false;
    if (t.goalId) {
      const g = MF.store.find('goals', t.goalId);
      const withdraw = t.goalWithdraw || t.toAccountId !== 'goal:' + t.goalId;
      if (g && !withdraw && t.amountCents > (g.savedCents || 0)) {
        throw new Error('This contribution has already been partly withdrawn. Undo the withdrawal or return the money to this goal before deleting it.');
      }
    }
    // linked refund: unlink partner too so no double counting survives deletion
    if (t.refundId) {
      const r = find(t.refundId);
      if (r) { r.refundId = null; }
    }
    // linked bill payment: the bill must go back to unpaid for that due date
    if (t.billId && t.dueDate) {
      const b = MF.store.find('bills', t.billId);
      MF.calc.releaseBillPayment(b, t.dueDate);
    }
    // linked debt payment: reverse the principal/interest split
    if (t.debtId) {
      const d = MF.store.find('debts', t.debtId);
      MF.calc.debt.releaseDebtPayment(d, t.dueDate || null, t.id);
    }
    // linked goal transfer: put the money back into the goal
    if (t.goalId) {
      const g = MF.store.find('goals', t.goalId);
      if (g) {
        const isWithdraw = t.toAccountId !== 'goal:' + t.goalId;
        const delta = isWithdraw ? t.amountCents : -t.amountCents;
        g.savedCents = Math.max(0, (g.savedCents || 0) + delta);
        g.history = (g.history || []).filter(h => h.transactionId !== t.id);
        if (g.targetCents > 0 && g.savedCents >= g.targetCents) {
          g.completed = true;
          if (!g.completedDate) g.completedDate = MF.dates.today();
        } else if (g.completed) { g.completed = false; delete g.completedDate; }
      }
    }
    const list = MF.store.list('transactions');
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) list.splice(i, 1);
    if (t.refId) syncRefundTotal(find(t.refId));
    MF.storage.save();
    if (!silent) MF.ui.toast('Transaction deleted', 'info');
    return true;
  }
  /* after an edit of a payment transaction, mirror the change on the linked
     bill / debt / goal record so paidHistory and balances stay truthful;
     prev = the fields as they were before the edit */
  function syncLinkedEdit(t, prev) {
    if (!t) return;
    if (t.debtId) {
      const d = MF.store.find('debts', t.debtId);
      if (!d) return;
      const h = (d.paidHistory || []).find(h => h.transactionId === t.id) || (prev.dueDate && (d.paidHistory || []).find(h => h.dueDate === prev.dueDate));
      if (!h) return;
      const dAmt = (t.amountCents || 0) - (prev.amountCents || 0);
      // the interest portion was already accrued and stands; the amount change
      // moves the principal portion of the payment
      const newPrincipal = Math.max(0, (h.principalCents || 0) + dAmt);
      const delta = newPrincipal - (h.principalCents || 0);
      h.amountCents = t.amountCents;
      h.principalCents = newPrincipal;
      h.paidDate = t.date;
      h.dueDate = t.dueDate || h.dueDate;
      d.balanceCents = Math.max(0, (d.balanceCents || 0) - delta);
      if (d.paidOff && (d.balanceCents || 0) <= 0) return;
      if (d.balanceCents <= 0) { d.paidOff = true; d.paidOffDate = t.date; }
      else if (d.paidOff && d.balanceCents > 0) delete d.paidOff;
    } else if (t.billId && t.dueDate) {
      const b = MF.store.find('bills', t.billId);
      if (!b) return;
      const h = (b.paidHistory || []).find(h => h.transactionId === t.id) || (b.paidHistory || []).find(h => h.dueDate === (prev.dueDate || t.dueDate));
      if (!h) return;
      h.amountCents = t.amountCents;
      h.paidDate = t.date;
      if (prev.dueDate && prev.dueDate !== t.dueDate) { h.dueDate = t.dueDate; }
      /* Reserve consistency for an edited payment (Issue C): the consumption
         log entry for this dueDate must always reflect what this payment
         actually used of the earmark = min(reserve pool incl. itself, bill
         amount, payment amount). Lower edit → the untouched part goes back to
         the reserve; higher edit → the earmark consumed is capped at the
         pool (extra money verifiably leaves the paying account — no money is
         created); date/account change → the log entry follows the new date so
         a later release finds it. Deterministic and repeatable. */
      const lv = (b.reserveLog || []).find(e => e.action === 'used by payment' && e.dueDate === (prev.dueDate || t.dueDate));
      if (lv) {
        const oldUsed = Math.max(0, lv.amountCents || 0);
        const pool = Math.max(0, (b.reservedCents || 0) + oldUsed); // this payment's consumption is still available
        const newUsed = Math.max(0, Math.min(pool, b.amountCents || 0, t.amountCents || 0));
        b.reservedCents = Math.max(0, Math.min((b.reservedCents || 0) + oldUsed - newUsed, Math.max(0, b.amountCents || 0)));
        lv.amountCents = newUsed;
        lv.dueDate = t.dueDate;
        if (t.date) lv.date = t.date;
      }
    } else if (t.goalId) {
      const g = MF.store.find('goals', t.goalId);
      if (!g) return;
      const isWithdraw = prev.goalWithdraw || t.toAccountId !== 'goal:' + t.goalId;
      const oldDelta = isWithdraw ? -(prev.amountCents || 0) : (prev.amountCents || 0);
      const newDelta = isWithdraw ? -(t.amountCents || 0) : (t.amountCents || 0);
      g.savedCents = Math.max(0, (g.savedCents || 0) - oldDelta + newDelta);
      g.history = (g.history || []).map(h => h.transactionId === t.id ? Object.assign(h, { amountCents: t.amountCents, date: t.date }) : h);
      if (g.completed && g.savedCents < (g.targetCents || 0)) { g.completed = false; delete g.completedDate; }
      else if (!g.completed && g.savedCents >= (g.targetCents || 0) && g.targetCents) {
        g.completed = true; g.completedDate = t.date;
      }
    }
  }
  function duplicate(id) {
    const t = find(id);
    if (!t) return null;
    // A copy is independent; it must not share payment/refund bookkeeping.
    const copy = JSON.parse(JSON.stringify(t));
    for (const key of ['id', 'billId', 'debtId', 'goalId', 'dueDate', 'incomeSourceId', 'refundId', 'refId', 'refundedCents', 'goalWithdraw']) delete copy[key];
    copy.date = MF.dates.today(); copy.createdAt = new Date().toISOString();
    return create(copy);
  }
  function deleteConfirm(id) {
    const t = find(id);
    if (!t) return;
    MF.ui.confirm('Delete transaction?', 'This will permanently remove “' + (t.description || 'this transaction') + '” (' + MF.money.fmt(t.amountCents) + ').', true, 'Delete')
      .then(ok => {
        if (!ok) return;
        try { remove(id); MF.app.rerender(); }
        catch (err) { MF.ui.toast(err.message, 'error'); }
      });
  }

  /* ---------- quick parse: "250 groceries" ---------- */
  function parseQuick(text) {
    const s = (text || '').trim();
    if (!s) return null;
    const m = /^-?\$?\s*\d+(?:[.,]\d{1,2})?(?:\s*$|\s+.*)$/.exec(s);
    if (!m) return null;
    const parts = s.split(/\s+/);
    const amountMatch = /^\$?(\d+(?:[.,]\d{1,2})?)$/.exec(parts[0]);
    if (!amountMatch) return null;
    const amountCents = MF.money.parse(parts[0]);
    const desc = parts.slice(1).join(' ');
    if (!desc) return { amountCents, description: '', categoryId: null, confidence: 'amount-only' };
    // match against category names
    const cats = MF.store.categories();
    const low = desc.toLowerCase();
    let best = null, exact = null;
    for (const c of cats) {
      const n = c.name.toLowerCase();
      if (n === low) { exact = c; break; }
      if (!best && (n.startsWith(low) || low.startsWith(n.replace(/\s/g, ''))) && low.length >= 3) best = c;
    }
    const cat = exact || best;
    return { amountCents, description: desc, categoryId: cat ? cat.id : null, categoryName: cat ? cat.name : null };
  }

  /* ---------- refunds ---------- */
  function syncRefundTotal(original) {
    if (!original) return;
    const refunds = MF.store.list('transactions').filter(t => t.refId === original.id && t.type === 'income');
    original.refundedCents = MF.sum(refunds.map(t => t.amountCents));
    original.refundId = refunds.length ? refunds[refunds.length - 1].id : null;
    original.refundable = original.refundedCents < original.amountCents;
  }
  function recordRefund(originalTxn, amountCents, date, accountId) {
    const amt = amountCents || originalTxn.amountCents;
    const refund = create({
      type: 'income', amountCents: amt, date: date || MF.dates.today(),
      description: 'Refund — ' + (originalTxn.description || 'purchase'),
      categoryId: originalTxn.categoryId, accountId: accountId || originalTxn.accountId,
      refId: originalTxn.id, tags: ['refund']
    });
    originalTxn.refundId = refund.id;
    originalTxn.refundedCents = (originalTxn.refundedCents || 0) + amt;
    if (originalTxn.refundedCents >= originalTxn.amountCents) originalTxn.refundable = false;
    MF.storage.save();
    return refund;
  }

  /* ---------- list/filter/sort ---------- */
  function filterTxns(opts) {
    opts = opts || {};
    let list = MF.store.list('transactions').slice();
    if (opts.q) {
      const q = opts.q.toLowerCase();
      list = list.filter(t => (t.description || '').toLowerCase().includes(q) ||
        (t.notes || '').toLowerCase().includes(q) ||
        (t.tags || []).some(x => x.toLowerCase().includes(q)) ||
        String(t.amountCents / 100).includes(q));
    }
    if (opts.type && opts.type !== 'all') list = list.filter(t => t.type === opts.type);
    if (opts.categoryId && opts.categoryId !== 'all') list = list.filter(t => MF.calc.categoryParts(t).some(p => p.categoryId === opts.categoryId));
    if (opts.accountId && opts.accountId !== 'all') list = list.filter(t => t.accountId === opts.accountId || t.toAccountId === opts.accountId);
    if (opts.from) list = list.filter(t => t.date >= opts.from);
    if (opts.to) list = list.filter(t => t.date <= opts.to);
    const dir = opts.dir === 'asc' ? 1 : -1;
    if (opts.sort === 'amount') list.sort((a, b) => (a.amountCents - b.amountCents) * dir);
    else list.sort((a, b) => (a.date === b.date ? (a.createdAt || '').localeCompare(b.createdAt || '') : a.date < b.date ? -1 : 1) * dir);
    return list;
  }

  function txnRow(t, mini) {
    const cat = MF.store.category(t.categoryId);
    const a = MF.store.account(t.accountId);
    const isTransfer = t.type === 'transfer';
    const toA = t.toAccountId ? MF.store.account(t.toAccountId) : null;
    const sign = t.type === 'income' ? '+' : '−';
    const icon = t.type === 'income' ? 'income' : isTransfer ? 'transactions' : cat.system ? chipIcon(cat) : chipIcon(cat);
    return '<div class="txn-row" data-id="' + eH(t.id) + '" tabindex="0" role="button" aria-label="Open transaction">' +
      '<div class="txn-dot" style="background:' + eH(cat.color) + '">' + (t.type === 'income' ? MF.icon('income') : isTransfer ? MF.icon('transactions') : '') + '</div>' +
      '<div class="txn-main"><div class="txn-desc">' + eH(t.description || (isTransfer ? 'Transfer' : 'Expense')) +
      (t.date > MF.dates.today() ? ' <span class="pill pill-warn">future</span>' : '') +
      (t.split ? ' <span class="pill">split</span>' : '') +
      (t.refundId ? ' <span class="pill pill-pos">refunded</span>' : '') +
      (t.refundable && !t.refundId ? ' <span class="pill">refundable</span>' : '') + '</div>' +
      '<div class="txn-sub">' + eH(MF.dates.fmtRelative(t.date)) + (isTransfer && toA ? ' · ' + eH(a ? a.name : '?') + ' → ' + eH(toA.name) :
        (cat ? ' · ' + eH(cat.name) : '') + (a ? ' · ' + eH(a.name) : '')) + '</div></div>' +
      '<div class="txn-amount ' + (t.type === 'income' ? 'pos' : isTransfer ? 'mute' : '') + '">' +
      (isTransfer ? MF.icon('transactions', 'sm') : '') + sign + eH(MF.money.fmt(t.amountCents)) + '</div></div>';
  }
  function chipIcon(cat) { return '<span class="chip" style="--chip:' + cat.color + '">' + eH(cat.name) + '</span>'; }

  function toCSV(list) {
    const head = ['Date', 'Type', 'Description', 'Category', 'Account', 'To Account', 'Amount', 'Notes', 'Tags'].join(',');
    const rows = list.map(t => [
      t.date, t.type, cleanCsv(t.description), cleanCsv(MF.store.category(t.categoryId).name),
      cleanCsv((MF.store.account(t.accountId) || {}).name || ''), cleanCsv((MF.store.account(t.toAccountId) || {}).name || ''),
      (t.amountCents / 100).toFixed(2), cleanCsv(t.notes || ''), cleanCsv((t.tags || []).join('; '))
    ].join(','));
    return head + '\n' + rows.join('\n');
  }
  function cleanCsv(v) {
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  MF.tx = { create, find, update, remove, duplicate, deleteConfirm, parseQuick, recordRefund, filterTxns, txnRow, toCSV };
})();
</script>
<script>/* ============================================================
   MindFlow — accounts: CRUD, archive, transfer, balance views
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt;

  function create(data) {
    const a = Object.assign({
      id: MF.uid('acc'), name: 'New Account', type: 'checking',
      startingCents: 0, color: '#4c8fd6', notes: '', archived: false
    }, data);
    MF.store.list('accounts').push(a);
    MF.storage.save();
    MF.app.milestones();
    return a;
  }
  function activeAccounts() { return MF.store.accounts(true); }
  function accountCard(a, opts) {
    opts = opts || {};
    const bal = MF.calc.accountBalance(a.id);
    const owes = a.type === 'credit' && bal < 0;
    return '<div class="acct-card" style="--acct:' + eH(a.color) + '" tabindex="0" role="button" data-account="' + eH(a.id) + '">' +
      '<div class="acct-name">' + eH(a.name) + '</div>' +
      '<div class="acct-type">' + eH(typeName(a.type)) + '</div>' +
      '<div class="acct-bal ' + (bal < 0 ? 'neg' : '') + '">' + eH(fmt(bal)) + '</div>' +
      (owes ? '<div class="acct-warn">' + eH(fmt(Math.abs(bal))) + ' owed</div>' : '') +
      '</div>';
  }
  function typeName(t) {
    return { checking: 'Checking', savings: 'Savings', cash: 'Cash', credit: 'Credit Card', other: 'Other' }[t] || t;
  }

  function formModal(existing, onDone) {
    const f = MF.ui.form;
    const body = f.input('Account name', { name: 'name', value: existing ? existing.name : '', required: true, maxlength: 40 }) +
      f.select('Account type', { name: 'type', value: existing ? existing.type : 'checking', options: [
        ['checking', 'Checking'], ['savings', 'Savings'], ['cash', 'Cash'], ['credit', 'Credit Card'], ['other', 'Other']] }) +
      f.input('Starting balance', { name: 'starting', type: 'number', step: '0.01', value: existing ? (existing.startingCents / 100).toFixed(2) : '0' }) +
      f.color('Account color', { name: 'color', value: existing ? existing.color : '#4c8fd6' }) +
      f.textarea('Notes (optional)', { name: 'notes', value: existing ? existing.notes : '', placeholder: 'Anything you want to remember about this account.' }) +
      (existing ? '<p class="hint">Current balance is ' + fmt(MF.calc.accountBalance(existing.id)) + ' — it updates from your transactions automatically.</p>' : '');
    const m = MF.ui.modal({
      title: existing ? 'Edit account' : 'Add account', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Add account') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const startCents = MF.money.parse(d.starting); if (startCents == null) throw new Error('Enter a valid starting balance');
        if (!d.name) throw new Error('Please enter an account name');
        const data = { name: d.name, type: d.type, startingCents: startCents, color: d.__color, notes: d.notes };
        if (existing) Object.assign(existing, data);
        else {
          const a = create(data);
          if (!MF.store.settings().defaultAccountId) MF.store.setSetting('defaultAccountId', a.id);
        }
        MF.storage.save();
        MF.ui.closeModal();
        MF.ui.toast(existing ? 'Account updated' : 'Account added', 'success');
        if (onDone) onDone(); else MF.app.rerender();
      }
    });
    return m;
  }

  function archive(a) {
    MF.ui.confirm('Archive “' + a.name + '”?', 'The account and its history are kept, but it disappears from new forms. You can restore it later.', true, 'Archive')
      .then(ok => { if (ok) { a.archived = true; MF.storage.save(); MF.app.rerender(); } });
  }
  function restore(a) { a.archived = false; MF.storage.save(); MF.app.rerender(); }

  function transferModal(opts) {
    opts = opts || {};
    const accs = activeAccounts();
    if (accs.length < 2) { MF.ui.toast('Add at least two accounts to make a transfer.', 'warn'); return; }
    const f = MF.ui.form;
    const body = f.select('From', { name: 'from', options: accs.map(a => [a.id, a.name]) }) +
      f.select('To', { name: 'to', options: accs.map(a => [a.id, a.name], ) }) +
      f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true }) +
      f.input('Date', { name: 'date', type: 'date', value: MF.dates.today(), required: true }) +
      f.input('Note (optional)', { name: 'notes', maxlength: 80, placeholder: 'e.g. moving cash to savings' }) +
      '<p class="hint">Transfers move money between accounts. They never appear as income or expenses in reports.</p>';
    const m = MF.ui.modal({
      title: 'Transfer money', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Transfer</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        if (d.from === d.to) throw new Error('Choose two different accounts');
        const amount = MF.money.parse(d.amount);
        if (!amount || amount <= 0) throw new Error('Enter an amount greater than zero');
        MF.tx.create({
          type: 'transfer', amountCents: amount, date: d.date || MF.dates.today(),
          description: d.notes || 'Transfer', accountId: d.from, toAccountId: d.to
        });
        MF.ui.closeModal(); MF.ui.toast('Transfer saved', 'success'); MF.app.rerender();
      }
    });
    if (opts.preTo) m.querySelector('[name="to"]').value = opts.preTo;
    return m;
  }

  function accountView(id, el) {
    const a = MF.store.account(id);
    if (!a) { el.innerHTML = '<p class="empty">Account not found.</p>'; return; }
    const bal = MF.calc.accountBalance(a.id);
    const txns = MF.tx.filterTxns({ accountId: id, sort: 'date', dir: 'desc' });
    el.innerHTML =
      '<header class="page-head"><div><h2>Account — ' + eH(a.name) + '</h2>' +
      '<p class="page-sub">' + eH(typeName(a.type)) + ' · Balance <strong>' + eH(fmt(bal)) + '</strong></p></div>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-act="edit">' + MF.icon('edit', 'sm') + ' Edit</button>' +
      '<button class="btn btn-ghost" data-act="transfer">' + MF.icon('transactions', 'sm') + ' Transfer</button>' +
      '<button class="btn btn-ghost" data-act="archive">Archive</button></div></header>' +
      '<section class="card"><h4>Transactions on this account (' + txns.length + ')</h4>' +
      (txns.length ? txns.map(t => MF.tx.txnRow(t)).join('') : '<p class="empty">No transactions yet on this account.</p>') +
      '</section>';
    el.querySelector('[data-act="edit"]').addEventListener('click', () => formModal(a));
    el.querySelector('[data-act="transfer"]').addEventListener('click', () => transferModal({ preTo: a.id }));
    el.querySelector('[data-act="archive"]').addEventListener('click', () => archive(a));
  }

  /* standalone "Accounts" management panel (embedded in Settings > Accounts) */
  function render(el) {
    const accs = MF.store.accounts(true), arch = MF.store.accounts(false).filter(a => a.archived);
    el.innerHTML =
      '<header class="page-head"><div><h2>Accounts</h2><p class="page-sub">Track where your money lives. Credit cards count as money you owe.</p></div>' +
      '<div class="btn-row">' +
      '<button class="btn btn-secondary" data-act="transfer">' + MF.icon('transactions', 'sm') + ' Transfer</button>' +
      '<button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' Add account</button></div></header>' +
      '<div class="grid grids-3">' + accs.map(a => accountCard(a)).join('') + '</div>' +
      (arch.length ? '<h3 class="sect">Archived accounts</h3><div class="list">' +
        arch.map(a => '<div class="row"><span>' + eH(a.name) + ' (' + fmt(MF.calc.accountBalance(a.id)) + ')</span>' +
          '<button class="btn btn-ghost btn-sm" data-restore="' + a.id + '">Restore</button></div>').join('') + '</div>' : '') +
      '<div id="acct-detail"></div>';
    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    el.querySelector('[data-act="transfer"]').addEventListener('click', () => transferModal());
    el.querySelectorAll('.acct-card').forEach(c => c.addEventListener('click', () => accountView(c.dataset.account, el.querySelector('#acct-detail'))));
    el.querySelectorAll('.acct-card').forEach(c => c.addEventListener('keydown', e => { if (e.key === 'Enter') accountView(c.dataset.account, el.querySelector('#acct-detail')); }));
    el.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => restore(MF.store.account(b.dataset.restore))));
  }

  MF.accounts = { create, formModal, transferModal, archive, accountView, render, typeName, accountCard, activeAccounts };
})();
</script>
<script>/* ============================================================
   MindFlow — bills: recurring/one-time, set-aside, pay/unpay
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  const FREQ = [
    ['once', 'One-time'], ['weekly', 'Weekly'], ['biweekly', 'Every two weeks'],
    ['every4weeks', 'Every four weeks'], ['monthly', 'Monthly'], ['twicemonthly', 'Twice monthly'],
    ['bimonthly', 'Every two months'], ['quarterly', 'Quarterly'], ['semiannual', 'Every six months'],
    ['yearly', 'Yearly'], ['custom', 'Custom interval']
  ];

  function statusOf(b) {
    const nd = b.nextDue;
    if (!nd) return { cls: 'mute', label: 'No schedule' };
    const d = D.daysBetween(D.today(), nd);
    if (d < 0) return { cls: 'neg', label: 'Overdue · ' + Math.abs(d) + 'd' };
    if (d === 0) return { cls: 'warn', label: 'Due today' };
    if (d <= 7) return { cls: 'warn', label: 'Due ' + D.fmtRelative(nd).toLowerCase() };
    return { cls: 'pos', label: 'Due ' + D.fmtRelative(nd) };
  }

  function billRow(b) {
    const st = statusOf(b);
    const cat = MF.store.category(b.categoryId);
    const resv = b.autoSetAside ? Math.min(b.reservedCents || 0, b.amountCents) : 0;
    return '<div class="row bill-row" data-id="' + eH(b.id) + '">' +
      '<div class="row-main"><span class="dot" style="background:' + eH(cat.color) + '"></span>' +
      '<div><div class="row-title">' + eH(b.name) + '</div><div class="row-sub">' +
      freqLabel(b) + ' · ' + eH(D.fmtHuman(b.nextDue)) +
      (resv ? ' · saved ' + eH(fmt(resv)) : '') + '</div></div></div>' +
      '<div class="row-side"><strong>' + eH(fmt(b.amountCents)) + '</strong>' +
      '<span class="pill pill-' + st.cls + '">' + eH(st.label) + '</span></div>' +
      '<div class="row-actions">' +
      '<button class="btn btn-primary btn-sm" data-pay="' + eH(b.id) + '">Pay</button>' +
      '<button class="icon-btn" data-edit="' + eH(b.id) + '" aria-label="Edit">' + MF.icon('edit') + '</button>' +
      '<button class="icon-btn" data-del="' + eH(b.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button>' +
      '</div></div>';
  }
  function freqLabel(b) {
    if (b.frequency === 'custom') return 'every ' + (b.customIntervalDays || 30) + ' days';
    return (FREQ.find(x => x[0] === (b.frequency || 'monthly')) || [, 'Monthly'])[1];
  }

  function formModal(existing, opts) {
    opts = opts || {};
    const f = MF.ui.form;
    const isOnce = existing ? existing.frequency === 'once' : !!opts.once;
    const accs = MF.accounts.activeAccounts();
    const body =
      f.input('Bill name', { name: 'name', value: existing ? existing.name : '', required: true, maxlength: 60, placeholder: 'e.g. Electricity' }) +
      f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true, value: existing ? (existing.amountCents / 100).toFixed(2) : '' }) +
      '<div class="form-2col">' +
      MF.ui.catSelect(existing ? existing.categoryId : 'cat_utilities') +
      f.select('Frequency', { name: 'frequency', value: existing ? existing.frequency : (isOnce ? 'once' : 'monthly'), options: FREQ }) + '</div>' +
      '<div class="form-2col">' +
      f.input('Next due date', { name: 'nextDue', type: 'date', required: true, value: existing ? existing.nextDue : (opts.date || MF.dates.today()) }) +
      f.select('Pay from', { name: 'accountId', value: existing ? existing.accountId : '', options: [['', 'Choose…']].concat(accs.map(a => [a.id, a.name])) }) + '</div>' +
      '<div id="bill-twice" class="form-2col">' +
      f.input('1st day of month', { name: 'day1', type: 'number', min: 1, max: 28, value: existing ? (existing.paymentDay1 || 1) : 1 }) +
      f.input('2nd day of month', { name: 'day2', type: 'number', min: 2, max: 28, value: existing ? (existing.paymentDay2 || 15) : 15 }) + '</div>' +
      '<div id="bill-custom">' + f.input('Repeat every (days)', { name: 'customIntervalDays', type: 'number', min: 1, value: existing ? (existing.customIntervalDays || 30) : 30 }) + '</div>' +
      f.toggle('Save up for this bill gradually (set-aside)', { name: 'autoSetAside', checked: existing ? !!existing.autoSetAside : false }) +
      '<div id="setaside-note" class="hint">Money can be moved into this bill’s reserve with the “Set aside” button on the Bills page.</div>' +
      f.textarea('Notes (optional)', { name: 'notes', value: existing ? existing.notes : '' });
    const m = MF.ui.modal({
      title: existing ? 'Edit bill' : 'Add bill', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button>' +
        '<button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Add bill') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!d.name) throw new Error('Enter a name for this bill');
        if (amt == null || amt <= 0) throw new Error('Enter a valid amount greater than zero');
        if (!d.nextDue) throw new Error('Choose a due date');
        const data = {
          name: d.name, amountCents: amt, categoryId: d.categoryId, frequency: d.frequency,
          nextDue: d.nextDue, firstDue: existing && existing.nextDue === d.nextDue && existing.frequency === d.frequency ? existing.firstDue || d.nextDue : d.nextDue,
          accountId: d.accountId || null, paymentDay1: +d.day1 || 1, paymentDay2: +d.day2 || 15,
          customIntervalDays: +d.customIntervalDays || 30,
          autoSetAside: !!d.autoSetAside, notes: d.notes
        };
        if (!existing) Object.assign(data, { paidHistory: [], reservedCents: 0 });
        if (existing) Object.assign(existing, data);
        else MF.store.list('bills').push(Object.assign({ id: MF.uid('bill'), reservedCents: 0, paidHistory: [] }, data));
        MF.storage.save();
        MF.ui.closeModal(); MF.ui.toast(existing ? 'Bill updated' : 'Bill added', 'success');
        MF.app.milestones(); MF.app.rerender();
      }
    });
    const freqSel = m.querySelector('[name="frequency"]');
    const sync = () => {
      m.querySelector('#bill-twice').style.display = freqSel.value === 'twicemonthly' ? '' : 'none';
      m.querySelector('#bill-custom').style.display = freqSel.value === 'custom' ? '' : 'none';
    };
    freqSel.addEventListener('change', sync); sync();
    return m;
  }

  function payModal(bill, dueDate) {
    const accs = MF.accounts.activeAccounts();
    const def = bill.accountId || (MF.store.defaultAccount() || {}).id;
    const f = MF.ui.form;
    const m = MF.ui.modal({
      title: 'Pay “' + bill.name + '”',
      body: '<p class="confirm-msg">' + fmt(bill.amountCents) + ' due ' + D.fmtHuman(dueDate) + '</p>' +
        f.select('Pay from', { name: 'accountId', value: def || '', options: accs.map(a => [a.id, a.name]) }) +
        f.input('Payment date', { name: 'date', type: 'date', value: D.today() }) +
        '<p class="hint">A matching transaction will be created automatically. Paying twice for the same due date is prevented.</p>',
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Mark as paid</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const res = MF.calc.markBillPaid(bill, dueDate, d.accountId || def, d.date);
        MF.ui.closeModal();
        if (res.duplicate) MF.ui.toast('This bill was already paid for that due date.', 'warn');
        else { MF.ui.toast('Bill paid — transaction created', 'success'); MF.app.milestones(); }
        MF.app.rerender();
      }
    });
    return m;
  }

  function payQuick(bill) {
    const due = bill.nextDue;
    if (MF.calc.isBillPaidFor(bill, due)) { MF.ui.toast('Already paid for ' + D.fmtHuman(due) + '.', 'info'); return; }
    payModal(bill, due);
  }

  function setAsideModal(bill) {
    const f = MF.ui.form;
    const room = Math.max(0, bill.amountCents - (bill.reservedCents || 0));
    const canRelease = (bill.reservedCents || 0) > 0;
    const m = MF.ui.modal({
      title: 'Set aside for “' + bill.name + '”',
      body: '<p class="confirm-msg">Bill: ' + fmt(bill.amountCents) + ' · Reserved so far: ' + fmt(bill.reservedCents || 0) + '</p>' +
        f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true, value: (((canRelease ? Math.min(room, bill.reservedCents) : room)) / 100).toFixed(2) }) +
        '<p class="hint">Setting money aside is an earmark, not a transfer: the money stays in your account, is counted exactly once in Safe to Spend (as reserved until the bill is paid), and is consumed when you pay the bill. A reserve can never exceed the bill amount. Every change is recorded on the bill.</p>',
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button>' +
        (canRelease ? '<button class="btn btn-secondary" data-act="release">Release back</button>' : '') +
        '<button class="btn btn-primary" data-act="ok">Add to reserve</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!amt || amt <= 0) throw new Error('Enter an amount greater than zero');
        const room2 = Math.max(0, bill.amountCents - (bill.reservedCents || 0));
        if (amt > room2) throw new Error('Only ' + fmt(room2) + ' can still be reserved — the reserve can\'t exceed the bill amount.');
        bill.reservedCents = (bill.reservedCents || 0) + amt;
        bill.autoSetAside = true;
        (bill.reserveLog = bill.reserveLog || []).push({ date: D.today(), action: 'reserve', amountCents: amt });
        MF.storage.save(); MF.ui.closeModal(); MF.ui.toast('Saved toward this bill', 'success'); MF.app.rerender();
      }
    });
    const rel = m.querySelector('[data-act="release"]');
    if (rel) rel.addEventListener('click', () => {
      const amt = MF.money.parse(m.querySelector('[name="amount"]').value);
      if (!amt || amt <= 0) { MF.ui.toast('Enter an amount greater than zero', 'warn'); return; }
      const take = Math.min(amt, bill.reservedCents || 0);
      bill.reservedCents = (bill.reservedCents || 0) - take;
      (bill.reserveLog = bill.reserveLog || []).push({ date: D.today(), action: 'release', amountCents: take });
      MF.storage.save(); MF.ui.closeModal();
      MF.ui.toast('Released ' + fmt(take) + ' back into your balance', 'info');
      MF.app.rerender();
    });
    return m;
  }

  function deleteBill(b) {
    const paidN = (b.paidHistory || []).length;
    MF.ui.confirm('Delete “' + b.name + '”?',
      (paidN ? paidN + ' past payment(s) and their transactions ' : 'Nothing ') + 'related to this bill' + (paidN ? ' will stop linking, existing transactions are kept.' : ' will be removed.') +
      ' You can also archive it instead.', true, 'Delete bill')
      .then(ok => { if (ok) { MF.store.remove('bills', b.id); MF.app.rerender(); } });
  }

  function render(el) {
    const bills = MF.store.list('bills');
    const open = bills.filter(b => !b.archived);
    const today = D.today();
    const upcoming = open.filter(b => b.nextDue).sort((a, b) => a.nextDue < b.nextDue ? -1 : 1);
    const overdue = upcoming.filter(b => D.daysBetween(today, b.nextDue) < 0);
    const next7 = upcoming.filter(b => D.daysBetween(today, b.nextDue) >= 0 && D.daysBetween(today, b.nextDue) <= 7);
    const paidThisMonth = MF.store.list('bills').reduce((s, b) => s + (b.paidHistory || []).filter(h => (h.paidDate || '').slice(0, 7) === monthOf(today) && h.dueDate === b.nextDue).length, 0);
    el.innerHTML =
      '<header class="page-head"><div><h2>Bills</h2><p class="page-sub">' + open.length + ' active · ' + overdue.length + ' overdue · ' + next7.length + ' due in the next 7 days</p></div>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' Add bill</button></div></header>' +
      (overdue.length ? '<section class="card card-warn"><h4>Overdue bills</h4>' +
        '<div class="list">' + overdue.map(b => billRow(b)).join('') + '</div></section>' : '') +
      '<section class="card"><h4>Upcoming & recurring</h4>' +
      '<div class="list">' + (upcoming.length ? upcoming.map(b => billRow(b)).join('') : '<p class="empty">No bills yet. Add rent, utilities or subscriptions so MindFlow can warn you before they come due.</p>') + '</div>' +
      '</section>' +
      '<section class="card"><h4>Set-aside reserves</h4>' +
      (open.filter(b => b.autoSetAside).length ?
        '<div class="list">' + open.filter(b => b.autoSetAside).map(b =>
          '<div class="row"><div class="row-main"><div><div class="row-title">' + eH(b.name) + '</div><div class="row-sub">' +
          eH(fmt(b.reservedCents || 0)) + ' of ' + eH(fmt(b.amountCents)) + ' saved</div></div></div>' +
          '<div class="row-side">' + MF.ui.bar((b.reservedCents || 0) / b.amountCents * 100) + '</div>' +
          '<button class="btn btn-ghost btn-sm" data-setaside="' + eH(b.id) + '">Set aside</button></div>').join('') + '</div>'
        : '<p class="empty">Saving gradually for big bills? Turn on “Save up gradually” when adding a bill, or click Set aside.</p>') +
      '</section>' +
      (bills.filter(b => b.archived).length ? '<section class="card"><h4>Archived / completed</h4><div class="list muted-list">' +
        bills.filter(b => b.archived).map(b => '<div class="row"><span>' + eH(b.name) + '</span><div class="btn-row">' +
          '<button class="btn btn-ghost btn-sm" data-restore="' + eH(b.id) + '">Restore</button>' +
          '<button class="icon-btn" data-del="' + eH(b.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button></div></div>').join('') +
        '</div></section>' : '');

    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    el.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => payQuick(MF.store.list('bills').find(x => x.id === b.dataset.pay))));
    el.querySelectorAll('[data-setaside]').forEach(b => b.addEventListener('click', () => setAsideModal(MF.store.list('bills').find(x => x.id === b.dataset.setaside))));
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formModal(MF.store.list('bills').find(x => x.id === b.dataset.edit))));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteBill(MF.store.list('bills').find(x => x.id === b.dataset.del))));
    el.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => { const x = MF.store.list('bills').find(y => y.id === b.dataset.restore); x.archived = false; MF.storage.save(); MF.app.rerender(); }));
  }
  function monthOf(str) { return str.slice(0, 7); }

  MF.bills = { render, formModal, payQuick, payModal, setAsideModal, FREQ, statusOf, freqLabel };
})();
</script>
<script>/* ============================================================
   MindFlow — income: sources, schedules, allocations, paychecks
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  const TYPES = [['salary', 'Salary'], ['freelance', 'Freelance'], ['business', 'Business'],
    ['side', 'Side income'], ['gift', 'Gift'], ['refund', 'Refund'], ['other', 'Other']];
  const SCH = [['monthly', 'Monthly'], ['weekly', 'Weekly'], ['biweekly', 'Every two weeks'],
    ['semimonthly', 'Twice monthly'], ['irregular', 'Irregular / varies'], ['custom', 'Custom interval']];

  function srcRow(s) {
    const st = MF.calc.adjustWeekend(s.nextPaydate || s.startDate, s);
    const next = (s.schedule === 'irregular')
      ? ((s.expectedDates || []).filter(x => x >= D.today()).sort()[0] || null)
      : st;
    return '<div class="row">' +
      '<div class="row-main"><div><div class="row-title">' + (s.name ? eH(s.name) : eH(typeName(s.type))) + '</div>' +
      '<div class="row-sub">' + eH(scheduleLabel(s)) +
      (s.allocationTotal ? ' · auto-split on payday' : '') + '</div></div></div>' +
      '<div class="row-side"><strong>' + (s.amountCents ? eH(fmt(s.amountCents)) : 'varies') + '</strong>' +
      '<span class="pill">' + (next ? 'next ' + eH(D.fmtRelative(next)) : 'no date set') + '</span></div>' +
      '<div class="row-actions">' +
      '<button class="btn btn-secondary btn-sm" data-received="' + eH(s.id) + '">Got paid</button>' +
      '<button class="icon-btn" data-edit="' + eH(s.id) + '" aria-label="Edit">' + MF.icon('edit') + '</button>' +
      '<button class="icon-btn" data-del="' + eH(s.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button>' +
      '</div></div>';
  }
  function typeName(t) { return (TYPES.find(x => x[0] === t) || [, t])[1]; }
  function scheduleLabel(s) {
    const map = { monthly: 'Monthly', weekly: 'Weekly', biweekly: 'Every two weeks', semimonthly: 'Twice monthly', irregular: 'Irregular', custom: 'Every ' + (s.customIntervalDays || 30) + ' days' };
    return map[s.schedule] || s.schedule;
  }

  function formModal(existing, onDone) {
    const f = MF.ui.form;
    const s = existing || {};
    const alloc = s.allocation || { bills: 0, savings: 0, debt: 0, spending: 100 };
    const body =
      f.select('Income type', { name: 'type', value: s.type || 'salary', options: TYPES }) +
      f.input('Name (optional)', { name: 'name', value: s.name || '', maxlength: 40, placeholder: 'e.g. Main job' }) +
      f.input('Typical amount', { name: 'amount', type: 'number', step: '0.01', value: s.amountCents ? (s.amountCents / 100).toFixed(2) : '', placeholder: '0.00' }) +
      f.select('Pay schedule', { name: 'schedule', value: s.schedule || MF.store.settings().incomeSchedule || 'monthly', options: SCH }) +
      '<div class="date-fields" id="inc-date-fields">' +
      f.input('Expected date of next payday', { name: 'nextPaydate', type: 'date', value: s.nextPaydate || s.startDate || '', placeholder: 'YYYY-MM-DD' }) + '</div>' +
      '<div class="form-2col" id="inc-day-fields" style="display:none">' +
      f.input('1st payday day (1-28)', { name: 'day1', type: 'number', min: 1, max: 28, value: s.payday1 || 1 }) +
      f.input('2nd payday day (1-28)', { name: 'day2', type: 'number', min: 1, max: 28, value: s.payday2 || 15 }) + '</div>' +
      '<div id="inc-custom" style="display:none">' + f.input('Repeat every (days)', { name: 'customIntervalDays', type: 'number', min: 1, value: s.customIntervalDays || 30 }) + '</div>' +
      f.select('Paid into', { name: 'accountId', value: s.accountId || '', options: [['', 'Choose…']].concat(MF.accounts.activeAccounts().map(a => [a.id, a.name])) }) +
      f.select('If payday falls on a weekend', { name: 'weekendAdjust', value: s.weekendAdjust || 'after', options: [['none', 'Ignore (keep the date)'], ['before', 'Pay Friday (before)'], ['after', 'Pay Monday (after)']] }) +
      f.toggle('Pause this source (income won\u2019t be expected)', { name: 'paused', checked: !!s.paused });
    const m = MF.ui.modal({
      title: existing ? 'Edit income source' : 'Add income source', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Add income') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = d.amount ? MF.money.parse(d.amount) : 0;
        const data = {
          type: d.type, name: d.name, amountCents: amt || 0, schedule: d.schedule,
          nextPaydate: d.nextPaydate || d.dates || null, accountId: d.accountId || null,
          weekendAdjust: d.weekendAdjust || 'none', paused: !!d.paused,
          customIntervalDays: +d.customIntervalDays || 30, payday1: +d.day1 || 1, payday2: +d.day2 || 15
        };
        if (data.schedule === 'irregular') {
          data.expectedDates = (existing && existing.expectedDates) || [];
        }
        // keep prior dates for semimonthly
        if (data.schedule === 'semimonthly' && !data.nextPaydate) data.nextPaydate = D.today();
        if (data.nextPaydate) data.startDate = data.nextPaydate;
        if (existing) Object.assign(existing, data);
        else MF.store.list('incomeSources').push(Object.assign({ id: MF.uid('inc'), allocation: { bills: 0, savings: 0, debt: 0, spending: 100 } }, data));
        MF.storage.save();
        MF.ui.closeModal(); MF.ui.toast(existing ? 'Income updated' : 'Income added', 'success');
        if (onDone) onDone(); else MF.app.rerender();
      }
    });
    // date vs day fields depend on schedule
    const sch = m.querySelector('[name="schedule"]');
    const sync = () => {
      const v = sch.value;
      m.querySelector('#inc-date-fields').style.display = (v === 'semimonthly') ? '' : '';
      m.querySelector('#inc-day-fields').style.display = v === 'semimonthly' ? '' : 'none';
      m.querySelector('#inc-custom').style.display = v === 'custom' ? '' : 'none';
    };
    sch.addEventListener('change', sync); sync();
    return m;
  }

  function allocModal(s) {
    // automatic allocation percentages of each paycheck
    const a = MF.deepClone(s.allocation || { bills: 0, savings: 0, debt: 0, spending: 100 });
    const tot = MF.sum(Object.values(a));
    const body =
      '<p class="hint" id="alloc-sum">Assigned so far: <strong>' + tot + '%</strong> of each paycheck</p>' +
      Object.entries({ bills: 'Bills', savings: 'Savings', debt: 'Debt payments', spending: 'Free spending', emergency: 'Emergency fund' }).map(([k, label]) =>
        '<label class="field"><span class="field-label">' + label + ' (%)</span>' +
        '<input type="number" min="0" max="100" name="' + k + '" value="' + (a[k] || 0) + '"></label>').join('') +
      '<p class="hint">Percentages can total up to 100%; the remainder stays as free spending.</p>';
    const m = MF.ui.modal({
      title: 'Auto-split each paycheck', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Save split</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const alloc = { bills: +d.bills || 0, savings: +d.savings || 0, debt: +d.debt || 0, spending: +d.spending || 0, emergency: +d.emergency || 0 };
        const t = MF.sum(Object.values(alloc));
        if (t > 100) throw new Error('Assigned ' + t + '% — above 100%. The allocations must not exceed the paycheck.');
        s.allocation = alloc;
        MF.storage.save(); MF.ui.closeModal(); MF.ui.toast('Paycheck split saved', 'success'); MF.app.rerender();
      }
    });
    return m;
  }

  function receivedModal(s) {
    const f = MF.ui.form;
    const accs = MF.accounts.activeAccounts();
    const def = s.accountId || (MF.store.defaultAccount() || {}).id || '';
    const m = MF.ui.modal({
      title: 'Got paid!',
      body:
        f.input('Amount received', { name: 'amount', type: 'number', step: '0.01', required: true, value: s.amountCents ? (s.amountCents / 100).toFixed(2) : '' }) +
        f.input('Date received', { name: 'date', type: 'date', required: true, value: D.today() }) +
        f.select('Put it in', { name: 'accountId', value: def, options: accs.map(a => [a.id, a.name]) }) +
        (s.allocation && MF.sum(Object.values(s.allocation)) > 0 ?
        '<div class="info-box">' + derivedAllocText(s.amountCents, s.allocation) + '</div><label class="toggle-row"><span>Apply the auto-split</span>' +
        '<input type="checkbox" name="applyAlloc" checked><span class="toggle"></span></label>' : ''),
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">Record payment</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const amt = MF.money.parse(d.amount);
        if (!amt || amt <= 0) throw new Error('Enter the amount you received');
        // Check before saving the paycheck or changing any of its allocations.
        if (d.applyAlloc && Math.round(amt * ((s.allocation || {}).debt || 0) / 100) > 0) {
          const debt = MF.store.list('debts').find(x => !x.paidOff && (x.balanceCents || 0) > 0);
          if (debt && !(debt.nextDue && MF.calc.debt.debtPaidFor(debt, debt.nextDue))) MF.spendDemo.requireSlot();
        }
        MF.tx.create({
          type: 'income', amountCents: amt, date: d.date,
          description: 'Paycheck — ' + (s.name || typeName(s.type)),
          categoryId: 'cat_income', accountId: d.accountId, incomeSourceId: s.id
        });
        let warnings = [];
        if (d.applyAlloc) warnings = applySplit(amt, s.allocation, d.accountId, d.date);
        if (!s.receivedDates) s.receivedDates = [];
        s.receivedDates.push(d.date);
        if (s.schedule !== 'irregular') {
          s.nextPaydate = advanceToDate(s, d.date);
        }
        MF.storage.save();
        MF.ui.closeModal();
        MF.ui.toast('Paycheck recorded — next payday updated' + (warnings.length ? ' (' + warnings[0] + ')' : ''), warnings.length ? 'warn' : 'success');
        warnings.slice(1).forEach(w => MF.ui.toast(w, 'warn'));
        MF.app.milestones(); MF.app.rerender();
      }
    });
    if (s.amountCents) m.querySelector('[name="amount"]').value = (s.amountCents / 100).toFixed(2);
    return m;
  }
  /* Auto-split a recorded paycheck. Percentages are applied to the actual
     received amount. HARD RULE: money is never moved into a missing or
     invalid destination. Every bucket must either land in a real place or
     stay in the paycheck account with a clear explanation.

     Returns a list of human warnings ('' problems found → empty array).
     The saved allocation (percentages) is NEVER modified here. */
  function applySplit(actualCents, alloc, accountId, date) {
    const warnings = [];
    for (const k in alloc) {
      const pct = alloc[k] || 0;
      if (!pct) continue;
      const amt = Math.round(actualCents * pct / 100);
      if (!amt) continue;
      if (k === 'bills') {
        /* No separate bills account exists — route the amount into set-aside
           reserves on the most urgent open bills (an earmark tracked on the
           bill itself, visible on the Bills page; the money stays in the
           account and is counted in Safe-to-Spend through the reserve rules). */
        const placed = routeBillReserve(amt, date);
        if (placed < amt) warnings.push('' + MF.money.fmt(amt - placed) + ' of the bills split had no open bill to reserve toward — it stays in your account.');
      } else if (k === 'savings' || k === 'emergency') {
        const goals = MF.store.list('goals');
        const g = goals.find(g => k === 'emergency' ? g.kind === 'emergency' : (!g.paused && !g.completed)) ||
                  goals.find(g => !g.paused && !g.completed) ||
                  (k === 'emergency' ? goals.find(g => /emergency/i.test(g.name || g.category || '')) : null);
        if (g) { MF.savings.addMoney(g.id, amt, date, accountId, false); continue; }
        warnings.push('The ' + pct + '% ' + (k === 'emergency' ? 'emergency-fund' : 'savings') + ' split (' + fmt(amt) + ') has no goal to go to — it stays in your account. Add a savings goal to enable this split.');
      } else if (k === 'debt') {
        const dt = MF.store.list('debts').find(x => !x.paidOff && (x.balanceCents || 0) > 0);
        if (dt) { MF.calc.debt.recordDebtPayment(dt, Math.min(amt, dt.balanceCents), dt.nextDue, accountId, date); continue; }
        warnings.push('The ' + pct + '% debt split (' + fmt(amt) + ') has no open debt — it stays in your account.');
      }
      /* 'spending' (and anything unknown) stays in the paycheck account, as intended. */
    }
    return warnings;
  }
  /* Put amt into set-aside reserves of open bills, most urgent due first,
     topped up one bill at a time up to that bill's remaining room.
     Returns the total actually reserved (money itself does not move). */
  function routeBillReserve(amt, date) {
    let left = amt;
    const open = MF.store.list('bills').filter(b => !b.archived)
      .sort((a, b) => (a.nextDue || '9999') < (b.nextDue || '9999') ? -1 : 1);
    for (const b of open) {
      if (left <= 0) break;
      const room = Math.max(0, (b.amountCents || 0) - (b.autoSetAside && b.reservedCents ? b.reservedCents : 0));
      if (room <= 0) continue;
      const put = Math.min(room, left);
      b.autoSetAside = true;
      b.reservedCents = (b.reservedCents || 0) + put;
      (b.reserveLog = b.reserveLog || []).push({ date: date || MF.dates.today(), action: 'auto-split from paycheck', amountCents: put });
      left -= put;
    }
    return amt - left;
  }
  function derivedAllocText(amountCents, alloc) {
    return 'On record, this paycheck is split: ' + Object.entries(alloc).filter(([, v]) => v > 0)
      .map(([k, v]) => k + ' ' + v + '% (' + fmt(Math.round(amountCents * v / 100)) + ')').join(', ');
  }
  /* Roll a source's nextPaydate forward after a recorded paycheck.
     Monthly rolls preserve the ORIGINAL anchor day so Jan-31 paydays step
     Jan 31 → Feb 28/29 → Mar 31 (never shrink permanently to day 28). */
  function advanceToDate(s, lastDate) {
    const anchor = s.nextPaydate || s.startDate || lastDate;
    const f = s.schedule;
    if (!D.parse(anchor) || !D.parse(lastDate)) return null;
    const after = d => MF.calc.adjustWeekend(d, s) > lastDate;
    if (f === 'weekly' || f === 'biweekly' || f === 'custom') {
      const step = f === 'weekly' ? 7 : f === 'biweekly' ? 14 : Math.max(1, Math.floor(s.customIntervalDays || 30));
      let d = D.addDays(anchor, Math.max(0, Math.floor(D.daysBetween(anchor, D.addDays(lastDate, -2)) / step)) * step);
      while (!after(d)) d = D.addDays(d, step);
      return d;
    }
    if (f === 'monthly') {
      const day = +((s.startDate || anchor)).slice(8, 10);
      const diff = (+lastDate.slice(0, 4) - +anchor.slice(0, 4)) * 12 + +lastDate.slice(5, 7) - +anchor.slice(5, 7);
      for (let i = Math.max(0, diff - 1); ; i++) {
        const d = D.addMonthsAnchored(anchor, day, i);
        if (d >= anchor && after(d)) return d;
      }
    }
    if (f === 'semimonthly' || f === 'twicemonthly') {
      const d1 = Math.min(28, Math.max(1, s.payday1 || 1));
      const d2 = Math.max(d1 + 1, Math.min(28, s.payday2 || d1 + 14));
      let month = D.addDays(lastDate, -2).slice(0, 7) + '-01';
      for (;;) {
        for (const day of [d1, d2]) {
          const d = month.slice(0, 8) + String(Math.min(day, D.daysInMonth(+month.slice(0, 4), +month.slice(5, 7) - 1))).padStart(2, '0');
          if (d >= anchor && after(d)) return d;
        }
        month = D.addMonths(month, 1);
      }
    }
    return null;
  }

  function render(el) {
    const srcs = MF.store.list('incomeSources');
    const today = D.today();
    const upcoming = MF.calc.paydaysBetween(today, D.addDays(today, 60)).slice(0, 8);
    el.innerHTML =
      '<header class="page-head"><div><h2>Income</h2><p class="page-sub">Where your money comes from — and when to expect it.</p></div>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' Add income source</button></div></header>' +
      '<section class="card"><h4>Sources (' + srcs.length + ')</h4><div class="list">' +
      (srcs.length ? srcs.map(srcRow).join('') : '<p class="empty">No income sources yet. Adding even one helps MindFlow show your next payday.</p>') + '</div></section>' +
      '<section class="card"><h4>Expected paychecks (next 60 days)</h4>' +
      (upcoming.length ? '<div class="list">' + upcoming.map(p =>
        '<div class="row"><div class="row-main"><div><div class="row-title">' + eH(p.source.name || typeName(p.source.type)) + '</div>' +
        '<div class="row-sub">' + eH(D.fmtRelative(p.date)) + '</div></div></div><div class="row-side"><strong>' + eH(fmt(p.amountCents)) + '</strong></div></div>').join('') + '</div>'
        : '<p class="empty">Nothing scheduled yet in the next 60 days. Add or update an income source.</p>') +
      '</section>' +
      '<section class="card"><h4>How it works</h4><p class="hint">Expected paychecks are never counted as received money. They show when your next payday is; Safe to Spend only uses money you have already received. When you actually get paid, click “Got paid” to record it.</p></section>';
    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formModal(srcs.find(x => x.id === b.dataset.edit))));
    el.querySelectorAll('[data-received]').forEach(b => b.addEventListener('click', () => receivedModal(srcs.find(x => x.id === b.dataset.received))));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(srcs.find(x => x.id === b.dataset.del))));
  }
  function del(s) {
    MF.ui.confirm('Remove income source?', '“' + (s.name || typeName(s.type)) + '” will be removed. Past paycheck transactions are kept.', true, 'Remove')
      .then(ok => { if (ok) { MF.store.remove('incomeSources', s.id); MF.app.rerender(); } });
  }

  MF.income = { render, formModal, receivedModal, typeName, scheduleLabel, testApplySplit: applySplit, testAdvance: advanceToDate };
})();
</script>
<script>/* ============================================================
   MindFlow — savings goals: progress, add/withdraw, archive
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;

  function totalSaved() { return MF.sum(MF.store.list('goals').map(g => g.savedCents || 0)); }

  function goalCard(g) {
    const pct = g.targetCents ? 100 * (g.savedCents || 0) / g.targetCents : 0;
    const eta = MF.calc.goalEta(g);
    return '<div class="goal-card" data-id="' + eH(g.id) + '">' +
      '<div class="goal-top"><span class="dot dot-lg" style="background:' + eH(g.color || '#2f9e6e') + '"></span>' +
      '<div><div class="row-title">' + eH(g.name) + '</div><div class="row-sub">' + eH(g.category || 'Goal') + '</div></div></div>' +
      MF.ui.bar(pct) +
      '<div class="goal-nums"><strong>' + eH(fmt(g.savedCents || 0)) + '</strong> of ' + eH(fmt(g.targetCents)) + '</div>' +
      '<div class="row-sub">' +
      (g.monthlyCents ? 'Adding ' + eH(fmt(g.monthlyCents)) + '/month · ' : '') +
      (pct >= 100 ? '<span class="pill pill-pos">Goal complete 🎉</span>' :
        (eta ? 'est. done ' + eH(D.monthName(+eta.slice(5, 7) - 1).slice(0, 3)) + ' ' + eta.slice(0, 4) : 'no monthly plan set')) + '</div>' +
      '<div class="btn-row goal-actions">' +
      '<button class="btn btn-primary btn-sm" data-add="' + eH(g.id) + '">Add money</button>' +
      '<button class="btn btn-ghost btn-sm" data-wd="' + eH(g.id) + '">Withdraw</button>' +
      '<button class="icon-btn" data-edit="' + eH(g.id) + '" aria-label="Edit">' + MF.icon('edit') + '</button>' +
      '<button class="icon-btn" data-del="' + eH(g.id) + '" aria-label="Delete">' + MF.icon('trash') + '</button>' +
      '</div></div>';
  }

  function formModal(existing) {
    const f = MF.ui.form;
    const s = existing || {};
    const body =
      f.input('Goal name', { name: 'name', value: s.name || '', required: true, maxlength: 50, placeholder: 'e.g. Emergency fund' }) +
      f.input('Target amount', { name: 'target', type: 'number', step: '0.01', required: true, value: s.targetCents ? (s.targetCents / 100).toFixed(2) : '' }) +
      '<div class="form-2col">' +
      f.input('Currently saved', { name: 'saved', type: 'number', min: 0, step: '0.01', value: s.savedCents ? (s.savedCents / 100).toFixed(2) : '0' }) +
      f.input('Monthly contribution (optional)', { name: 'monthly', type: 'number', min: 0, step: '0.01', value: s.monthlyCents ? (s.monthlyCents / 100).toFixed(2) : '' }) + '</div>' +
      '<div class="form-2col">' +
      f.input('Target date (optional)', { name: 'targetDate', type: 'date', value: s.targetDate || '' }) +
      f.select('Kind of goal', { name: 'category', value: s.category || 'Savings', options: ['Emergency Fund', 'Savings', 'Travel', 'Car', 'Home', 'Education', 'Electronics', 'Gifts', 'Other'].map(x => [x, x]) }) + '</div>' +
      f.color('Color', { name: 'color', value: s.color || '#2f9e6e' }) +
      f.textarea('Notes (optional)', { name: 'notes', value: s.notes || '' });
    const m = MF.ui.modal({
      title: existing ? 'Edit savings goal' : 'New savings goal', body,
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-primary" data-act="ok">' + (existing ? 'Save changes' : 'Create goal') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        const target = MF.money.parse(d.target);
        const saved = MF.money.parse(d.saved);
        const monthly = d.monthly ? MF.money.parse(d.monthly) : 0;
        if (!d.name) throw new Error('Give the goal a name');
        if (target == null || target <= 0) throw new Error('Enter a valid target amount');
        if (saved != null && saved > target) throw new Error('Saved amount is above the target — edit the target first');
        const data = { name: d.name, targetCents: target, savedCents: saved || 0, monthlyCents: monthly || 0, targetDate: d.targetDate || null, category: d.category, color: d.__color, notes: d.notes };
        data.completed = data.savedCents >= data.targetCents;
        if (data.completed) data.completedDate = s.completed && s.completedDate ? s.completedDate : D.today();
        if (existing) {
          Object.assign(existing, data);
          if (!data.completed) delete existing.completedDate;
        } else MF.store.list('goals').push(Object.assign({ id: MF.uid('goal'), history: [] }, data));
        MF.storage.save();
        MF.ui.closeModal(); MF.ui.toast(existing ? 'Goal updated' : 'Goal created', 'success');
        MF.app.milestones(); MF.app.rerender();
      }
    });
    return m;
  }

  function moneyModal(g, withdraw) {
    const f = MF.ui.form;
    const accs = MF.accounts.activeAccounts();
    const def = (MF.store.defaultAccount() || {}).id || '';
    const isCardDefault = (MF.store.defaultAccount() || {}).type === 'savings';
    const m = MF.ui.modal({
      title: (withdraw ? 'Withdraw from' : 'Add money to') + ' “' + g.name + '”',
      body:
        f.input('Amount', { name: 'amount', type: 'number', step: '0.01', required: true, value: withdraw ? '' : (g.monthlyCents ? (g.monthlyCents / 100).toFixed(2) : '') }) +
        (withdraw ? '' : f.select('Money coming from', { name: 'accountId', value: def, options: accs.map(a => [a.id, a.name]) })) +
        (withdraw ? f.select('Money going to', { name: 'accountId', value: def, options: accs.map(a => [a.id, a.name]) }) : '') +
        f.input('Date', { name: 'date', type: 'date', value: D.today(), required: true }),
      footer: '<button class="btn btn-ghost" data-act="cancel">Cancel</button>' +
        '<button class="btn btn-primary" data-act="ok">' + (withdraw ? 'Withdraw' : 'Add to savings') + '</button>',
      onOk(modal) {
        const d = MF.ui.formData(modal);
        MF.savings.addMoney(g.id, MF.money.parse(d.amount), d.date, d.accountId, withdraw);
        MF.ui.closeModal(); MF.app.rerender();
      }
    });
    return m;
  }

  function addMoney(goalId, amountCents, date, accountId, withdraw) {
    const g = MF.store.find('goals', goalId);
    if (!g) return;
    const amt = Math.max(0, amountCents || 0);
    if (!amt) { MF.ui.toast('Enter an amount greater than zero', 'warn'); return; }
    if (withdraw && amt > (g.savedCents || 0)) throw new Error('You only have ' + fmt(g.savedCents) + ' in this goal');
    const txn = MF.tx.create({
      type: 'transfer',
      amountCents: amt, date: date || D.today(),
      description: (withdraw ? 'Withdrawal — ' : 'Savings — ') + g.name,
      categoryId: 'cat_incomecategory', accountId: withdraw ? 'goal:' + goalId : accountId,
      toAccountId: withdraw ? accountId : 'goal:' + goalId,
      goalId, goalWithdraw: !!withdraw
    });
    g.savedCents = (g.savedCents || 0) + (withdraw ? -amt : amt);
    if (g.completed && g.savedCents < g.targetCents) { g.completed = false; delete g.completedDate; }
    (g.history = g.history || []).push({ date: date || D.today(), amountCents: amt, kind: withdraw ? 'withdraw' : 'add', transactionId: txn.id });
    if (g.savedCents >= g.targetCents && !g.completed) {
      g.completed = true; g.completedDate = D.today();
      MF.ui.toast('🎉 Goal “' + g.name + '” reached! Amazing work.', 'success');
      MF.app.milestones();
    }
    MF.storage.save();
    MF.ui.toast(withdraw ? 'Withdrawn from goal' : 'Added to “' + g.name + '”', 'success');
  }

  function del(g) {
    const hasMoney = (g.savedCents || 0) > 0;
    MF.ui.confirm('Delete “' + g.name + '”?',
      hasMoney ? 'It holds ' + fmt(g.savedCents) + '. If the savings are in an account, withdraw first or the amount will disappear from totals.' + ' Deleting a goal cannot be undone.' : 'This goal is empty. Deleting cannot be undone.',
      true, 'Delete goal')
      .then(ok => { if (ok) { MF.store.remove('goals', g.id); MF.app.rerender(); } });
  }

  function render(el) {
    const goals = MF.store.list('goals');
    const done = goals.filter(g => g.completed), active = goals.filter(g => !g.completed);
    const tot = totalSaved(), target = MF.sum(active.map(g => g.targetCents));
    el.innerHTML =
      '<header class="page-head"><div><h2>Savings Goals</h2><p class="page-sub">' + active.length + ' active · ' + done.length + ' completed' +
      (target ? ' · ' + eH(fmt(tot)) + ' saved in total' : '') + '</p></div>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="add">' + MF.icon('plus', 'sm') + ' New goal</button></div></header>' +
      '<div class="grid grids-2">' + (active.concat(done).map(goalCard).join('') || '') + '</div>' +
      (!goals.length ? '<p class="empty card empty-pad">No goals yet. Even a small “rainy day” goal is a great first step — you decide the size.</p>' : '');
    el.querySelector('[data-act="add"]').addEventListener('click', () => formModal(null));
    el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => moneyModal(MF.store.find('goals', b.dataset.add), false)));
    el.querySelectorAll('[data-wd]').forEach(b => b.addEventListener('click', () => moneyModal(MF.store.find('goals', b.dataset.wd), true)));
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formModal(MF.store.find('goals', b.dataset.edit))));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => del(MF.store.find('goals', b.dataset.del))));
  }

  MF.savings = { render, formModal, addMoney, moneyModal, totalSaved };
})();
</script>
<script>/* ============================================================
   MindFlow — debt manager: balances, snowball/avalanche, payments
   Estimates are projections (see engine: APR/365 daily accrual).
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const eH = MF.escapeHtml, fmt = MF.money.fmt, D = MF.dates;
