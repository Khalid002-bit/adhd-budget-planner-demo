<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="teal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6f">
<meta name="description" content="MindFlow Budget Planner — a calm, private planner for budgets, bills, savings and debt. Works offline. Data stays on your device.">
<title>MindFlow Budget Planner</title>
<style>/* MindFlow — design tokens & themes */
:root {
  /* neutral canvas */
  --bg: #f5f6f8;
  --bg-soft: #eef0f3;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #e4e7ec;
  --text: #1c2330;
  --muted: #667085;

  --accent: #2f7d6f;
  --accent-soft: #e2f1ed;
  --accent-contrast: #ffffff;

  --ok: #2f9e6e;
  --ok-bg: #e8f5ee;
  --neg: #d6473f;
  --neg-bg: #fdeceb;
  --warn: #b97a19;
  --warn-bg: #fdf3e2;

  --ring-track: #e8eaee;
  --ring-fill: var(--accent);
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-2: 0 4px 14px rgba(16, 24, 40, .10);
  --radius: 14px;
  --radius-sm: 9px;
  --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs: 15px;        /* base */
  --fs-lg: 19px;
  --sidebar-w: 252px;
  --gap: 18px;
}
[data-theme="dark"] {
  --bg: #121417;
  --bg-soft: #171a1f;
  --surface: #1d2127;
  --surface-2: #21262d;
  --border: #2c323b;
  --text: #e8eaef;
  --muted: #98a1b0;
  --accent-soft: #22383f;
  --ok: #45b87f;
  --ok-bg: #16321f;
  --neg: #e26a62;
  --neg-bg: #3a1e1c;
  --warn: #d29a43;
  --warn-bg: #3a2e1a;
  --shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --shadow-2: 0 6px 18px rgba(0,0,0,.42);
}
/* accents */
[data-accent="teal"]   { --accent:#2f7d6f; --accent-soft:#e2f1ed; }
[data-accent="blue"]   { --accent:#3d6bd6; --accent-soft:#e6ecfc; }
[data-accent="green"]  { --accent:#2e8b46; --accent-soft:#e4f4e9; }
[data-accent="purple"] { --accent:#6d5bd0; --accent-soft:#ece9fb; }
[data-accent="amber"]  { --accent:#a6741c; --accent-soft:#f9efdd; }
[data-accent="rose"]   { --accent:#c2475c; --accent-soft:#fbe9ec; }
[data-theme="dark"][data-accent="teal"]   { --accent:#4ba795; --accent-soft:#1d3a35; }
[data-theme="dark"][data-accent="blue"]   { --accent:#6b8fe8; --accent-soft:#1c2642; }
[data-theme="dark"][data-accent="green"]  { --accent:#54b86b; --accent-soft:#173320; }
[data-theme="dark"][data-accent="purple"] { --accent:#9b8ae6; --accent-soft:#252350; }
[data-theme="dark"][data-accent="amber"]  { --accent:#d2a24c; --accent-soft:#3b2f14; }
[data-theme="dark"][data-accent="rose"]   { --accent:#e0798c; --accent-soft:#3d1e26; }

/* compact density */
.compact { --fs: 13.5px; --gap: 12px; --radius: 11px; }
</style>
<style>/* MindFlow — main component styles */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, h5 { margin: 0 0 8px; font-weight: 650; line-height: 1.25; }
p { margin: 0 0 10px; }
a { color: var(--accent); }

/* focus visibility */
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- shell ---------- */
#app { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 18px 14px;
  z-index: 60;
  transition: transform .22s ease;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 16px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 19px;
}
.brand-name { font-weight: 700; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 12.5px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-weight: 500;
}
.nav-link:hover { background: var(--bg-soft); }
.nav-link.act { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.icon { width: 18px; height: 18px; flex: none; }
.nav-ic { opacity: .85; }
.side-foot { padding-top: 12px; display: block; }
.side-note { color: var(--muted); font-size: 11.5px; padding: 10px 4px 0; text-align: center; }
.nav-toggle { display: none; position: fixed; top: 10px; left: 10px; z-index: 80; }

.main {
  margin-left: var(--sidebar-w);
  padding: calc(var(--gap) + 4px) calc(var(--gap) + 8px) 48px;
  max-width: 1120px;
}

/* ---------- cards & grids ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 18px 20px;
  margin-bottom: var(--gap);
}
.grid { display: grid; gap: var(--gap); margin-bottom: var(--gap); }
.grids-2 { grid-template-columns: repeat(2, 1fr); }
.grids-3 { grid-template-columns: repeat(3, 1fr); }
.card-warn { border-color: var(--warn); background: var(--warn-bg); }
.empty { color: var(--muted); font-style: italic; margin: 6px 0; }
.empty-pad { padding: 26px; text-align: center; }
.sect { margin: 22px 0 10px; font-size: 15px; color: var(--muted); font-weight: 650; }

/* stats */
.stat { display: flex; flex-direction: column; }
.stat .stat-label, .stat-label { color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.stat-val { font-size: 24px; font-weight: 750; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.pos { color: var(--ok); }
.neg { color: var(--neg); }
.mute { color: var(--muted); }
.warn-c { color: var(--warn); }

/* ---------- hero (safe to spend) ---------- */
.hero-card { display: flex; gap: 20px; align-items: center; justify-content: space-between; background: linear-gradient(135deg, var(--surface) 55%, var(--accent-soft)); }
.hero-neg { background: linear-gradient(135deg, var(--surface) 55%, var(--neg-bg)); }
.hero-num { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; margin: 2px 0; }
.hero-sub { color: var(--muted); font-size: 13.5px; display: flex; gap: 8px; flex-wrap: wrap; }
.calc-details { margin-top: 10px; }
.calc-details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; }
.ring-label { font-weight: 700; }
.hero-ring { flex: none; }

/* banner / info boxes */
.info-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin: 8px 0; font-size: 13.5px; }
.info-box.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner-ok { background: var(--ok-bg); color: var(--ok); border-radius: var(--radius-sm); padding: 10px 14px; font-weight: 600; }
.right-now { display: flex; gap: 14px; align-items: flex-start; border-left: 4px solid var(--accent); }
.rn-icon { font-size: 22px; }
.back-card { border-left: 4px solid var(--ok); }
.welcome-card { text-align: center; padding: 30px 20px; }

/* kvs */
.kvs { display: grid; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.kv:last-child { border-bottom: 0; }
.nowrap-nums { display: flex; gap: 18px; }

/* ---------- buttons ---------- */
.btn-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; border-radius: 10px;
  padding: 9px 16px; font-weight: 600; cursor: pointer;
  background: var(--surface-2); color: var(--text);
  transition: filter .15s ease, transform .05s ease;
}
.btn:hover { filter: brightness(.96); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-contrast); }
.btn-secondary { background: var(--accent-soft); color: var(--accent); }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-danger { background: var(--neg); color: #fff; }
.btn-danger-text { color: var(--neg); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; justify-content: center; }
.icon-btn {
  border: 0; background: transparent; cursor: pointer; color: var(--muted);
  width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--text); }
.icon-btn .icon { width: 17px; height: 17px; }

.qa-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: var(--gap); }

/* ---------- lists & rows ---------- */
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 2px; border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: 0; }
.row-btn { border: 0; background: transparent; text-align: left; width: 100%; cursor: pointer; border-radius: 10px; }
.row-btn.act { background: var(--accent-soft); }
.row-main { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0; }
.row-title { font-weight: 600; }
.row-sub { color: var(--muted); font-size: 12.5px; }
.row-side { text-align: right; font-variant-numeric: tabular-nums; }
.row-side strong { display: block; }
.row-actions { display: flex; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot-lg { width: 13px; height: 13px; }
.pos-bg { background: var(--ok); } .neg-bg { background: var(--neg); } .goal-bg { background: #8a79d9; }
.note-dot-inline { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }

/* transactions */
.txn-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.txn-row:hover, .txn-row:focus-visible { background: var(--bg-soft); }
.txn-dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.txn-dot .icon { width: 16px; height: 16px; }
.txn-main { flex: 1; min-width: 0; }
.txn-desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-sub { color: var(--muted); font-size: 12.5px; }
.txn-amount { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--chip, #888) 18%, transparent); color: var(--chip, #555); font-size: 12px; font-weight: 600; }
.pill { display: inline-block; padding: 1.5px 9px; border-radius: 999px; background: var(--bg-soft); color: var(--muted); font-size: 11.5px; font-weight: 600; margin-left: 4px; }
.pill-pos { background: var(--ok-bg); color: var(--ok); }
.pill-neg { background: var(--neg-bg); color: var(--neg); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- forms ---------- */
.field { display: block; margin-bottom: 12px; }
.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=search],
.field select, .field textarea, .search-box input, .inline-select {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text);
}
.field textarea { resize: vertical; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-3col { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 0 10px; align-items: center; margin-bottom: 8px; }
.form-row-wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.form-row-wrap .field { min-width: 130px; margin-bottom: 0; }
.form-row-wrap .search-box { min-width: 220px; flex: 1; }
.hint { color: var(--muted); font-size: 12.5px; }
.search-box { position: relative; }
.search-box .icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-box input { padding-right: 34px; }
.color-row { display: flex; gap: 9px; flex-wrap: wrap; }
.color-row input[type=radio] {
  appearance: none; width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer; vertical-align: middle;
}
.color-row input[type=radio]:checked { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; cursor: pointer; border-bottom: 1px dashed var(--border); }
.toggle { width: 40px; height: 23px; border-radius: 999px; background: var(--ring-track); position: relative; transition: background .18s; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left .18s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle-row input { display: inline-block; width: 0; height: 0; opacity: 0; position: absolute; }
.toggle-row input:checked + .toggle { background: var(--accent); }
.toggle-row input:checked + .toggle::after { left: 20px; }
.toggle-row input:focus-visible + .toggle { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.seg-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.seg { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: 7px 15px; border-radius: 999px; background: var(--bg-soft); font-weight: 600; font-size: 13.5px; }
.seg input:checked + span { background: var(--accent); color: #fff; }
.seg input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: var(--gap); }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tab.act { background: var(--accent-soft); color: var(--accent); }
.file-input { margin: 10px 0; }
.confirm-msg { font-size: 15px; }

/* progress */
.bar { height: 9px; border-radius: 999px; background: var(--ring-track); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s; }

/* goal/env cards */
.goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 16px 17px; margin-bottom: 0; }
.goal-top { display: flex; gap: 11px; align-items: center; margin-bottom: 12px; }
.goal-nums { margin-top: 10px; font-variant-numeric: tabular-nums; }
.goal-actions { margin-top: 10px; }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* calendar */
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-cell {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 9px; min-height: 74px; padding: 5px 6px;
  display: flex; flex-direction: column; gap: 3px; align-items: flex-start; cursor: pointer;
}
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.blank { border: 0; background: transparent; cursor: default; }
.cal-cell.today { border-color: var(--accent); background: var(--accent-soft); }
.cal-cell.sel { outline: 2px solid var(--accent); }
.cal-dayn { font-size: 12px; font-weight: 700; }
.cal-ev { font-size: 10.3px; font-weight: 650; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cal-more { font-size: 9.7px; color: var(--muted); }
.legend-row { display: flex; gap: 18px; color: var(--muted); font-size: 12px; padding: 2px 4px 10px; flex-wrap: wrap; }
.legend-row .dot { vertical-align: middle; margin-right: 4px; }

/* tables */
.detail-table { width: 100%; border-collapse: collapse; }
.detail-table th { text-align: left; color: var(--muted); font-weight: 600; width: 34%; padding: 8px 10px 8px 0; vertical-align: top; border-bottom: 1px solid var(--border); }
.detail-table td { padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail-table tr:last-child th, .detail-table tr:last-child td { border-bottom: 0; }

/* toasts */
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; max-width: min(92vw, 460px); }
.toast {
  background: var(--text); color: var(--bg); padding: 11px 17px; border-radius: 12px;
  box-shadow: var(--shadow-2); font-weight: 550; font-size: 14px;
  animation: rise .25s ease; max-width: 100%;
}
.toast-success { background: var(--ok); color: #fff; }
.toast-error { background: var(--neg); color: #fff; }
.toast-warn { background: var(--warn); color: #fff; }
.toast.out { opacity: 0; transition: opacity .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10, 14, 20, .45);
  display: none; z-index: 150;
  align-items: flex-start; justify-content: center;
  padding: 5vh 16px 16px; overflow-y: auto;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-2);
  width: 100%; max-width: 440px; animation: rise .22s ease; margin-bottom: 40px;
}
.modal-wide { max-width: 620px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px 18px 4px; }
.modal-head h3 { font-size: 17px; }
.modal-body { padding: 12px 18px; max-height: 70vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 10px 18px 16px; flex-wrap: wrap; }

/* page head */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: var(--gap); }
.page-head h2 { font-size: 22px; }
.page-sub { color: var(--muted); font-size: 13.5px; margin: 0; }
.page-inline { margin: -8px 0 14px; }

/* quickbar / dumper */
.dumper { display: flex; gap: 9px; }
.dumper input { flex: 1; padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.quickbar { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* onboarding */
.onb { padding: 4px 0; }
.onb-steps { display: flex; gap: 6px; margin-bottom: 14px; }
.onb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ring-track); }
.onb-dot.on { background: var(--accent); }
.onb-list { margin: 8px 0 12px; padding-left: 2px; list-style: none; }
.onb-list li { padding: 4px 0; }
.onb-choice { margin-top: 14px; }
.pg { font-weight: 550; }

/* help */
.help-grid { display: grid; grid-template-columns: 290px 1fr; gap: var(--gap); align-items: start; }
.help-nav .list { margin-top: 10px; }
.help-article h3 { font-size: 18px; }
.gloss-list div { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.dl-inline { margin: 0; }
.dl-inline dt { font-weight: 700; }
.dl-inline dd { margin: 0 0 8px; color: var(--muted); }
.gloss-list dt { font-weight: 700; display: inline; }
.gloss-list dd { display: inline; margin: 0 0 8px 6px; color: var(--muted); }
.gloss-list div { display: block; }

/* brain dump */
.dump-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--border); }
.dump-row span:first-child { flex: 1; }

/* day detail */
.day-detail h4 { font-size: 16px; }

/* badges */
.badge { display: flex; gap: 14px; align-items: center; }
.badge-icon { font-size: 26px; }
.badge-icon.small { font-size: 20px; }

/* print */
@media print {
  .sidebar, .nav-toggle, .btn-row, .qa-row, .tabs, .toasts, .modal-overlay { display: none !important; }
  .main { margin: 0; padding: 0; max-width: none; }
  body { background: #fff; }
}
</style>
<style>/* MindFlow — responsive behavior (360 → 1440px) */

/* laptops and smaller desktops */
@media (max-width: 1024px) {
  .main { max-width: none; }
  .grids-3 { grid-template-columns: repeat(2, 1fr); }
  .hero-num { font-size: 34px; }
}

/* tablets */
@media (max-width: 860px) {
  .sidebar { transform: translateX(-105%); box-shadow: var(--shadow-2); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding-top: 62px; }
  .nav-toggle { display: inline-grid; background: var(--surface); border: 1px solid var(--border); color: var(--text); }

<div id="app"></div>
<noscript><p style="padding:30px;font-family:sans-serif">MindFlow Budget Planner needs JavaScript. Please enable it and reload.</p></noscript>

<script>/* ============================================================
   MindFlow Budget Planner — core utilities
   Money (integer cents), dates (local, string-based), ids, events
   ============================================================ */
'use strict';
window.MF = { version: '1.1.1', schemaVersion: 2 };

(function () {
  const MF = window.MF;

  /* ---------- IDs ---------- */
  MF.uid = function (prefix) {
    let rnd = '';
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint8Array(8); crypto.getRandomValues(a);
      a.forEach(b => rnd += b.toString(16).padStart(2, '0'));
    } else {
      rnd = Math.random().toString(16).slice(2) + Date.now().toString(16);
    }
    return (prefix || 'id') + '_' + rnd.slice(0, 12);
  };

  /* ---------- Events (tiny pub/sub) ---------- */
  const listeners = {};
  MF.on = function (ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); };
  MF.emit = function (ev, data) {
    (listeners[ev] || []).slice().forEach(fn => { try { fn(data); } catch (e) { console.error('listener error', ev, e); } });
    (listeners['*'] || []).slice().forEach(fn => { try { fn(ev, data); } catch (e) { console.error('listener error *', e); } });
  };

  /* ---------- Money: all amounts are integer cents ---------- */
  MF.money = {
    parse(str) {
      if (typeof str === 'number') return Number.isFinite(str) && Number.isSafeInteger(Math.round(str * 100)) ? Math.round(str * 100) : null;
      if (str == null) return null;
      let s = String(str).trim().replace(/[\s\u00a0\u202f]/g, '').replace(/[$€£¥₹₨]/g, '');
      if (!s) return null;
      let negative = false;
      if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
      if (s[0] === '-' || s[0] === '+') { if (negative) return null; negative = s[0] === '-'; s = s.slice(1); }
      if (!/^\d[\d.,]*$/.test(s)) return null;
      const comma = s.lastIndexOf(','), dot = s.lastIndexOf('.');
      if (comma >= 0 && dot >= 0) {
        const decimal = comma > dot ? ',' : '.';
        const grouping = decimal === ',' ? '.' : ',';
        const parts = s.split(decimal);
        if (parts.length !== 2 || !/^\d{1,2}$/.test(parts[1])) return null;
        const groups = parts[0].split(grouping);
        if (!/^\d{1,3}$/.test(groups[0]) || groups.slice(1).some(g => !/^\d{3}$/.test(g))) return null;
        s = groups.join('') + '.' + parts[1];
      } else if (comma >= 0 || dot >= 0) {
        const separator = comma >= 0 ? ',' : '.';
        const parts = s.split(separator);
        if (parts.length === 2 && /^\d{1,2}$/.test(parts[1])) s = parts[0] + '.' + parts[1];
        else if (parts.length > 1 && /^\d{1,3}$/.test(parts[0]) && parts.slice(1).every(g => /^\d{3}$/.test(g))) s = parts.join('');
        else return null;
      }
      const cents = Math.round(Number(s) * 100);
      return Number.isSafeInteger(cents) ? (negative ? -cents : cents) : null;
    },
    fmt(cents, opts) {
      const cur = (opts && opts.currency) || (window.MF.store ? MF.store.settings().currency : null) || 'USD';
      try {
        return new Intl.NumberFormat(undefined, Object.assign({
          style: 'currency', currency: cur,
          minimumFractionDigits: 2, maximumFractionDigits: 2
        }, opts && opts.intl || {})).format((cents || 0) / 100);
      } catch (e) {
        return (cur === 'USD' ? '$' : cur + ' ') + ((cents || 0) / 100).toFixed(2);
      }
    },
    c(x) { return Math.round(x); } // clamp/cast helper
  };

  /* ---------- Dates: local, no timezone traps ---------- */
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  MF.dates = {
    today() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },
    parse(str) { // 'YYYY-MM-DD' -> Date at local midnight
      if (!str) return null;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str));
      if (!m) return null;
      const d = new Date(0);
      d.setHours(0, 0, 0, 0);
      d.setFullYear(+m[1], +m[2] - 1, +m[3]);
      return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3] ? d : null;
    },
    toStr(d) {
      if (!d) return null;
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },
    addDays(str, n) {
      const d = MF.dates.parse(str);
      d.setDate(d.getDate() + n);
      return MF.dates.toStr(d);
    },
    daysBetween(a, b) {
      const da = MF.dates.parse(a), db = MF.dates.parse(b);
      return Math.round((db - da) / 86400000);
    },
    // Month-end aware: Jan 31 + 1 month = Feb 28/29 (clamped)
    addMonths(str, n) {
      let d = MF.dates.parse(str); if (!d) return null;
      const day = d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() + n);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
      return MF.dates.toStr(d);
    },
    // Anchor-preserving month step: keeps the ORIGINAL day-of-month so a
    // Jan-31 schedule goes Jan 31 → Feb 28/29 → Mar 31 → Apr 30 (the day
    // never "shrinks" permanently because a clamped month is not used as the
    // new anchor). anchorDay is 1-based; n may be 0 or negative.
    addMonthsAnchored(str, anchorDay, n) {
      const d = MF.dates.parse(str); if (!d) return null;
      const t = d.getFullYear() * 12 + d.getMonth() + n;
      const y = Math.floor(t / 12), m = t - y * 12;
      const day = Math.min(Math.max(1, anchorDay), MF.dates.daysInMonth(y, m));
      return MF.dates.toStr(new Date(y, m, day));
    },
    daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }, // m: 0-based
    weekday(str) { return MF.dates.parse(str).getDay(); },
    fmtHuman(str, opts) {
      const st = window.MF.store ? MF.store.settings() : (window.MF.state && MF.state.settings ? MF.state.settings : {});
      if (str == null) return '—';
      const d = MF.dates.parse(str); if (!d) return str;
      const style = (opts && opts.style) || st.dateFormat || 'MDY';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      let s;
      if (style === 'DMY') s = dd + '/' + mm + '/' + yyyy;
      else if (style === 'YMD') s = yyyy + '-' + mm + '-' + dd;
      else s = mm + '/' + dd + '/' + yyyy;
      if (opts && opts.long) s += ' · ' + DAYS[d.getDay()];
      return s;
    },
    monthOf(str) { return str ? str.slice(0, 7) : null; },
    monthName(m) { return MONTH_NAMES[((m % 12) + 12) % 12]; },
    fmtRelative(str) {
      const n = MF.dates.daysBetween(MF.dates.today(), str);
      if (n === 0) return 'Today';
      if (n === 1) return 'Tomorrow';
      if (n === -1) return 'Yesterday';
      if (n > 1) return 'In ' + n + ' days';
      return Math.abs(n) + ' days ago';
    }
  };

  /* ---------- Misc helpers ---------- */
  MF.debounce = function (fn, ms) {
    let t; return function () { clearTimeout(t); const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms || 200); };
  };
  MF.escapeHtml = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  MF.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  MF.sum = arr => arr.reduce((a, b) => a + (b || 0), 0);
  MF.byField = (arr, f) => { const m = Object.create(null); (arr || []).forEach(x => { m[x[f]] = x; }); return m; };
  MF.deepClone = o => JSON.parse(JSON.stringify(o));
})();
</script>
<script>/* ============================================================
   MindFlow — storage layer (persistence, schema, migrations)
   Local-first. Swappable: replace _saveWithBackend for cloud sync.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const KEY = 'mindflow-data-v1';
  const SPEND_LIMIT = 30;
  const SPEND_LIMIT_MESSAGE = 'You used 30/30 spends. For Full Version, buy it on Etsy.';

  function rememberSpends(data, previousUsage = 0) {
    const existing = data.transactions.filter(t => t && t.type === 'expense' &&
      !(data.meta.demo === true && /^txn_d(?:[1-9]|1[0-2])$/.test(t.id))).length;
    const saved = data.meta.demoSpendsUsed;
    data.meta.demoSpendsUsed = Math.max(previousUsage, existing, Number.isSafeInteger(saved) ? saved : 0);
  }

  function spendsUsed() { return (cache || load()).meta.demoSpendsUsed || 0; }

  MF.spendDemo = {
    message: SPEND_LIMIT_MESSAGE,
    atLimit() { return spendsUsed() >= SPEND_LIMIT; },
    requireSlot() {
      if (spendsUsed() >= SPEND_LIMIT) throw new Error(SPEND_LIMIT_MESSAGE);
    },
    useSlot() {
      this.requireSlot();
      cache.meta.demoSpendsUsed = spendsUsed() + 1;
    }
  };

  function defaultCategories() {
    const defs = [
      ['Groceries', '#2f9e6e'], ['Dining', '#e07a5f'], ['Transportation', '#4c8fd6'],
      ['Shopping', '#b56cc8'], ['Entertainment', '#3aa6a6'], ['Healthcare', '#d6473f'],
      ['Personal', '#8a79d9'], ['Household', '#c9973a'], ['Utilities', '#5b8a72'],
      ['Income', '#2f9e6e'], ['Debt Payment', '#d6473f'], ['Other', '#8a8f98']
    ];
    return defs.map(x => ({ id: 'cat_' + x[0].toLowerCase().replace(/\s+/g, ''), name: x[0], color: x[1], system: true }));
  }

  function defaultSettings() {
    return {
      name: '', plannerName: 'My Budget Planner', currency: 'USD', dateFormat: 'MDY',
      weekStart: 0, theme: 'light', accent: 'teal', density: 'comfortable', mode: 'full',
      dashboardCards: { balance: true, sts: true, upcoming: true, payday: true, savings: true, debt: true, recent: true, spendingOverview: true, monthSummary: true, rightNow: true },
      sts: { includeExpectedIncome: true, excludeSavingsAccounts: true, subtractPlannedSavings: true, subtractDebtPayments: true, excludeAutoReserved: true, bufferCents: 0 },
      notifications: { upcomingBills: true, overdueBills: true, payday: true, goalProgress: true, budgetWarnings: true },
      defaultAccountId: null,
      onboardingComplete: false, demoMode: false,
      incomeSchedule: 'monthly', paydayAdjust: 'after' // 'none'|'before'|'after'
    };
  }

  function blankData() {
    return {
      meta: { schemaVersion: MF.schemaVersion, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() },
      settings: defaultSettings(),
      accounts: [],
      transactions: [],
      bills: [],
      incomeSources: [],
      paychecks: [],
      goals: [],
      debts: [],
      envelopes: [],
      categories: defaultCategories(),
      milestones: [],
      brainDump: [],
      dayNotes: {}
    };
  }

  /* ---------- safety ---------- */
  function validShape(d) {
    return d && typeof d === 'object' && d.settings && Array.isArray(d.accounts) && Array.isArray(d.transactions)
      && d.meta && typeof d.meta.schemaVersion === 'number';
  }

  /* ---------- migrations (forward-only, versioned) ---------- */
  const migrations = [
    // v1: baseline
    { to: 1, fn(d) { return d; } },
    // v2: set-aside reserves became properly accounted earmarks — clamp any
    // reserved amount to its bill, and give tracked bills an auditable
    // reserveLog. No data is dropped; older files keep working unchanged.
    { to: 2, fn(d) {
        (d.bills || []).forEach(b => {
          if (b.reservedCents == null) b.reservedCents = 0;
          else if (b.amountCents != null && Math.abs(b.reservedCents) > b.amountCents) b.reservedCents = Math.max(0, Math.min(b.reservedCents, b.amountCents));
          if (b.autoSetAside && !Array.isArray(b.reserveLog)) b.reserveLog = [];
        });
        return d;
      } }
  ];
  function migrate(d) {
    let v = d.meta.schemaVersion || 0;
    for (const m of migrations) {
      if (m.to > v) { d = m.fn(d); d.meta.schemaVersion = m.to; v = m.to; }
    }
    return d;
  }

  let cache = null;
  let last = JSON.stringify(blankData());

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { console.error('localStorage inaccessible', e); }
    if (!raw) { cache = blankData(); return cache; }
    try {
      const p = JSON.parse(raw);
      if (!validShape(p)) throw new Error('Corrupted data shape');
      cache = migrate(p);
      mergeMissingDefaults(cache);
      rememberSpends(cache);
    } catch (e) {
      console.error('Failed to load data, starting fresh (data kept in DOM only):', e);
      cache = blankData();
    }
    return cache;
  }

  function mergeMissingDefaults(d) {
    const def = defaultSettings();
    for (const k in def) {
      if (d.settings[k] === undefined) {
        if (typeof def[k] === 'object' && def[k] !== null) {
          d.settings[k] = Object.assign({}, def[k], d.settings[k] || {});
        } else d.settings[k] = def[k];
      }
    }
    if (!Array.isArray(d.categories) || !d.categories.length) d.categories = defaultCategories();
  }

  function backupRaw() { // rolling safety snapshot for critical ops
    try {
      const prev = localStorage.getItem(KEY);
      if (prev) localStorage.setItem(KEY + '.prev', prev);
    } catch (e) { /* non-fatal */ }
  }
  /* Full, dedicated pre-restore recovery copy — unlike '.prev' it survives
     later saves, so a bad import can always be manually recovered. */
  function recoverySnapshot() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) localStorage.setItem(KEY + '.recover', raw);
    } catch (e) { /* non-fatal */ }
  }

  let saveTimer = null;
  let storageWarned = false;
  function save() {
    if (!cache) return true;
    cache.meta.updatedAt = new Date().toISOString();
    const nowData = JSON.stringify(cache);
    if (nowData === last) return true; // identical payload already persisted
    try {
      backupRaw();
      localStorage.setItem(KEY, nowData);
    } catch (e) {
      /* The write FAILED: `last` must stay untouched so the next save()
         retries this exact payload instead of assuming it was persisted.
         (Private-mode browsers, expired storage permissions and quota
         errors all land here.) */
      console.error('Save failed', e);
      if (!storageWarned) {
        storageWarned = true;
        if (MF.ui && MF.ui.toast) MF.ui.toast('⚠️ Your last change could not be saved — browser storage may be full or blocked. Data is still on screen; export a backup from Settings → Backup & Data.', 'error');
        setTimeout(() => { storageWarned = false; }, 15000);
      }
      MF.emit('data:changed');
      return false;
    }
    storageWarned = false;
    last = nowData; // marked persisted ONLY after a successful write
    MF.emit('data:changed');
    return true;
  }
  MF.scheduleSave = save;

  /* ---------- public API ---------- */
  MF.storage = {
    key: KEY,
    load,
    save,
    recoverySnapshot,
    get data() { return cache || (cache = load()); },
    exportJSON() { return JSON.stringify(cache, null, 2); },
    importJSON(text) {
      const p = JSON.parse(text);
      if (!validShape(p)) throw new Error('This file is not a valid MindFlow backup.');
      const incoming = migrate(p); mergeMissingDefaults(incoming);
      rememberSpends(incoming, spendsUsed());
      recoverySnapshot();
      backupRaw();
      cache = incoming; last = '';
      save();
      MF.emit('data:replaced');
      return cache;
    },
    reset() {
      backupRaw();
      const previousUsage = spendsUsed();
      cache = blankData(); last = '';
      rememberSpends(cache, previousUsage);
      save();
      MF.emit('data:replaced');
    },
    /* Future cloud sync hook: implement upload/download here. */
    _backend: null // e.g. { download(): Promise<string>, upload(json): Promise }
  };
})();
</script>
<script>/* ============================================================
   MindFlow — state layer (CRUD over storage data + selectors)
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;

  function arr(name) { const d = MF.storage.data; if (!Array.isArray(d[name])) d[name] = []; return d[name]; }

  function upsert(name, item) {
    const list = arr(name);
    if (!item.id) item.id = MF.uid(name.slice(0, 4));
    const i = list.findIndex(x => x.id === item.id);
    if (i >= 0) list[i] = Object.assign({}, list[i], item);
    else list.push(item);
    MF.storage.save();
    return i >= 0 ? list[i] : item;
  }
  function remove(name, id) {
    const list = arr(name); const i = list.findIndex(x => x.id === id);
    if (i < 0) return false;
    list.splice(i, 1);
    MF.storage.save();
    return true;
  }
  function find(name, id) { return arr(name).find(x => x.id === id) || null; }

  MF.store = {
    upsert, remove, find,
    list(name) { return arr(name); },

    /* Categories */
    categories() { return arr('categories'); },
    category(id) { return find('categories', id) || { id: 'cat_other', name: 'Other', color: '#8a8f98' }; },
    addCategory(name, color) {
      const c = { id: 'cat_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '') + '_' + MF.uid('').slice(0, 4), name, color: color || '#5b8a72', system: false };
      arr('categories').push(c); MF.storage.save(); return c;
    },
    deleteCategory(id) {
      const used = arr('transactions').some(t => t.categoryId === id) || arr('bills').some(b => b.categoryId === id);
      if (used) { MF.ui && MF.ui.toast && MF.ui.toast('Category is in use by transactions or bills. You can rename it instead.', 'warn'); return false; }
      remove('categories', id); return true;
    },

    /* Accounts */
    accountBalance(a) { return MF.calc.accountBalance(a.id); },
    accounts(activeOnly) {
      const list = arr('accounts');
      return activeOnly ? list.filter(a => !a.archived) : list.slice();
    },
    account(id) { return find('accounts', id); },

    /* Bankruptcy-safe defaults */
    defaultAccount() {
      const s = MF.storage.data.settings;
      let a = s.defaultAccountId ? find('accounts', s.defaultAccountId) : null;
      if (!a) a = arr('accounts').find(x => !x.archived && x.type === 'checking');
      if (!a) a = arr('accounts').find(x => !x.archived);
      return a || null;
    },

    settings() { return MF.storage.data.settings; },
    setSetting(key, val) { MF.storage.data.settings[key] = val; MF.storage.save(); },
  };
})();
</script>
<script>/* ============================================================
   MindFlow — FINANCIAL CALCULATION ENGINE (single source of truth)
   All currency math in integer cents. All dates are 'YYYY-MM-DD'.

   Documented rules:
   - Account balance = starting balance + every transaction's effect
     on that account. Transfers move money between accounts only.
   - Transfers are NEVER income/expense in reports.
   - Credit-card purchases affect the card's balance (negative = owed).
     Paying a card from another account = transfer -> not an expense
     (prevents double-counting).
   - Auto set-aside reserves reduce the amount still owed on a due
     date; reserved money is subtracted exactly once in Safe-to-Spend.
   - Debt interest: daily rate = APR/365 on outstanding balance,
     accrued between payments (actual days). 0% APR adds no interest.
     Payoff dates are projections, not guarantees.
   ============================================================ */
'use strict';
(function () {
  const MF = window.MF;
  const D = MF.dates;
  function mk(y, m, day) { // m: 0-based
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(Math.min(day, D.daysInMonth(y, m))).padStart(2, '0');
  }

  /* ---------------- Accounts ---------------- */
  function accountBalance(accountId) {
    const a = MF.store.account(accountId); if (!a) return 0;
    let b = a.startingCents || 0;
    for (const t of MF.store.list('transactions')) {
      if (t.accountId === accountId) b += (t.type === 'income' ? +t.amountCents : -t.amountCents);
      if (t.toAccountId === accountId) b += t.amountCents;
    }
    return b;
  }
  function spendableAccounts() {
    const st = MF.store.settings();
    return MF.store.accounts(true).filter(a => {
      if (a.type === 'credit') return false;                       // credit limits are not money
      if (a.type === 'savings' && st.sts.excludeSavingsAccounts !== false) return false;
      return true;
    });
  }
  function totalSpendable() {
    return spendableAccounts().reduce((s, a) => s + accountBalance(a.id), 0);
  }
  /* Net worth (Assets − Liabilities, documented formula):
     Assets   = Σ balance of every active account
                + Σ savedCents of every savings goal (goal money is held
                  virtually: a goal contribution transfers the amount out of a
                  real account into the virtual 'goal:<id>' bucket, which has
                  no account object — so the balance is carried on the goal
                  itself and must be added here exactly once).
     Set-aside reserves on bills are NOT added: that money never leaves its
     account, so it is already counted once via the account balances.
     Liabilities = Σ balanceCents of every tracked debt still owed
     (paid-off debts contribute 0; a balance ≤ 0 contributes 0).
     Double-count guards:
       • A credit ACCOUNT already carries its owed balance as a negative
         account balance — these are counted as liabilities via the ledger.
       • A debt record EXPLICITLY linked (debt.accountId) to an active credit
         account is skipped: the explicit link is the only way — never a
         name/amount guess — the data model can express "this tracked debt is
         that credit account's liability". Unlinked tracked debts are always
         subtracted. */
  function trackedDebtLiabilitiesCents() {
    const active = {};
    for (const a of MF.store.accounts(true)) active[a.id] = a;
    let total = 0;
    for (const d of MF.store.list('debts')) {
      if (d.paidOff) continue;
      const bal = d.balanceCents || 0;
      if (bal <= 0) continue;
      const link = d.accountId ? active[d.accountId] : null;
      if (link && link.type === 'credit') continue; // liability already inside that credit account's negative balance
      total += bal;
    }
    return total;
  }
  function totalNetWorth() {
    const goals = MF.sum(MF.store.list('goals').map(g => g.savedCents || 0));
    return MF.store.accounts(true).reduce((s, a) => s + accountBalance(a.id), 0)
      + goals - trackedDebtLiabilitiesCents();
  }

  /* ---------------- Recurrence (month-end + leap aware) ---------------- */
  const WEEK_STEP = { weekly: 7, biweekly: 14, every4weeks: 28 };
  const MONTH_STEP = { monthly: 1, bimonthly: 2, quarterly: 3, semiannual: 6, yearly: 12 };

  function nextAfter(from, stepFn, payFrom) {
    // base: skip every occurrence up to "today"; when paying forward (payFrom), also
    // skip every occurrence up to and including the paid due date
    const base = payFrom && payFrom > D.today() ? payFrom : D.today();
    let d = from, guard = 0;
    while (d <= base && guard++ < 4500) d = stepFn(d);
    return guard > 4500 ? null : d;
  }
  function nextBillDate(bill, from) {
    const f = bill.frequency || 'monthly';
    let d = from || bill.nextDue || bill.firstDue;
    if (!d) return null;
    if (f === 'once') return d >= D.today() ? d : null;
    if (WEEK_STEP[f]) return nextAfter(d, x => D.addDays(x, WEEK_STEP[f]), from);
    if (f === 'custom') { const n = Math.max(1, bill.customIntervalDays || 30); return nextAfter(d, x => D.addDays(x, n), from); }
    if (MONTH_STEP[f]) {
      // anchor-preserving: keep the ORIGINAL day-of-month (bill.firstDue, or
      // the current date as fallback for legacy records) so Jan 31 →
      // Feb 28/29 → Mar 31 — never permanently shrinks to the clamped day
      const anchorDay = +((bill.firstDue || d)).slice(8, 10);
      const base = from && from > D.today() ? from : D.today();
      for (let k = MONTH_STEP[f]; k <= 12 * 30; k += MONTH_STEP[f]) {
        const cand = D.addMonthsAnchored(d, anchorDay, k);
        if (cand === null || cand === undefined) return null;
        if (cand > base) return cand;
      }
      return null;
    }
    if (f === 'twicemonthly') {
      const d1 = Math.min(28, Math.max(1, bill.paymentDay1 || 1));
      const d2 = Math.max(d1 + 1, Math.min(28, bill.paymentDay2 || d1 + 14));
      const base = (from && from > D.today()) ? from : D.today();
      const y = +d.slice(0, 4), m = +d.slice(5, 7) - 1;
      for (let k = 0; k < 500; k++) {
        const y2 = m + k > 11 ? y + Math.floor((m + k) / 12) : y;
        const m2 = (m + k) % 12;
        const cands = [Math.min(d1, D.daysInMonth(y2, m2)), Math.min(d2, D.daysInMonth(y2, m2))]
          .map(dd => mk(y2, m2, dd)).sort();
        for (const c of cands) if (c > d && c >= base) return c;
      }
      return null;
    }
    const base = (from && from > D.today()) ? from : D.today();
    return d > base ? d : null;
  }

  function isBillPaidFor(bill, dueDate) {
    return (bill.paidHistory || []).some(h => h.dueDate === dueDate);
  }
  function billRemainingForDueDate(bill) {
    let amt = bill.amountCents || 0;
    if (bill.autoSetAside) amt = Math.max(0, amt - (bill.reservedCents || 0));
    return amt;
  }

  /* occurrences of a recurring bill within [from..to]; skips already-paid dues */
  function billOccurrencesBetween(bill, from, to) {
    const out = [];
    const f = bill.frequency || 'monthly';
    const first = bill.firstDue; if (!first) return out;
    const pushIf = d => {
      if (d >= from && d <= to && !isBillPaidFor(bill, d) && (!bill.endDate || d <= bill.endDate)) out.push(d);
    };

    if (f === 'once') { pushIf(first); return out; }

    if (MONTH_STEP[f]) {
      // anchor-based stepping keeps Feb 29 and month-end days alive
      const months = MONTH_STEP[f];
      const anchorDay = +first.slice(8, 10);
      const y = +first.slice(0, 4), m = +first.slice(5, 7) - 1;
      for (let k = 0; k < 120; k++) {
        const yr = y + Math.floor((m + k * months) / 12);
        const mo = (m + k * months) % 12;
        const d2 = mk(yr, mo, Math.min(anchorDay, D.daysInMonth(yr, mo)));
        if (d2 > to) break;
        pushIf(d2);
      }
      return out;
    }

    if (f === 'twicemonthly') {
      let d = first;
      for (let k = 0; k < 500 && d; k++) {
        pushIf(d);
        d = forceNextTwice(bill, d);
      }
      return out;
    }

    const step = WEEK_STEP[f] || Math.max(1, bill.customIntervalDays || 30);
    let d = first;
    for (let k = 0; k < 500 && d <= to; k++) {
      pushIf(d);
      d = D.addDays(d, step);
    }
    return out;
  }
  function forceNextTwice(bill, d) {
    const d1 = Math.min(28, Math.max(1, bill.paymentDay1 || 1));
    const d2 = Math.max(d1 + 1, Math.min(28, bill.paymentDay2 || d1 + 14));
    const y = +d.slice(0, 4), m = +d.slice(5, 7) - 1;
    for (let k = 0; k < 500; k++) {
      const y2 = m + k > 11 ? y + Math.floor((m + k) / 12) : y;
      const m2 = (m + k) % 12;
      const cands = [Math.min(d1, D.daysInMonth(y2, m2)), Math.min(d2, D.daysInMonth(y2, m2))]
        .map(dd => mk(y2, m2, dd)).sort();
      for (const c of cands) if (c > d) return c;
    }
    return null;
  }

  /* ---------------- Bills due in a window ----------------
     billsDueBetween stocks the NEXT due occurrence only (used by the
     "upcoming bills" UI cards). Safe-to-Spend uses billsUnpaidBetween, which
     walks every unpaid occurrence (OVERDUE ones included) inside the window. */
  function billsDueBetween(from, to) {
    const out = [];
    for (const b of MF.store.list('bills').filter(b => !b.archived)) {
      const due = b.nextDue;
      if (due && due >= from && due <= to && !isBillPaidFor(b, due)) {
        out.push({ bill: b, date: due, remaining: billRemainingForDueDate(b) });
      }
    }
    out.sort((a, b2) => a.date < b2.date ? -1 : 1);
    return out;
  }
  /* Every unpaid occurrence in [lookbackStart..to] — overdue occurrences included,
     capped at a 62-day lookback so an old never-paid recurring bill does not
     produce an unbounded subtraction (the Bills page still flags it as overdue). */
  function billsUnpaidBetween(from, to) {
    const lookbackStart = D.addDays(from, -62);
    const out = [];
    for (const b of MF.store.list('bills').filter(b => !b.archived)) {
      for (const due of billOccurrencesBetween(b, lookbackStart, to)) {
        out.push({ bill: b, date: due, remaining: b.amountCents || 0, overdue: due < from });
      }
    }
    out.sort((a, b2) => a.date < b2.date ? -1 : 1);
    return out;
  }

  function markBillPaid(bill, dueDate, paidAccount, payDate) {
    const b = payDate || D.today();
    if (isBillPaidFor(bill, dueDate)) return { duplicate: true, bill }; // idempotent guard
    const cardAcct = bill.creditCardAccountId && MF.store.account(bill.creditCardAccountId);
    let txn;
    if (cardAcct && cardAcct.type === 'credit') {
      // paying a credit card = transfer between accounts, NOT an expense
      txn = MF.tx.create({
        type: 'transfer', amountCents: bill.amountCents, date: b,
        description: (bill.name || 'Bill') + ' — card payment',
        categoryId: bill.categoryId, accountId: paidAccount,
        toAccountId: cardAcct.id, billId: bill.id, dueDate
      });
    } else {
      txn = MF.tx.create({
        type: 'expense', amountCents: bill.amountCents, date: b,
        description: bill.name || 'Bill', categoryId: bill.categoryId,
        accountId: paidAccount, billId: bill.id, dueDate
      });
    }
    (bill.paidHistory = bill.paidHistory || []).push({
      dueDate, paidDate: b, amountCents: bill.amountCents, transactionId: txn.id
    });
    /* Set-aside accounting: the reserve is an earmark on money that physically
       stayed in the paying account, so the payment expenses the FULL amount
       from that account and the earmark is consumed (never moved twice).
       reserveLog keeps an auditable trail of every reserve operation. */
    const reservedUsed = Math.min(bill.reservedCents || 0, bill.amountCents || 0);
    if (bill.reservedCents) bill.reservedCents = Math.max(0, bill.reservedCents - bill.amountCents);
    if (reservedUsed > 0) {
      (bill.reserveLog = bill.reserveLog || []).push({ date: b, action: 'used by payment', amountCents: reservedUsed, dueDate });
    }
    bill.nextDue = nextBillDate(bill, dueDate);
    if (bill.frequency === 'once') bill.archived = true;
    MF.storage.save();
    return { bill, transaction: txn };
  }
  function unmarkBillPaid(bill, dueDate) {
    const list = bill.paidHistory || [];
    const i = list.findIndex(h => h.dueDate === dueDate);
    if (i < 0) return false;
    const h = list[i];
    const txn = h.transactionId ? MF.tx.find(h.transactionId) : null;
    if (txn) {
      // remove() runs releaseBillPayment for the linked tx while the history
      // entry is still in place: that release splices THIS entry and restores
      // its reserve. Afterwards, splice by IDENTITY (not index) so an
      // unrelated payment entry is never dropped when several exist.
      MF.tx.remove(txn.id, true);
    }
    const j = list.indexOf(h);
    if (j >= 0) list.splice(j, 1);
    restoreBillReserve(bill, dueDate); // idempotent: release above may have done it already
    bill.nextDue = dueDate;
    if (bill.frequency === 'once' && !list.length) bill.archived = false;
    MF.storage.save();
    return true;
  }

  /* ---------- linked-record sync ----------
     Called by transaction edit/delete so bills, debts and savings goals stay
     consistent when their payment transactions change. These functions do
     NOT touch the transaction itself — the caller owns that lifecycle. */
  /* ---------- reserve restoration (payment removed/edited) ----------
     When a bill payment created an expense, the reserve that covered it was
     consumed: the consumed amount is written to reserveLog as an
     { action:'used by payment', amountCents, dueDate } entry. This helper
     restores exactly that consumed amount — by removing the log entry — so
     repeating the operation is a no-op (idempotent, nothing can be restored
     twice), and the standing invariant reservedCents ≤ amountCents holds. */
  function restoreBillReserve(bill, dueDate) {
    if (!bill || !dueDate) return 0;
    const log = bill.reserveLog || [];
    const i = log.findIndex(e => e.action === 'used by payment' && e.dueDate === dueDate);
    if (i < 0) return 0; // nothing was consumed for this payment (or already restored)
    const billAmt = Math.max(0, bill.amountCents || 0);
    const back = Math.min(Math.max(0, log[i].amountCents || 0), billAmt);
    log.splice(i, 1);
    bill.reservedCents = Math.min(Math.max(0, bill.reservedCents || 0) + back, billAmt);
    if (back > 0) log.push({ date: D.today(), action: 'restored after payment removed', amountCents: back, dueDate });
    return back;
  }

  function releaseBillPayment(bill, dueDate) {
    if (!bill) return false;
    const list = bill.paidHistory || [];
    const i = list.findIndex(h => h.dueDate === dueDate);
    if (i < 0) return false;
    list.splice(i, 1);
    restoreBillReserve(bill, dueDate); // give the consumed earmark back
    // restore nextDue only if no still-later occurrence was paid since
    if (!list.some(h => h.dueDate >= dueDate)) bill.nextDue = dueDate;
    if (bill.frequency === 'once' && !list.length) bill.archived = false;
    MF.storage.save();
    return true;
  }
  function releaseDebtPayment(debt, dueDate, transactionId) {
    if (!debt) return false;
    const list = debt.paidHistory || [];
    const i = list.findIndex(h => transactionId ? h.transactionId === transactionId : h.dueDate === dueDate);
    if (i < 0) return false;
    const h = list[i];
    debt.balanceCents = (debt.balanceCents || 0) + (h.principalCents || 0);
    debt.totalInterestCents = Math.max(0, (debt.totalInterestCents || 0) - (h.interestCents || 0));
    list.splice(i, 1);
    if (debt.paidOff && (debt.balanceCents || 0) > 0) { debt.paidOff = false; delete debt.paidOffDate; }
    if (!list.some(h => h.dueDate >= dueDate)) debt.nextDue = dueDate || debt.nextDue;
    MF.storage.save();
    return true;
  }

  /* ---------------- Income ---------------- */
  function incomeOccurrences(src, from, to) {
    const out = [];
    if (src.paused || !D.parse(from) || !D.parse(to)) return out;
    const floor = from > D.today() ? from : D.today();
    if (floor > to) return out;
    const f = src.schedule || 'monthly';
    const received = new Set((src.receivedDates || []).map(x => adjustWeekend(x, src)));
    const seen = new Set();
    const push = date => {
      const adj = adjustWeekend(date, src);
      if (adj >= floor && adj <= to && !received.has(adj) && !seen.has(adj)) {
        seen.add(adj); out.push({ date: adj, amountCents: src.amountCents });
      }
    };
    if (f === 'irregular') {
      (src.expectedDates || []).filter(x => D.parse(x)).slice().sort().forEach(push);
      return out.sort((a, b) => a.date.localeCompare(b.date));
    }
    const anchor = src.nextPaydate || src.startDate;
    if (!D.parse(anchor)) return out;
    // Include either side of the window so weekend moves across its boundary survive.
    const nominalFrom = D.addDays(floor, -2), nominalTo = D.addDays(to, 2);
    if (WEEK_STEP[f] || f === 'custom') {
      const step = WEEK_STEP[f] || Math.max(1, Math.floor(src.customIntervalDays || 30));
      const offset = Math.max(0, Math.floor(D.daysBetween(anchor, nominalFrom) / step));
      for (let d = D.addDays(anchor, offset * step); d <= nominalTo; d = D.addDays(d, step)) push(d);
    } else if (MONTH_STEP[f]) {
      const anchorDay = +anchor.slice(8, 10), step = MONTH_STEP[f];
      const diff = (+nominalFrom.slice(0, 4) - +anchor.slice(0, 4)) * 12 + +nominalFrom.slice(5, 7) - +anchor.slice(5, 7);
      for (let i = Math.max(0, Math.floor(diff / step)); ; i++) {
        const d = D.addMonthsAnchored(anchor, anchorDay, i * step);
        if (d > nominalTo) break;
        push(d);
      }
    } else if (f === 'semimonthly' || f === 'twicemonthly') {
      const d1 = Math.min(28, Math.max(1, src.payday1 || 1));
      const d2 = Math.max(d1 + 1, Math.min(28, src.payday2 || d1 + 14));
      let month = (nominalFrom > anchor ? nominalFrom : anchor).slice(0, 7) + '-01';
      while (month <= nominalTo) {
        const y = +month.slice(0, 4), m = +month.slice(5, 7) - 1;
        for (const day of [d1, d2]) {
          const d = mk(y, m, Math.min(day, D.daysInMonth(y, m)));
          if (d >= anchor) push(d);
        }
        month = D.addMonths(month, 1);
      }
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  function adjustWeekend(dateStr, cfg) {
    const mode = (cfg && cfg.weekendAdjust) || MF.store.settings().paydayAdjust || 'none';
    if (mode === 'none' || !dateStr) return dateStr;
    const w = D.weekday(dateStr);
    if (w !== 0 && w !== 6) return dateStr;
    return mode === 'before' ? D.addDays(dateStr, w === 0 ? -2 : -1) : D.addDays(dateStr, w === 0 ? 1 : 2);
  }
  function paydaysBetween(from, to) {
    const out = [];
    for (const s of MF.store.list('incomeSources')) {
      for (const o of incomeOccurrences(s, from, to)) {
        out.push({ source: s, date: o.date, amountCents: o.amountCents || 0 });
      }
    }
    out.sort((a, b) => a.date < b.date ? -1 : 1);
    return out;
  }
  function nextPaydayAllSources() {
    const t = D.today();
    const list = paydaysBetween(t, D.addDays(t, 92));
    return list.length ? list[0].date : null;
  }

  /* ---------------- Safe To Spend ----------------
     The money you can freely spend between now and the next payday.

     Documented formula — every amount is counted exactly once:

     1. Money in your accounts = Σ balances of eligible accounts
        ('spendableAccounts' — credit accounts are limits, savings follow the
        exclusion setting), plus amounts of future-dated EXPENSES recorded on
        those accounts (that money is still physically there today), less the
        amounts of future-dated INCOME (refunds/pay recorded for a later date
        have not landed yet) — i.e. physical cash on hand.
     2. − Booked future spending INSIDE the window: every recorded future
        expense on an eligible account dated through the next payday.
        Expenses dated AFTER payday are NOT deducted here — they belong to
        the next period's spending window (the money has not left the
        account yet). Expenses recorded on excluded (savings/credit)
        accounts never appear. No double counting: a future-dated payment
        transaction linked to an UNPAID bill/debt occurrence inside the
        window is skipped, because that occurrence's own line below already
        carries it; if the occurrence is paid, the transaction is counted
        alone.
     3. Future-dated INCOME is already excluded in item 1 (it is shown in
        the breakdown for clarity with zero effect) — recorded income is
        never counted through the expected-income line either, so it can
        never be counted twice and never inflates Safe-to-Spend.
     4. Expected paychecks are displayed separately when enabled. They never
        increase Safe to Spend before the income has actually been received.
     5. − unpaid bill occurrences due through payday, OVERDUE occurrences
        included (lookback capped at 62 days). Each due occurrence subtracts
        the full bill amount — that is what will leave the account.
     6. − set-aside reserves on bills whose next occurrence is NOT in this
        window (that money is earmarked; for a bill IN the window the reserve
        is inside item 5's full amount, so it is never subtracted twice).
        Gated by the excludeAutoReserved setting ("Set-aside reserves count
        as covered").
     7. − debt minimum payments due before payday (not yet paid), overdue
        unpaid minimums included.
     8. − planned savings contributions prorated for the days to payday.
     9. − the user's optional buffer.

     Result is consistent with the ledger at every step.
  */
  function safeToSpend() {
    const st = MF.store.settings();
    const s = st.sts || {};
    const today = D.today();
    const payday = nextPaydayAllSources() || D.addDays(today, 30);
    const breakdown = { payday, asOf: today, parts: [] };
    const add = (label, cents, note, cls) => breakdown.parts.push({ label, cents, note, cls });

    function scheduledPaymentCoveredElsewhere(t) {
      /* A future-dated expense tx linked to a bill/debt occurrence that is
         still unpaid inside the window is covered by that occurrence's own
         deduction line (items 5/7) — the tx itself must not subtract it a
         second time. When the occurrence IS paid, the payment line is
         skipped instead and this tx stands alone. */
      if (t.billId && t.dueDate) {
        const b = MF.store.find('bills', t.billId);
        if (b && !isBillPaidFor(b, t.dueDate)) return true;
      }
      if (t.debtId && t.dueDate) {
        const d = MF.store.find('debts', t.debtId);
        if (d && !debtPaidFor(d, t.dueDate)) return true;
      }
      return false;
    }
    const accs = spendableAccounts();
    const accIds = new Set(accs.map(a => a.id));
    const allTx = MF.store.list('transactions');

    // Recorded spending/income dated in the future: the ledger already includes
    // both, but a future EXPENSE has not physically left the account yet, while
    // future INCOME has not landed yet. So: physical cash = ledger + future
    // expenses; then only future expenses INSIDE the spending window (through
    // payday) are deducted as their own line. Out-of-window expenses stay
    // undeducted (next period's commitments) and can never inflate the number,
    // because they are never added to spendable money either — a future
    // expense inside the window is added (cash on hand) and deducted (booked)
    // in the same pass, so the pair always nets out; excluded accounts never
    // appear.
    const futureExp = allTx.filter(t => t.type === 'expense' && t.date > today && accIds.has(t.accountId));
    const futureInc = allTx.filter(t => t.type === 'income' && t.date > today && accIds.has(t.accountId));
    const futureExpAll = MF.sum(futureExp.map(t => t.amountCents));
    const futureIncAll = MF.sum(futureInc.map(t => t.amountCents));

    const available = accs.reduce((t, a) => t + accountBalance(a.id), 0) + futureExpAll - futureIncAll;
    // available is the PHYSICAL cash on hand (future income not yet landed is
    // already excluded; future expenses still physically there are added back)
    const futureExpBooked = futureExp
      .filter(t => t.date <= payday)
      .filter(t => !scheduledPaymentCoveredElsewhere(t));
    const futureExpBookedAll = MF.sum(futureExpBooked.map(t => t.amountCents));
    let sts = available - futureExpBookedAll; // only in-window committed spending is deducted here
    breakdown.available = available;
    const availNote = accs.length + ' spendable account(s)' +
      (futureIncAll > 0 ? ' · excludes ' + MF.money.fmt(futureIncAll) + ' of income dated later (not received yet)' : '');
    add('Money in your accounts', available, availNote, 'pos');
    const laterAll = futureExpAll - futureExpBookedAll;
    if (futureExpBookedAll > 0) add('Booked future spending by payday', -futureExpBookedAll,
      futureExpBooked.length + ' transaction(s) recorded for later (items dated after payday belong to the next period and are not deducted)', 'neg');
    if (laterAll > 0) add('Later scheduled spending', 0, MF.money.fmt(laterAll) + ' is dated after payday — counted in the next period, not here', 'neg');

    // Expected pay is a separate preview, never cash available to spend now.
    breakdown.expectedIncome = MF.sum(paydaysBetween(today, payday)
      .filter(p => accIds.has(p.source.accountId))
      .map(p => Math.max(0, p.amountCents || 0)));
    breakdown.showExpectedIncome = s.includeExpectedIncome !== false;

    // unpaid bill occurrences through payday — overdue ones included
    const bills = billsUnpaidBetween(today, payday);
    let billTot = 0, billCount = 0;
    const fullyReserved = [];
    const seenDue = new Set();
    for (const x of bills) {
      const key = x.bill.id + '|' + x.date;
      if (seenDue.has(key)) continue; // paranoia guard: each occurrence exactly once
      seenDue.add(key);
      const amt = Math.max(0, x.bill.amountCents || 0);
      billTot += amt; billCount++;
      if ((x.bill.reservedCents || 0) >= amt) fullyReserved.push(x.bill.name);
    }
    if (billTot > 0) { sts -= billTot; add('Unpaid bills due by payday', -billTot, billCount + ' occurrence(s), overdue included', 'neg'); }
    breakdown.billsSkippedFullyReserved = fullyReserved;

    // money earmarked for bills that are NOT due in this window
    if (s.excludeAutoReserved !== false) {
      const inWindow = new Set(bills.map(x => x.bill.id));
      let reserved = 0, rBills = 0;
      for (const b of MF.store.list('bills')) {
        if (b.archived || !b.autoSetAside || !(b.reservedCents > 0)) continue;
        if (inWindow.has(b.id)) continue; // its money already counted inside the bill line
        reserved += Math.min(b.reservedCents, b.amountCents || 0);
        rBills++;
      }
      if (reserved > 0) { sts -= reserved; add('Money set aside for later bills', -reserved, rBills + ' reserve(s), not due before payday', 'neg'); }
    }

    if (s.subtractDebtPayments !== false) {
      // overdue unpaid minimums included (same rule as bills: never hide a
      // liability just because its due date has passed), capped by payday
      let tot = 0, n = 0;
      for (const d of MF.store.list('debts').filter(x => !x.paidOff)) {
        const nd = d.nextDue;
        if (nd && nd <= payday && !debtPaidFor(d, nd)) { tot += d.minPaymentCents || 0; n++; }
      }
      if (tot > 0) { sts -= tot; add('Debt payments due before payday', -tot, n + ' planned payment(s)', 'neg'); }
    }

    if (s.subtractPlannedSavings !== false) {
      const days = Math.max(1, D.daysBetween(today, payday));
      const active = MF.store.list('goals').filter(g => !g.paused && !g.completed && g.monthlyCents > 0);
      const prorated = MF.sum(active.map(g => Math.round(g.monthlyCents * Math.min(days, 30) / 30)));
      if (prorated > 0) {
        sts -= prorated;
        add('Planned savings contributions', -prorated, active.length + ' goal(s) prorated over ' + days + ' day(s)', 'neg');
      }
    }

    const buf = bufferCents();
    if (buf > 0) { sts -= buf; add('Buffer / reserved', -buf, 'your safety cushion', 'neg'); }

    breakdown.safeToSpend = sts;
    breakdown.daysLeft = D.daysBetween(today, payday);
    breakdown.daily = Math.floor(sts / Math.max(1, breakdown.daysLeft));
    return breakdown;
  }
  function bufferCents() {
    const s = MF.store.settings().sts;
    return (s && s.bufferCents) || 0;
  }

  /* ---------------- Savings goals ---------------- */
  function goalEta(g) {
    if (!g || g.savedCents >= g.targetCents) return null;
    const perM = g.monthlyCents || 0; if (!perM) return null;
    const months = Math.ceil((g.targetCents - g.savedCents) / perM);
    return D.addMonths(D.today(), months);
  }

  /* ---------------- Debt engine ---------------- */
  const BP = 10000; // apr in basis points: 1999 = 19.99%
  function dailyRate(aprBp) { return (aprBp || 0) / BP / 365; }
  function debtPaidFor(d, dueDate) { return (d.paidHistory || []).some(h => h.dueDate === dueDate); }
  function debtPaymentSplit(d, amountCents, daysElapsed) {
    const interest = d.apr ? Math.round(d.balanceCents * dailyRate(d.apr) * Math.max(0, daysElapsed)) : 0;
    const toInterest = Math.min(interest, amountCents);
    return { interestCents: toInterest, principalCents: amountCents - toInterest };
  }
  function recordDebtPayment(debt, amountCents, dueDate, accountId, payDate) {
    const today = payDate || D.today();
    if (dueDate && debtPaidFor(debt, dueDate)) return { duplicate: true, debt };
    const lastPaid = (debt.paidHistory || []).map(h => h.paidDate).sort().pop();
    // interest accrues since the last payment; for a first payment, since the
    // previous due date (when already past) or the setup date.
    const last = lastPaid ||
      (debt.nextDue && debt.nextDue < today ? debt.nextDue : null) ||
      debt.startDate || today;
    const days = Math.max(0, D.daysBetween(last, today));
    const split = debtPaymentSplit(debt, amountCents, days);
    const txn = MF.tx.create({
      type: 'expense', amountCents, date: today,
      description: (debt.name || 'Debt') + ' — payment', categoryId: 'cat_debtpayment',
      accountId, debtId: debt.id, dueDate: dueDate || null
    });
    debt.balanceCents = Math.max(0, (debt.balanceCents || 0) - split.principalCents);
    debt.totalInterestCents = (debt.totalInterestCents || 0) + split.interestCents;
    (debt.paidHistory = debt.paidHistory || []).push({
      dueDate: dueDate || today, paidDate: today, amountCents: amountCents,
      transactionId: txn.id, interestCents: split.interestCents, principalCents: split.principalCents
    });
    if (debt.balanceCents <= 0) { debt.paidOff = true; debt.paidOffDate = today; MF.emit('milestone'); }
    else if (dueDate) debt.nextDue = advanceDebt(debt, dueDate);
    MF.storage.save();
    return { debt, transaction: txn, split };
  }
  function advanceDebt(debt, from) {
    const f = debt.frequency || 'monthly';
    if (WEEK_STEP[f]) return D.addDays(from, WEEK_STEP[f]);
    if (MONTH_STEP[f]) {
      // anchor-preserving: keeps day-of-month through clamped months
      const anchorDay = +((debt.startDate || from)).slice(8, 10);
      return D.addMonthsAnchored(from, anchorDay, MONTH_STEP[f]);
    }
    return D.addMonthsAnchored(from, +((debt.startDate || from)).slice(8, 10), 1);
  }
  function debtSimulation(debts, extraCents) {
    const strategy = MF.store.settings().debtStrategy || 'snowball';
    const state = debts.filter(d => !d.paidOff && d.balanceCents > 0).map(d => {
      return { ref: d, bal: d.balanceCents, apr: d.apr || 0, min: Math.max(Math.round(d.minPaymentCents || 0), 1) };
    });
    const events = []; let interestTotal = 0; let month = 0;
    let date = D.today();
    for (; month < 480 && state.some(x => x.bal > 0); month++) {
      date = D.addMonths(date, 1);
      for (const x of state) if (x.bal > 0) {
        const it = Math.round(x.bal * (x.apr / BP) / 12);
        x.bal += it; interestTotal += it;
      }
      const order = strategy === 'avalanche'
        ? state.slice().sort((a, b) => b.apr - a.apr)
        : state.slice().sort((a, b) => a.bal - b.bal);
      for (const x of order) {
        if (x.bal <= 0) continue;
        const pay = Math.min(x.min, x.bal);
        x.bal -= pay;
        if (x.bal <= 0) events.push({ date, name: x.ref.name });
      }
      let extra = Math.max(0, extraCents || 0);
      for (const x of order) {
        if (extra <= 0) break;
        if (x.bal <= 0) continue;
        const pay = Math.min(extra, x.bal);
        extra -= pay; x.bal -= pay;
        if (x.bal <= 0) events.push({ date, name: x.ref.name });
      }
      for (const x of state) if (x.bal > 0 && x.bal < 5) x.bal = 0;
      if (month > 430) break; // never converging spiral guard
    }
    return {
      debtFreeDate: state.every(x => x.bal <= 0) ? date : null,
      interestTotal, payoffEvents: events, months: month
    };
  }

  /* ---------------- Envelopes ---------------- */
  function envelopeSpend(e) {
    const st = MF.store.settings();
    const today = D.today();
    let from;
    if (e.period === 'weekly') {
      const weekStart = st.weekStart || 0;
      const back = (D.weekday(today) - weekStart + 7) % 7;
      from = D.addDays(today, -back);
    } else if (e.period === 'biweekly') {
      const anchor = e.anchorDate || today;
      from = D.addDays(today, -(D.daysBetween(anchor, today) % 14));
    } else {
      from = today.slice(0, 8) + '01';
    }
    const spent = MF.sum(MF.store.list('transactions').filter(t =>
      t.type === 'expense' && t.date >= from && t.date <= today)
      .map(t => MF.sum(categoryParts(t).filter(p => !e.categoryId || p.categoryId === e.categoryId).map(p => p.amountCents))));
    return { spent, from, to: today };
  }

  /* ---------------- Reporting ---------------- */
  function monthSummary(month) {
    const from = month + '-01';
    const lastDay = D.daysInMonth(+month.slice(0, 4), +month.slice(5, 7) - 1);
    const to = month + '-' + String(lastDay).padStart(2, '0');
    const txns = MF.store.list('transactions').filter(t => t.date >= from && t.date <= to);
    const income = MF.sum(txns.filter(t => t.type === 'income').map(t => t.amountCents));
    const expense = MF.sum(txns.filter(t => t.type === 'expense').map(t => t.amountCents));
    const savings = MF.sum(txns.filter(t => t.type === 'transfer' && t.goalId).map(t => t.amountCents));
    const debtPaid = MF.sum(txns.filter(t => t.type === 'expense' && t.debtId).map(t => t.amountCents));
    return { from, to, income, expense, net: income - expense, savings, debtPaid, count: txns.length, transfers: MF.sum(txns.filter(t => t.type === 'transfer').map(t => t.amountCents)) };
  }
  function categoryParts(t) {
    if (t.type === 'expense' && Array.isArray(t.split) && t.split.length &&
        t.split.every(p => p && Number.isSafeInteger(p.amountCents) && p.amountCents >= 0) &&
        MF.sum(t.split.map(p => p.amountCents)) === t.amountCents) return t.split;
    return [{ categoryId: t.categoryId || 'cat_other', amountCents: t.amountCents }];
  }
  function byCategory(from, to, opts) {
    const map = new Map();
    for (const t of MF.store.list('transactions')) {
      if (t.type !== 'expense' || t.date < from || t.date > to) continue;
      for (const p of categoryParts(t)) {
        const k = p.categoryId || 'cat_other';
        map.set(k, (map.get(k) || 0) + p.amountCents);
      }
    }
    return [...map.entries()].map(([id, c]) => ({ id, cents: c, cat: MF.store.category(id) }))
      .sort((a, b) => b.cents - a.cents);
  }
  function seriesMonthly(from, to) {
    const buckets = new Map();
    for (const t of MF.store.list('transactions')) {
      if (t.date < from || t.date > to) continue;
      const m = D.monthOf(t.date);
      const b = buckets.get(m) || { income: 0, expense: 0 };
      if (t.type === 'income') b.income += t.amountCents;
      else if (t.type === 'expense') b.expense += t.amountCents;
      buckets.set(m, b);
    }
    const labels = [...buckets.keys()].sort();
    return {
      labels: labels.map(l => D.monthName(+l.slice(5, 7) - 1).slice(0, 3) + ' ' + l.slice(2, 4)),
      income: labels.map(l => buckets.get(l).income / 100),
      expense: labels.map(l => buckets.get(l).expense / 100),
      net: labels.map(l => (buckets.get(l).income - buckets.get(l).expense) / 100)
    };
  }
  function savingsSeries(from, to) {
    const goals = MF.store.list('goals');
    const events = [];
    let opening = 0;
    for (const g of goals) {
      const history = g.history || [];
      const delta = h => h.kind === 'withdraw' ? -h.amountCents : h.amountCents;
      opening += (g.savedCents || 0) - MF.sum(history.map(delta));
      for (const h of history) events.push({ date: h.date, delta: delta(h) });
    }
    events.sort((a, b) => a.date.localeCompare(b.date));
    let running = opening;
    const days = new Map();
    for (const event of events) {
      if (event.date < from) running += event.delta;
      else if (event.date <= to) days.set(event.date, (days.get(event.date) || 0) + event.delta);
    }
    const pts = [];
    if (from <= to && running !== 0 && !days.has(from)) pts.push({ x: from, y: running / 100 });
    for (const [date, delta] of days) {
      running += delta;
      pts.push({ x: date, y: running / 100 });
    }
    return { pts, total: MF.sum(goals.map(g => g.savedCents || 0)) };
  }

  MF.calc = {
    accountBalance, totalSpendable, totalNetWorth, spendableAccounts,
    nextBillDate, isBillPaidFor, billRemainingForDueDate, billsDueBetween, billsUnpaidBetween,
    billOccurrencesBetween,
    markBillPaid, unmarkBillPaid, releaseBillPayment,
    incomeOccurrences, paydaysBetween, nextPaydayAllSources, adjustWeekend,
    safeToSpend, bufferCents, monthSummary, categoryParts, byCategory, seriesMonthly, savingsSeries,
    goalEta, envelopeSpend,
    debt: { BP, dailyRate, debtPaymentSplit, debtSimulation, recordDebtPayment, releaseDebtPayment, debtPaidFor, advanceDebt }
  };
})();
</script>
<script>/* ============================================================

    plus: '<path d="M8 3v10M3 8h10"/>',
    edit: '<path d="M3 13l1-4 7.5-7.5a1.06 1.06 0 0 1 1.5 1.5L5.5 10.5z" fill="none"/>',
    trash: '<path d="M3 5h10M6 5V3h4v2M4.5 5l.7 9h5.6l.7-9" fill="none"/>',
    save: '<rect x="2" y="2" width="12" height="12" rx="2" fill="none"/><path d="M5 2v4h6V2M5 10v4h6v-4" fill="none"/>',
    check: '<path d="M3 8.5 6.5 12 13 4.5" fill="none"/>',
    close: '<path d="M4 4l8 8M12 4l-8 8"/>',
    search: '<circle cx="7" cy="7" r="4.5" fill="none"/><path d="M10.5 10.5L14 14"/>',
    menu: '<path d="M2 4h12M2 8h12M2 12h12"/>'
  };
  MF.icon = (name, cls) => '<svg class="icon ' + (cls || '') + '" viewBox="0 0 16 16" aria-hidden="true" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">' + (I[name] || I.close) + '</svg>';

  /* ---------- modal ---------- */

      document.body.appendChild(overlayEl);

  }
  MF.ui.modal = function (opts) {

    const m = document.createElement('div');
    m.className = 'modal' + (opts.wide ? ' modal-wide' : '');
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');

      '<div class="modal-head"><h3>' + eH(opts.title || '') + '</h3>' +
      '<button class="icon-btn" data-act="close" aria-label="Close">' + MF.icon('close') + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer != null ? '<div class="modal-foot">' + opts.footer + '</div>' : '');

    if (opts.footer) {

            let hidden = false;
            for (let parent = input; parent && parent !== m; parent = parent.parentElement) {

          }

  };
  function closeModal() {

  MF.ui.confirm = function (title, message, danger, okLabel) {
    return new Promise(res => {

        title,

        onOk() { done = true; closeModal(); res(true); }

        if (!document.body.contains(m) && !done) { obs.disconnect(); res(false); }
